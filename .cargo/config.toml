[build]
# Remap source paths to shorter names in panic messages
rustflags = [
    "--remap-path-prefix", "/root/.cargo/registry/src/=",
    "--remap-path-prefix", "/home/user/cranpose/=",
]

[env]
# Keep Rust and Swift on the same StoreKit 2 deployment floors. Consumer build
# integrations set these values as part of their platform configuration too.
IPHONEOS_DEPLOYMENT_TARGET = { value = "15.0", force = false }
MACOSX_DEPLOYMENT_TARGET = { value = "12.0", force = false }

[alias]
xtask = "run -p xtask --"

[target.wasm32-unknown-unknown]
rustflags = [
    "--cfg", "getrandom_backend=\"wasm_js\"",
    "--remap-path-prefix", "/root/.cargo/registry/src/=",
    "--remap-path-prefix", "/home/user/cranpose/=",
]

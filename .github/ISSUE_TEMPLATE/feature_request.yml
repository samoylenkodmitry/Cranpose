name: Feature Request
description: Suggest something Cranpose should be able to do
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build
      description: The application problem, not the API you have in mind for it.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you have to do today
      description: The workaround, and where it breaks down.
    validations:
      required: true
  - type: textarea
    id: prior-art
    attributes:
      label: Prior art
      description: How Jetpack Compose or another framework handles this, if it does.

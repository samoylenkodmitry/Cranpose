name: build one

# Reproduce a single example or platform build on demand, on a chosen runner,
# without pushing a branch and waiting for the whole fleet. This is the workflow
# to reach for when a bug report names a platform you do not have in front of
# you.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner for non-Windows targets"
        required: true
        type: choice
        options:
          - macOS
          - Linux
      target:
        description: "What to build"
        required: true
        type: choice
        options:
          - desktop
          - wasm
          - android
          - ios
          - watchos
          - robot-example
          - windows-accessibility
      example:
        description: "Robot example name (only used when target is robot-example)"
        required: false
        type: string
      run_it:
        description: "Run the robot example instead of only building it"
        required: false
        type: boolean
        default: true

concurrency:
  group: build-one-${{ github.ref }}-${{ inputs.runner }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  build:
    if: inputs.target != 'windows-accessibility'
    name: ${{ inputs.target }} on ${{ inputs.runner }}
    runs-on: >-
      ${{ inputs.runner == 'macOS'
          && fromJSON('["self-hosted", "macOS", "ARM64", "recent-repo"]')
          || fromJSON('["self-hosted", "Linux", "cranpose-heavy"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision the pinned toolchain and just
        run: |
          # Resolve the account's real home rather than trusting $HOME:
          # actions/checkout temporarily overrides HOME, and a step that runs
          # while it is overridden prepends a .cargo/bin that does not exist.
          # That is why the sccache line below survived for so long -- sccache
          # was already on the runner's own PATH, so nothing needed `cargo`
          # until another tool did, and then it failed with exit 127.
          real_home="$(eval echo "~$(id -un)")"
          export PATH="$real_home/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          echo "$real_home/.cargo/bin" >> "$GITHUB_PATH"
          command -v cargo >/dev/null || {
            echo "cargo not found. HOME=$HOME real_home=$real_home PATH=$PATH" >&2
            exit 1
          }
          scripts/ci/install_toolchains.sh
          rustc --version
          command -v just >/dev/null || cargo install just --locked

      - name: Desktop
        if: inputs.target == 'desktop'
        run: cargo build -p desktop-app

      - name: Web
        if: inputs.target == 'wasm'
        run: |
          scripts/ci/rustup_locked.sh target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.15.0 --locked
          just web

      - name: Android
        if: inputs.target == 'android'
        run: just android

      - name: iOS
        if: inputs.target == 'ios'
        run: |
          scripts/ci/rustup_locked.sh target add aarch64-apple-ios-sim
          just ios-sim

      - name: watchOS
        if: inputs.target == 'watchos'
        run: just watchos

      - name: Robot example
        if: inputs.target == 'robot-example'
        run: |
          if [ -z "${{ inputs.example }}" ]; then
            echo "target robot-example requires an example name" >&2
            exit 1
          fi
          if [ "${{ inputs.run_it }}" = "true" ]; then
            xvfb-run -a -s "-screen 0 1280x800x24" just robot-one '${{ inputs.example }}'
          else
            just robot-build
          fi

      - name: Upload robot artifacts
        if: always() && inputs.target == 'robot-example'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: robot-${{ inputs.example }}
          path: |
            robot_test.log
            robot_test_summary.txt
          if-no-files-found: ignore

  windows-accessibility:
    if: inputs.target == 'windows-accessibility'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provision just
        run: cargo install just --locked
      - name: Run native Windows accessibility and inspector robots
        run: just test-windows-accessibility
      - name: Keep Windows robot evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-accessibility
          path: target/windows-accessibility
          if-no-files-found: error

name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v0.1.0, v1.0.0, etc.
  workflow_dispatch:  # Allows manual trigger from GitHub UI

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Release publication can move a tag onto the generated version-bump
          # commit. Resolve the selected ref at job start so queued deployments
          # do not reject that intentional move as a stale event SHA.
          ref: ${{ github.ref_name }}

      - name: Install Rust (nightly for wasm-pack artifact output)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      - name: Install binaryen (wasm-opt) for size optimization
        run: |
          # Keep self-hosted jobs unprivileged. Reuse a provisioned wasm-opt
          # when available; otherwise install Binaryen 120 under RUNNER_TEMP
          # and publish that user-writable directory to subsequent steps.
          if command -v wasm-opt >/dev/null; then
            wasm-opt --version
          else
            binaryen_root="$RUNNER_TEMP/binaryen-120"
            mkdir -p "$binaryen_root"
            curl -fL --retry 3 \
              https://github.com/WebAssembly/binaryen/releases/download/version_120/binaryen-version_120-arm64-macos.tar.gz \
              | tar xz -C "$binaryen_root" --strip-components=1
            echo "$binaryen_root/bin" >> "$GITHUB_PATH"
            "$binaryen_root/bin/wasm-opt" --version
          fi

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1

      - name: Build WASM demo (optimized for size)
        run: |
          set -e
          cd apps/desktop-demo
          ./build-web.sh --release
          # Report binary size
          echo "WASM binary size:"
          ls -lh pkg/desktop_app_bg.wasm

      - name: Create deployment directory
        run: |
          mkdir -p _site
          cp -r apps/desktop-demo/pkg _site/
          cp apps/desktop-demo/index.html _site/
          # Prevent Jekyll processing
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, macOS, ARM64]
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

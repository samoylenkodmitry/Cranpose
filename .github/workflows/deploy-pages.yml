name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v0.1.0, v1.0.0, etc.
  workflow_dispatch:  # Allows manual trigger from GitHub UI

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Release publication can move a tag onto the generated version-bump
          # commit. Resolve the selected ref at job start so queued deployments
          # do not reject that intentional move as a stale event SHA.
          ref: ${{ github.ref_name }}

      - name: Provision the pinned toolchain and the wasm target
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # No nightly here. build-web.sh passes no -Z flags and does no
          # build-std, and the wasm-build job proves the same script builds on
          # the toolchain rust-toolchain.toml pins. Adding the target without
          # `--toolchain` puts it on that pinned toolchain.
          rustc --version
          rustup target add wasm32-unknown-unknown

      - name: Install binaryen (wasm-opt) for size optimization
        run: |
          # Keep self-hosted jobs unprivileged. Reuse a provisioned wasm-opt
          # when available; otherwise install Binaryen 120 under RUNNER_TEMP
          # and publish that user-writable directory to subsequent steps.
          if command -v wasm-opt >/dev/null; then
            wasm-opt --version
          else
            binaryen_root="$RUNNER_TEMP/binaryen-120"
            mkdir -p "$binaryen_root"
            curl -fL --retry 3 \
              https://github.com/WebAssembly/binaryen/releases/download/version_120/binaryen-version_120-arm64-macos.tar.gz \
              | tar xz -C "$binaryen_root" --strip-components=1
            echo "$binaryen_root/bin" >> "$GITHUB_PATH"
            "$binaryen_root/bin/wasm-opt" --version
          fi

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1

      - name: Build WASM demo (optimized for size)
        run: |
          set -e
          cd apps/desktop-demo
          ./build-web.sh --release
          # Report binary size
          echo "WASM binary size:"
          ls -lh pkg/desktop_app_bg.wasm

      - name: Create deployment directory
        run: |
          mkdir -p _site
          cp -r apps/desktop-demo/pkg _site/
          cp apps/desktop-demo/index.html _site/
          # Prevent Jekyll processing
          touch _site/.nojekyll

      - name: Provision GNU tar for the Pages uploader
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          command -v gtar >/dev/null || brew install gnu-tar
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix)/bin/gtar" --version

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, macOS, ARM64]
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

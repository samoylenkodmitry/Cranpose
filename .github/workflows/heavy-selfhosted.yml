name: heavy (self-hosted)

# The fleet workflow: Android builds and the robot suite on the repo's
# own runners. Forks are DISABLED on this repository, so pull_request
# events only ever come from the owner's branches — self-hosted execution
# is safe for every trigger.
#
# The robot suite is the most expensive job on the board, and the two Linux
# runners that carry [self-hosted, Linux, cranpose-heavy] are the whole pool
# it can use, so a prose-only pull request that occupies them delays a
# release. Both of its halves run in ONE job: they take the same exclusive
# host lock and each produces the load the other's quiet guard waits out, so
# as separate jobs they spent minutes blocking each other and occupied the
# entire Linux pool doing it. Every job here therefore checks the diff first and
# short-circuits to success on one, via scripts/ci/docs_only_change.sh.
#
# Deliberately not `paths-ignore`. A trigger filter stops the check from
# reporting at all, which turns any job that is later made a required
# status check into a permanent merge block rather than a fast one. Nothing
# on main is required today, but a `main` ruleset already exists (currently
# disabled), so the pattern that survives it being enabled is the one used
# here: run the job, decide inside it.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Supersede older runs of the same ref: fleet minutes are real machines.
concurrency:
  group: heavy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robot-linux:
    name: robot suite (self-hosted Linux)
    # X11 suite: Linux runners only — the macOS boxes serve the Android
    # builds. The workspace persists between runs on a self-hosted runner,
    # so the robot-profile target stays warm.
    runs-on: [self-hosted, Linux, cranpose-heavy]
    timeout-minutes: 20
    env:
      SCCACHE_CACHE_SIZE: 40G
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Both parents of the merge commit, for the diff below.
          fetch-depth: 2

      - name: Detect a docs-only change
        id: changes
        # Why a short-circuit and not paths-ignore: see the header.
        run: scripts/ci/docs_only_change.sh

      - name: Configure machine-local knobs
        if: steps.changes.outputs.docs_only != 'true'
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          if [[ "$RUNNER_NAME" == samarch-1-cranpose* ]]; then
            # Every runner registered on this host shares its name prefix
            # (samarch-1-cranpose, samarch-1-cranpose-2, ...) — match the
            # prefix, not one runner's exact name, so a second runner on
            # the same physical box still gets the host's real knobs
            # instead of silently falling back to defaults that lie about
            # this machine.
            #
            # This host idles near 91-93C ambient; the suite's thermal
            # governor needs both knobs raised or the resume wait arms
            # against an unreachable temperature.
            echo "CRANPOSE_HOST_MAX_TEMP_C=97" >> "$GITHUB_ENV"
            echo "CRANPOSE_HOST_RESUME_TEMP_C=93" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=/home/s/ci-cache/cranpose/sccache" >> "$GITHUB_ENV"
          fi
          echo "$(eval echo "~$(id -un)")/.cargo/bin" >> "$GITHUB_PATH"

      - name: Start sccache
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          command -v just >/dev/null || cargo install just --locked
          scripts/ci/start_sccache.sh

      - name: Run the robot suite
        if: steps.changes.outputs.docs_only != 'true'
        # The examples that assert on pixels and structure, all at once.
        # The load-sensitive half lives in nightly.yml: it runs one at a time
        # on a machine the exclusive host lock has emptied, and on a box
        # shared with nineteen other repositories' runners that is both slow
        # and unreliable. Nothing on this board stalls waiting for a quiet
        # machine.
        run: just robot-linux-fast

      - name: sccache stats
        if: always() && steps.changes.outputs.docs_only != 'true'
        run: '"$RUSTC_WRAPPER" --show-stats || true'

  ios-build:
    name: iOS build (self-hosted)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Both parents of the merge commit, for the diff below.
          fetch-depth: 2

      - name: Detect a docs-only change
        id: changes
        # Why a short-circuit and not paths-ignore: see the header.
        run: scripts/ci/docs_only_change.sh

      - name: Provision iOS Rust targets
        id: provision
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          scripts/ci/provision_toolchain.sh
          # No toolchain action here: rust-toolchain.toml owns the version and
          # the rustup shim installs it on first use. Adding targets without
          # `--toolchain` puts them on that pinned toolchain instead of on
          # whatever the runner currently calls `stable`.
          rustc --version
          rustup target add \
            aarch64-apple-ios-sim \
            aarch64-apple-ios

      - name: Clippy iOS simulator
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' && steps.changes.outputs.docs_only != 'true' }}
        run: just clippy-ios

      - name: Build iOS device binary
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' && steps.changes.outputs.docs_only != 'true' }}
        run: just ios-device

      - name: Assemble simulator app bundle
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' && steps.changes.outputs.docs_only != 'true' }}
        run: just ios-sim

  android-release:
    name: Android release build (self-hosted)
    # macOS, not the shared `cranpose-heavy` label: the Android toolchain is
    # provisioned on both, but the two Linux slots are the fleet's scarce
    # resource and the robot suite cannot run anywhere else.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    env:
      SCCACHE_CACHE_SIZE: 40G
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Both parents of the merge commit, for the diff below.
          fetch-depth: 2

      - name: Detect a docs-only change
        id: changes
        # Why a short-circuit and not paths-ignore: see the header.
        run: scripts/ci/docs_only_change.sh

      - name: Configure machine-local SDK and cache paths
        if: steps.changes.outputs.docs_only != 'true'
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          # Match the host's runner-name prefix, not one runner's exact
          # name: every runner registered on samarch-1 shares it
          # (samarch-1-cranpose, samarch-1-cranpose-2, ...).
          if [[ "$RUNNER_OS" == "Linux" && "$RUNNER_NAME" == samarch-1-cranpose* ]]; then
            sdk_root="${ANDROID_SDK_ROOT:-/home/s/develop/sdk}"
            cache_root=/home/s/ci-cache/cranpose
          elif [[ "$RUNNER_OS" == "macOS" && -d /Volumes/files/sdk ]]; then
            sdk_root=/Volumes/files/sdk
            cache_root=/Volumes/files/ci-cache/cranpose
          else
            sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
            cache_root="$HOME/ci-cache/cranpose"
          fi

          test -d "$sdk_root"
          mkdir -p "$cache_root/sccache" "$cache_root/target"
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_NDK_HOME=$sdk_root/ndk/27.0.12077973"
            echo "SCCACHE_DIR=$cache_root/sccache"
            echo "CARGO_TARGET_DIR=$cache_root/target"
          } >> "$GITHUB_ENV"
          echo "$(eval echo "~$(id -un)")/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"

      - name: Provision toolchains and start sccache
        id: provision
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          # rust-toolchain.toml owns the version; the targets land on it.
          rustc --version
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android
          command -v just >/dev/null || cargo install just --locked
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
          if [[ ! -f "$ANDROID_NDK_HOME/source.properties" ]]; then
            yes | sdkmanager "ndk;27.0.12077973"
          fi
          cargo ndk --version
          scripts/ci/start_sccache.sh
          java -version
          test -f "$ANDROID_NDK_HOME/source.properties"

      - name: Clippy Android ABIs
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' && steps.changes.outputs.docs_only != 'true' }}
        # Gradle does not deny warnings, so the APK build below cannot be the
        # zero-warning gate for this target. Runs first: a lint failure should
        # not wait behind a full release APK.
        run: just clippy-android

      - name: Type-check the Cranpose Gradle plugin
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' && steps.changes.outputs.docs_only != 'true' }}
        # Runs on pull requests too, unlike the APK below. Assembling the APK
        # is what used to compile this plugin's Kotlin, and moving that to
        # main took the only compile of it off pull requests -- a plugin with
        # two companion objects reached main before anything said so.
        run: just android-plugin-check

      - name: sccache stats
        if: always() && steps.changes.outputs.docs_only != 'true'
        run: '"$RUSTC_WRAPPER" --show-stats || true'

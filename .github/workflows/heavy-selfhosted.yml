name: heavy (self-hosted)

# The fleet workflow: Android builds and the robot suite on the repo's
# own runners. Forks are DISABLED on this repository, so pull_request
# events only ever come from the owner's branches — self-hosted execution
# is safe for every trigger.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Supersede older runs of the same ref: fleet minutes are real machines.
concurrency:
  group: heavy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robot-e2e-gpu:
    name: robot e2e (self-hosted GPU)
    # X11 suite: Linux runners only — the macOS boxes serve the Android
    # builds. The workspace persists between runs on a self-hosted runner,
    # so the robot-profile target stays warm.
    runs-on: [self-hosted, Linux, cranpose-heavy]
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 40G
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v6

      - name: Configure machine-local knobs
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          if [[ "$RUNNER_NAME" == "samarch-1-cranpose" ]]; then
            # This host idles near 91-93C ambient; the suite's thermal
            # governor needs both knobs raised or the resume wait arms
            # against an unreachable temperature.
            echo "CRANPOSE_HOST_MAX_TEMP_C=97" >> "$GITHUB_ENV"
            echo "CRANPOSE_HOST_RESUME_TEMP_C=93" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=/home/s/ci-cache/cranpose/sccache" >> "$GITHUB_ENV"
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Start sccache
        run: |
          command -v sccache >/dev/null || RUSTC_WRAPPER= cargo install sccache --locked
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Run the robot suite on the GPU
        # The suite relaxes the environment-sensitive frame-rate assertions
        # itself; the Vulkan ICD here still selects the real GPU. The three
        # external-framebuffer capture tests run in robot-capture-software
        # below: a GPU swapchain under Xvfb never lands pixels in the X
        # server's buffer, so they can only read their screenshots on
        # software present.
        run: >
          xvfb-run -a -s "-screen 0 1280x800x24" ./run_robot_test.sh
          --sequential
          --skip robot_underline_screenshot
          --skip robot_text_strikeout_presented
          --skip robot_leetcodedaily_full_layout_scroll_stability

      - name: sccache stats
        if: always()
        run: command -v sccache >/dev/null && sccache --show-stats || true

  robot-capture-software:
    name: robot external captures (software present)
    # The external-framebuffer trio reads its pixels from the X server's
    # buffer, which only software present fills under Xvfb — the GL
    # backend on llvmpipe is the fleet's cloud-equivalent path.
    runs-on: [self-hosted, Linux, cranpose-heavy]
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 40G
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v6

      - name: Configure machine-local knobs
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          if [[ "$RUNNER_NAME" == "samarch-1-cranpose" ]]; then
            echo "CRANPOSE_HOST_MAX_TEMP_C=97" >> "$GITHUB_ENV"
            echo "CRANPOSE_HOST_RESUME_TEMP_C=93" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=/home/s/ci-cache/cranpose/sccache" >> "$GITHUB_ENV"
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Start sccache
        run: |
          command -v sccache >/dev/null || RUSTC_WRAPPER= cargo install sccache --locked
          sccache --start-server || true

      - name: Run the external capture trio on software present
        env:
          WGPU_BACKEND: gl
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >
          xvfb-run -a -s "-screen 0 1600x1200x24" ./run_robot_test.sh
          --sequential
          --example robot_underline_screenshot
          --example robot_text_strikeout_presented
          --example robot_leetcodedaily_full_layout_scroll_stability

  ios-build:
    name: iOS build (self-hosted)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios

      - name: Provision iOS Rust targets
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup run stable rustc --version
          rustup target add --toolchain stable \
            aarch64-apple-ios-sim \
            aarch64-apple-ios

      - name: Clippy iOS simulator
        run: >
          cargo clippy
          -p desktop-app --bin cranpose-ios
          --target aarch64-apple-ios-sim
          --no-default-features --features ios
          -- -D warnings -A clippy::question_mark

      - name: Build iOS device binary
        run: >
          cargo build
          -p desktop-app --bin cranpose-ios
          --target aarch64-apple-ios
          --no-default-features --features ios

      - name: Assemble simulator app bundle
        run: apps/ios-demo/ios/build-app.sh aarch64-apple-ios-sim

  android-release:
    name: Android release build (self-hosted)
    runs-on: [self-hosted, cranpose-heavy]
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 40G
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Configure machine-local SDK and cache paths
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" && "$RUNNER_NAME" == "samarch-1-cranpose" ]]; then
            sdk_root="${ANDROID_SDK_ROOT:-/home/s/develop/sdk}"
            cache_root=/home/s/ci-cache/cranpose
          elif [[ "$RUNNER_OS" == "macOS" && -d /Volumes/files/sdk ]]; then
            sdk_root=/Volumes/files/sdk
            cache_root=/Volumes/files/ci-cache/cranpose
          else
            sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
            cache_root="$HOME/ci-cache/cranpose"
          fi

          test -d "$sdk_root"
          mkdir -p "$cache_root/sccache" "$cache_root/target"
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_NDK_HOME=$sdk_root/ndk/27.0.12077973"
            echo "SCCACHE_DIR=$cache_root/sccache"
            echo "CARGO_TARGET_DIR=$cache_root/target"
          } >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"

      - name: Provision toolchains and start sccache
        run: |
          rustup run stable rustc --version
          rustup target add --toolchain stable \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android
          command -v sccache >/dev/null \
            || RUSTC_WRAPPER= cargo install sccache --locked
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
          if [[ ! -f "$ANDROID_NDK_HOME/source.properties" ]]; then
            yes | sdkmanager "ndk;27.0.12077973"
          fi
          cargo ndk --version
          sccache --version
          java -version
          test -f "$ANDROID_NDK_HOME/source.properties"
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Build Android release APK
        working-directory: apps/android-demo/android
        # --no-daemon: never attach to a shared/foreign Gradle daemon on this
        # self-hosted box. Reused daemons started by other builds on the runner
        # can carry a PATH without ~/.cargo/bin, which makes the cargo-ndk check
        # (providers.exec "cargo ndk") fail spuriously. A single-use daemon
        # inherits this step's PATH (which includes ~/.cargo/bin), fixing the race.
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: sccache stats
        if: always()
        run: command -v sccache >/dev/null && sccache --show-stats || true

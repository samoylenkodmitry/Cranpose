name: Nightly

# Everything whose answer is worth having but not worth waiting for.
#
# The rest of the board answers a push in about two minutes. What lands here
# is the work that cannot, for one of two reasons:
#
#   * It measures. The robot suite's load-sensitive examples run one at a
#     time on a machine emptied by the exclusive host lock -- thirteen
#     minutes when it goes well, and on samarch-1 it often does not, because
#     that box carries nineteen other repositories' runners and the Cranpose
#     lock cannot reach them. A push-time run sat in `load_1m=23.90 over 7.20
#     on 12 cpus` waiting out a neighbour's build, and the quiet guard
#     eventually proceeds anyway printing "TREAT ANY TIMING FAILURE BELOW AS
#     UNMEASURED". Slow AND unreliable. At night the box is quiet, which is
#     the only time the number means what it says.
#
#   * It is slow and it moves slowly. Architecture budgets are five minutes
#     of `cargo check --workspace --all-features` guarding a property that
#     changes a few times a year, and they spend those minutes on the two
#     Linux slots the robot suite cannot run without.
#
# Nothing here gates a merge. A red nightly is a bug report against main, and
# the tree it names is still the tree everything else went green on.
on:
  schedule:
    # 03:07 UTC. GitHub runs scheduled workflows in UTC regardless of where
    # the fleet sits, and only from the default branch. Off the hour on
    # purpose: every scheduled workflow on the planet asks for :00.
    - cron: "7 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if tonight's nightly already succeeded"
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

# `decide` reads this workflow's own run history.
permissions:
  contents: read
  actions: read

env:
  # The self-hosted Macs' runner user has core.fsmonitor on in ~/.gitconfig,
  # which actions/checkout copies: every checkout left a watcher daemon
  # behind (over 130 on macm3), and a checkout behind a busy one hung for its
  # job's whole hour (nightly 38862621908, 2026-10-16). CI's git runs without.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.fsmonitor
  GIT_CONFIG_VALUE_0: "false"
  CARGO_TERM_COLOR: always
  SCCACHE_CACHE_SIZE: 40G
  CARGO_INCREMENTAL: "0"
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  # GitHub's schedule is free and unreliable: on the night this was added it
  # was seventeen minutes late and then never arrived at all, with the
  # workflow active, the cron valid and the file on the default branch. A
  # crontab on samarch-1 dispatches this board as well, so that a night is
  # only lost if both GitHub's scheduler and that box are down.
  #
  # Two triggers would otherwise run the whole suite twice on the two Linux
  # slots, so whichever arrives second asks whether tonight is already covered
  # and becomes a fifteen-second no-op. A failed run is not covered -- a retry
  # is what should happen.
  decide:
    name: decide whether tonight's nightly already ran
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check whether tonight's nightly already ran
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          args=(--repo "$REPO" --sha "$SHA" --run-id "$RUN_ID")
          if [ "$FORCE" = "true" ]; then
            args+=(--force)
          fi
          bash scripts/ci/nightly_should_run.sh "${args[@]}" >> "$GITHUB_OUTPUT"

  robot-suite:
    name: robot suite, both halves (linux)
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: [self-hosted, Linux, cranpose-heavy]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure machine-local knobs
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          # Match the host's runner-name prefix, not one runner's exact name:
          # every runner registered on samarch-1 shares it.
          if [[ "$RUNNER_NAME" == samarch-1-cranpose* ]]; then
            echo "CRANPOSE_HOST_MAX_TEMP_C=97" >> "$GITHUB_ENV"
            echo "CRANPOSE_HOST_RESUME_TEMP_C=93" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=/home/s/ci-cache/cranpose/sccache" >> "$GITHUB_ENV"
          fi
          echo "$(eval echo "~$(id -un)")/.cargo/bin" >> "$GITHUB_PATH"

      - name: Provision toolchain
        id: provision
        run: scripts/ci/provision_toolchain.sh

      # The serial class only. The 100 parallel-class examples ran on the
      # merge board for this same commit, in `robot-linux-fast`; running them
      # again here checks nothing new and costs both Linux slots the build of
      # 100 extra example crates. 78 + 100 = 178, so nothing goes unrun --
      # the two boards partition the suite rather than overlap it.
      - name: Run the robot suite's measuring half
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just robot-linux serial

      - name: sccache stats
        if: always()
        run: '"$RUSTC_WRAPPER" --show-stats || true'

  # What the Android library is made of, crate by crate (#796). A second
  # link of the whole program with its symbols kept: too slow for a push,
  # and the answer moves with dependencies, not with each commit. Read it in
  # the run's summary.
  android-size:
    name: Android library size by crate (macOS)
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ github.workspace }}/scripts/ci/with_host_lock.sh --shared bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure machine-local SDK and cache paths
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
        run: scripts/ci/android_env.sh

      - name: Provision toolchains and start sccache
        id: provision
        run: |
          scripts/ci/provision_toolchain.sh
          scripts/ci/rustup_locked.sh target add aarch64-linux-android
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
          test -f "$ANDROID_NDK_HOME/source.properties"

      - name: Report the library's size by crate
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just android-size-report >> "$GITHUB_STEP_SUMMARY"

      - name: sccache stats
        if: always()
        run: '"$RUSTC_WRAPPER" --show-stats || true'

  # The ESP32-S3 firmware, built with the Xtensa toolchain, linted, and booted
  # in Espressif's QEMU until it presents its first frame. The first build on
  # a runner downloads ESP-IDF, too slow for a push; `clippy-no-atomic64`
  # covers the framework crates there.
  esp32:
    name: ESP32-S3 firmware in QEMU (macOS)
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ github.workspace }}/scripts/ci/with_host_lock.sh --shared bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision the ESP32 toolchain
        id: provision
        run: |
          scripts/ci/provision_toolchain.sh
          just esp32-setup

      - name: Lint the ESP-IDF crates
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just esp32-clippy

      - name: Boot the demo in QEMU
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just esp32-qemu-check

      - name: Upload the panel picture
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: esp32-qemu-panel
          path: target/esp32/qemu.png
          if-no-files-found: ignore

  # The whole workspace on the oldest toolchain the crates declare
  # (`rust-version`, the ESP32 firmware's), so the declared minimum stays true.
  msrv:
    name: workspace on the declared minimum Rust (linux)
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: [self-hosted, Linux, cranpose-heavy]
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ github.workspace }}/scripts/ci/with_host_lock.sh --shared bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provision toolchain
        run: scripts/ci/provision_toolchain.sh
      - name: Check the workspace with the declared minimum Rust
        run: just msrv-check
      - name: Check the dependency advisories
        run: just deny-advisories

  # The supported platforms running the app, not only building it: browsers,
  # Windows and the phones (docs/platform_support.md).
  runtime-matrix:
    name: runtime matrix
    needs: decide
    if: needs.decide.outputs.run == 'true'
    uses: ./.github/workflows/runtime-matrix.yml

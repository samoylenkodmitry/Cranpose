name: Nightly

# Everything whose answer is worth having but not worth waiting for.
#
# The rest of the board answers a push in about two minutes. What lands here
# is the work that cannot, for one of two reasons:
#
#   * It measures. The robot suite's load-sensitive examples run one at a
#     time on a machine emptied by the exclusive host lock -- thirteen
#     minutes when it goes well, and on samarch-1 it often does not, because
#     that box carries nineteen other repositories' runners and the Cranpose
#     lock cannot reach them. A push-time run sat in `load_1m=23.90 over 7.20
#     on 12 cpus` waiting out a neighbour's build, and the quiet guard
#     eventually proceeds anyway printing "TREAT ANY TIMING FAILURE BELOW AS
#     UNMEASURED". Slow AND unreliable. At night the box is quiet, which is
#     the only time the number means what it says.
#
#   * It is slow and it moves slowly. Architecture budgets are five minutes
#     of `cargo check --workspace --all-features` guarding a property that
#     changes a few times a year, and they spend those minutes on the two
#     Linux slots the robot suite cannot run without.
#
# Nothing here gates a merge. A red nightly is a bug report against main, and
# the tree it names is still the tree everything else went green on.
on:
  schedule:
    # 03:07 local, off the hour: every scheduled workflow on the planet asks
    # for :00, and this fleet is shared.
    - cron: "7 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SCCACHE_CACHE_SIZE: 40G
  CARGO_INCREMENTAL: "0"
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  robot-suite:
    name: robot suite, both halves (linux)
    runs-on: [self-hosted, Linux, cranpose-heavy]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure machine-local knobs
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          # Match the host's runner-name prefix, not one runner's exact name:
          # every runner registered on samarch-1 shares it.
          if [[ "$RUNNER_NAME" == samarch-1-cranpose* ]]; then
            echo "CRANPOSE_HOST_MAX_TEMP_C=97" >> "$GITHUB_ENV"
            echo "CRANPOSE_HOST_RESUME_TEMP_C=93" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=/home/s/ci-cache/cranpose/sccache" >> "$GITHUB_ENV"
          fi
          echo "$(eval echo "~$(id -un)")/.cargo/bin" >> "$GITHUB_PATH"

      - name: Provision toolchain
        id: provision
        run: scripts/ci/provision_toolchain.sh

      - name: Run the whole robot suite
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just robot-linux

      - name: sccache stats
        if: always()
        run: '"$RUSTC_WRAPPER" --show-stats || true'

  architecture-budget:
    name: architecture budgets (linux)
    # The binary-size budget is pinned against Linux codegen.
    runs-on: [self-hosted, Linux, cranpose-heavy]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Provision toolchain
        id: provision
        run: scripts/ci/provision_toolchain.sh

      - name: Run the host capacity lock suite
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        # Here rather than on a mac: this is the machine the lock exists to
        # protect, and the only one of the two with flock(1).
        run: just test-host-lock

      - name: Check architecture budgets
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        # Featureless and all-features builds, the per-backend winit checks,
        # the duplicate-dependency budgets and the desktop binary-size ceiling.
        run: just budgets

  android-apk:
    name: Android release APK (macOS)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure machine-local SDK and cache paths
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" && -d /Volumes/files/sdk ]]; then
            sdk_root=/Volumes/files/sdk
            cache_root=/Volumes/files/ci-cache/cranpose
          else
            sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
            cache_root="$HOME/ci-cache/cranpose"
          fi

          test -d "$sdk_root"
          mkdir -p "$cache_root/sccache" "$cache_root/target"
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_NDK_HOME=$sdk_root/ndk/27.0.12077973"
            echo "SCCACHE_DIR=$cache_root/sccache"
            echo "CARGO_TARGET_DIR=$cache_root/target"
          } >> "$GITHUB_ENV"
          echo "$(eval echo "~$(id -un)")/.cargo/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"

      - name: Provision toolchains and start sccache
        id: provision
        run: |
          scripts/ci/provision_toolchain.sh
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
          test -f "$ANDROID_NDK_HOME/source.properties"

      - name: Build Android release APK
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        # A pull request gets `clippy-android` and the plugin's Kotlin; this
        # is the one step that proves the Gradle and packaging side, and
        # nothing about that answer depends on the branch.
        run: just android

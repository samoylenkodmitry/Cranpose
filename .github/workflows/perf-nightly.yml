name: perf nightly

# The Mate 20 X and Mi TV Stick measure the same signed framework APKs.
# macm3 builds the other frameworks and measures their desktop and browser
# apps. The Mate also measures Chrome and compares Cranpose main with the
# latest release. Both ESP32 boards measure their own firmware on samarch-1.
# The Performance tab reads the published results from the perf-data branch.

on:
  # GitHub's schedule did not fire this workflow on its first nights, so a
  # crontab on samarch-1 dispatches it at 02:00 UTC as well. The schedule
  # fires hours late, when macm3's exclusive measurements would starve the
  # mac jobs of the working day, so a scheduled run skips once tonight's
  # dispatch succeeded. A dispatch skips a main this Mac already measured.
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      git_pins:
        description: >-
          Also move the frameworks that publish no release (Rune, zgui) to
          their repository's latest commit, in the same pull request
        type: boolean
        default: false

# `decide` reads this workflow's own run history.
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: perf-nightly
  cancel-in-progress: false

env:
  # The self-hosted Macs' runner user has core.fsmonitor on in ~/.gitconfig,
  # which actions/checkout copies: every checkout left a watcher daemon
  # behind (over 130 on macm3), and a checkout behind a busy one hung for its
  # job's whole hour (nightly 38862621908, 2026-10-16). CI's git runs without.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.fsmonitor
  GIT_CONFIG_VALUE_0: "false"

jobs:
  decide:
    name: decide whether tonight's nightly already ran
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check whether tonight's nightly already ran
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          args=(--repo "$REPO" --sha "$SHA" --run-id "$RUN_ID" --workflow perf-nightly.yml --event "$EVENT")
          # Only the late schedule is a duplicate; a dispatch always measures.
          if [ "$EVENT" != "schedule" ]; then
            args+=(--force)
          fi
          bash scripts/ci/nightly_should_run.sh "${args[@]}" >> "$GITHUB_OUTPUT"

  desktop:
    name: frameworks on a Mac desktop (macm3)
    needs: decide
    if: needs.decide.outputs.run == 'true'
    # macm3's runners carry `recent-repo`; the Mac the phone is attached to
    # does not.
    runs-on: [self-hosted, macOS, ARM64, recent-repo]
    timeout-minutes: 150
    defaults:
      run:
        shell: ${{ github.workspace }}/scripts/ci/with_host_lock.sh --shared bash --noprofile --norc -eo pipefail {0}
    outputs:
      measured: ${{ steps.published.outputs.measured }}
      apks: ${{ steps.apks.outputs.handed }}
      browser: ${{ steps.pages.outputs.handed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use the same triggering revision as the board jobs, with its release tags.
          fetch-depth: 0

      - name: Configure machine-local SDK and cache paths
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
        run: scripts/ci/android_env.sh

      - name: Skip a main already measured on the desktop and both Android devices
        id: published
        # A night asked to move the commit pins measures again.
        if: ${{ !inputs.git_pins }}
        run: |
          chip="$(sysctl -n machdep.cpu.brand_string)"
          chrome="$(defaults read '/Applications/Google Chrome.app/Contents/Info' CFBundleShortVersionString | cut -d. -f1)"
          revision=$(git rev-parse HEAD)
          if python3 scripts/perf/publish.py --published frameworks "$chip" "$revision" \
              && python3 scripts/perf/publish.py --published browser "$chip · Chrome $chrome" "$revision" \
              && python3 scripts/perf/publish.py --published frameworks "EVR-AL00" "$revision" \
              && python3 scripts/perf/publish.py --published frameworks "MiTV-AYFR0" "$revision"; then
            echo "measured=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Provision toolchains
        if: steps.published.outputs.measured != 'yes'
        run: |
          scripts/ci/install_toolchains.sh
          scripts/ci/rustup_locked.sh target add aarch64-linux-android armv7-linux-androideabi
          command -v just >/dev/null || cargo install just --locked
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
          # The CPU and GPU clocks each desktop leg records.
          command -v macmon >/dev/null || brew install macmon
          # Fyne's apps build with Go.
          command -v go >/dev/null || brew install go

      - name: Move every framework to its latest release
        if: steps.published.outputs.measured != 'yes'
        env:
          GIT_PINS: ${{ inputs.git_pins && '--git-pins' || '' }}
        run: python3 benchmarks/compose-vs-cranpose/versions.py bump $GIT_PINS --record "$RUNNER_TEMP/bumps.json"

      - name: Build every framework's apps
        if: steps.published.outputs.measured != 'yes'
        run: |
          # The build caches sit beside the runner's other caches; a moved
          # pin that does not build is put back.
          export PERF_BUILD_CACHE="$(dirname "$SCCACHE_DIR")/gauntlet"
          export PERF_BUMPS="$RUNNER_TEMP/bumps.json"
          benchmarks/compose-vs-cranpose/build_apps.sh desktop
          benchmarks/compose-vs-cranpose/build_apps.sh android "$RUNNER_TEMP/gauntlet-apks"
          benchmarks/compose-vs-cranpose/build_apps.sh browser "$RUNNER_TEMP/gauntlet-browser"
          benchmarks/compose-vs-cranpose/build_apps.sh release "$(git describe --tags --abbrev=0 --match 'v*')"

      - name: Hand the Android apps to the phone's job
        if: steps.published.outputs.measured != 'yes'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gauntlet-apks
          # The builds and `versions.json`, the version each was built with.
          path: ${{ runner.temp }}/gauntlet-apks/
          retention-days: 2

      - name: Hand the browser builds to the phone's job
        if: steps.published.outputs.measured != 'yes'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gauntlet-browser
          # Each app's page and `versions.json`, the version each was built with.
          path: ${{ runner.temp }}/gauntlet-browser/
          retention-days: 2

      # The phone measures the apps whatever becomes of the desktop run.
      - name: Note the handover
        id: apks
        if: steps.published.outputs.measured != 'yes'
        run: echo "handed=yes" >> "$GITHUB_OUTPUT"

      - name: Note the browser handover
        id: pages
        if: steps.published.outputs.measured != 'yes'
        run: echo "handed=yes" >> "$GITHUB_OUTPUT"

      - name: Measure the desktop apps
        if: steps.published.outputs.measured != 'yes'
        # Outside the job's shared lock: a measurement empties the machine.
        # desktop.py also asks the display for its state and for how often
        # the window server composites it with nothing but a quiet window on
        # it; a display that is asleep or not at 60 Hz, or that something
        # moves on (a video, a permission prompt), ends the step with an error
        # before it measures, or after it ran, and nothing is published.
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          scripts/ci/with_host_lock.sh --exclusive python3 benchmarks/compose-vs-cranpose/desktop.py \
            --output "$RUNNER_TEMP/desktop" --scenario gauntlet:16 --scenario wall:20 --scenario patchwork:17 --main "$(git rev-parse HEAD)" \
            --release "$(git describe --tags --abbrev=0 --match 'v*')"

      - name: Publish the desktop run
        if: steps.published.outputs.measured != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: just perf-publish "$RUNNER_TEMP/desktop/report.json"

      - name: Measure the browser apps in Chrome
        if: steps.published.outputs.measured != 'yes'
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          scripts/ci/with_host_lock.sh --exclusive python3 benchmarks/compose-vs-cranpose/desktop.py \
            --output "$RUNNER_TEMP/desktop-browser" --browser "$RUNNER_TEMP/gauntlet-browser" \
            --scenario gauntlet:16 --scenario wall:20 --main "$(git rev-parse HEAD)"

      - name: Publish the browser run
        if: steps.published.outputs.measured != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: just perf-publish "$RUNNER_TEMP/desktop-browser/report.json"

      - name: Propose the pins that moved
        if: steps.published.outputs.measured != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/perf/propose_versions.py --record "$RUNNER_TEMP/bumps.json"

      - name: Keep the run
        if: ${{ !cancelled() && steps.published.outputs.measured != 'yes' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-nightly-desktop
          # The apps' own logs too: a leg that failed says why there.
          path: |
            ${{ runner.temp }}/desktop*/**/*.json
            ${{ runner.temp }}/desktop*/**/*.log
          retention-days: 30

  esp32:
    name: firmware on ${{ matrix.board }}
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: [self-hosted, Linux, samarch1]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # The builds share the host's ESP-IDF installation.
      max-parallel: 1
      matrix:
        board: [es3c35p, e32r35t]
    defaults:
      run:
        shell: ${{ github.workspace }}/scripts/ci/with_host_lock.sh --shared bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure the board toolchain
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          scripts/esp32/setup.sh --boards-only
      - name: Measure both boots of each firmware
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          BOARD: ${{ matrix.board }}
        run: just perf-esp32 "$BOARD" "$RUNNER_TEMP/esp32-$GITHUB_RUN_ID-$BOARD"
      - name: Publish the board results
        env:
          GH_TOKEN: ${{ github.token }}
          BOARD: ${{ matrix.board }}
        run: just perf-publish "$RUNNER_TEMP/esp32-$GITHUB_RUN_ID-$BOARD/report.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: perf-${{ matrix.board }}
          path: |
            ${{ runner.temp }}/esp32-${{ github.run_id }}-${{ matrix.board }}/*.log
            ${{ runner.temp }}/esp32-${{ github.run_id }}-${{ matrix.board }}/*.build
            ${{ runner.temp }}/esp32-${{ github.run_id }}-${{ matrix.board }}/*.json
          retention-days: 30

  android:
    name: release against main on Mate 20 X and frameworks on both Android devices
    needs: [decide, desktop]
    # The release against main runs whatever became of the desktop job.
    if: ${{ !cancelled() && needs.decide.outputs.run == 'true' }}
    # The Mac the Mate 20 X is attached to; its runner takes jobs while the
    # Mac sits idle on power.
    runs-on: [self-hosted, macOS, ARM64, idle-mac]
    timeout-minutes: 180
    defaults:
      run:
        shell: ${{ github.workspace }}/scripts/ci/with_host_lock.sh --shared bash --noprofile --norc -eo pipefail {0}
    env:
      PERF_SERIAL: LKN5T19419001735
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The APKs and firmware must describe the same revision even if main advances.
          fetch-depth: 0

      - name: Name the run's folder
        run: echo "PERF_OUTPUT=$RUNNER_TEMP/perf-nightly-$GITHUB_RUN_ID" >> "$GITHUB_ENV"

      - name: Configure machine-local SDK and cache paths
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
        run: scripts/ci/android_env.sh

      - name: Provision toolchains
        run: |
          scripts/ci/install_toolchains.sh
          scripts/ci/rustup_locked.sh target add aarch64-linux-android armv7-linux-androideabi
          command -v just >/dev/null || cargo install just --locked
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      - name: Build both apps and compare them
        run: just perf-nightly "$PERF_SERIAL" "$PERF_OUTPUT"

      - name: Publish the run
        env:
          GH_TOKEN: ${{ github.token }}
        run: just perf-publish "$PERF_OUTPUT/run.json"

      - name: Report confirmed regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: just perf-report "$PERF_OUTPUT/run.json"

      - name: Fetch the other frameworks' apps
        if: ${{ !cancelled() && needs.desktop.outputs.apks == 'yes' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gauntlet-apks
          path: ${{ env.PERF_OUTPUT }}/apks

      - name: Add Cranpose to the APKs for both devices
        id: framework_apks
        if: ${{ !cancelled() && needs.desktop.outputs.apks == 'yes' }}
        run: just perf-framework-apks "$PERF_OUTPUT/apks"

      - name: Compare the frameworks on the phone
        if: ${{ !cancelled() && steps.framework_apks.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          just perf-measure-frameworks "$PERF_OUTPUT/frameworks" "$PERF_OUTPUT/apks" "$PERF_SERIAL"
          just perf-publish "$PERF_OUTPUT/frameworks/frameworks.json"

      - name: Compare the same APKs on the Mi TV Stick
        if: ${{ !cancelled() && steps.framework_apks.outcome == 'success' }}
        env:
          MI_TV_ENDPOINT: ${{ vars.MI_TV_ENDPOINT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          just perf-mi-tv "$PERF_OUTPUT/mi-tv" "$PERF_OUTPUT/apks"
          just perf-publish "$PERF_OUTPUT/mi-tv/frameworks.json"

      - name: Fetch the browser builds
        if: ${{ !cancelled() && needs.desktop.outputs.browser == 'yes' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gauntlet-browser
          path: ${{ runner.temp }}/gauntlet-browser

      - name: Compare the browser apps in Chrome on the phone
        if: ${{ !cancelled() && needs.desktop.outputs.browser == 'yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          just perf-browser "$PERF_SERIAL" "$PERF_OUTPUT/browser" "$RUNNER_TEMP/gauntlet-browser"
          just perf-publish "$PERF_OUTPUT/browser/frameworks.json"

      - name: Keep the run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-nightly
          path: ${{ env.PERF_OUTPUT }}/**/*.json
          retention-days: 30

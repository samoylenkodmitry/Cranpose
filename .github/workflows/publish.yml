name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync_versions:
    name: Sync versions with tag
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: write
    outputs:
      should_publish: ${{ steps.sync.outputs.should_publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Provision the pinned Rust toolchain
        run: |
          # $HOME is not reliable here: actions/checkout temporarily overrides
          # it, so resolve the account's real home instead.
          real_home="$(eval echo "~$(id -un)")"
          export PATH="$real_home/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          echo "$real_home/.cargo/bin" >> "$GITHUB_PATH"
          # Named step so the pinned toolchain's first-use download shows up
          # here rather than inside whichever cargo step ran first.
          rustc --version

      - name: Sync Cargo versions with tag
        id: sync
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IS_TAG_PUSH: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          tag="${TAG_NAME}"
          if [[ "$tag" != v* ]]; then
            echo "Expected tag starting with 'v', got '$tag'" >&2
            exit 1
          fi
          git fetch origin "$DEFAULT_BRANCH"
          git checkout "$DEFAULT_BRANCH"

          tag_commit="$(git rev-list -n 1 "$tag")"
          branch_commit="$(git rev-parse HEAD)"
          if [[ "$IS_TAG_PUSH" == "true" && "$tag_commit" != "$branch_commit" ]]; then
            echo "Tag $tag must be created from $DEFAULT_BRANCH HEAD." >&2
            exit 1
          fi

          cargo xtask bump-release-version "$tag"

          # Do not update the isolated crates.io consumer before publishing.
          # At this point the tagged version does not exist in the registry;
          # suppressing that resolver failure and rewriting lockfile version
          # strings would leave stale checksums. Update the isolated demo only
          # after every crate in this release is available on crates.io.

          if git diff --quiet; then
            echo "No version changes needed for ${tag}."
          elif [[ "$IS_TAG_PUSH" == "true" ]]; then
            # A bare web-UI tag on an unbumped main is the NORMAL release
            # flow: land the bump on the default branch and move the tag
            # onto it so the tag tree matches the published crates. Pushes
            # made with GITHUB_TOKEN do not retrigger workflows, so the
            # moved tag cannot recurse into a second Publish run.
            git diff --stat -- Cargo.toml Cargo.lock
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock
            git commit -m "release: ${tag}"
            if ! git push origin "HEAD:$DEFAULT_BRANCH"; then
              echo "$DEFAULT_BRANCH moved while preparing ${tag}; re-tag from the new HEAD." >&2
              exit 1
            fi
            git tag -f "$tag" HEAD
            git push origin -f "refs/tags/$tag"
            echo "Landed release metadata for ${tag} on $DEFAULT_BRANCH and moved the tag."
          else
            git diff -- Cargo.toml Cargo.lock
            echo "$DEFAULT_BRANCH must already contain the release metadata for ${tag} for a manual dispatch." >&2
            exit 1
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to crates.io
    runs-on: [self-hosted, macOS, ARM64]
    needs: sync_versions
    if: needs.sync_versions.outputs.should_publish == 'true'
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Provision the pinned Rust toolchain
        run: |
          # $HOME is not reliable here: actions/checkout temporarily overrides
          # it, so resolve the account's real home instead.
          real_home="$(eval echo "~$(id -un)")"
          export PATH="$real_home/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          echo "$real_home/.cargo/bin" >> "$GITHUB_PATH"
          # Named step so the pinned toolchain's first-use download shows up
          # here rather than inside whichever cargo step ran first.
          rustc --version

      - name: Verify tag and workspace versions
        run: |
          git fetch --tags origin
          tag_commit="$(git rev-list -n 1 "$TAG_NAME")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$tag_commit" != "$head_commit" ]; then
            echo "Tag $TAG_NAME does not point to HEAD." >&2
            exit 1
          fi
          cargo xtask verify-tag "$TAG_NAME"

      - name: Publish crates (skip existing versions)
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"

          cargo xtask publish-order

          crate_exists() {
            cargo xtask crate-published "$1" "$2"
          }

          publish_if_needed() {
            local crate="$1"
            if crate_exists "$crate" "$version"; then
              echo "Skipping ${crate} ${version} (already published)."
              return 0
            else
              local rc=$?
              if [ "$rc" -ne 1 ]; then
                echo "Failed to determine publish status for ${crate} ${version}." >&2
                exit 1
              fi
            fi
            cargo publish -p "$crate"
          }

          while IFS= read -r crate; do
            publish_if_needed "$crate"
          done < publish-order.txt

  bump_isolated_demo:
    name: Point isolated demo at the release
    runs-on: [self-hosted, macOS, ARM64]
    needs: publish
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Provision the pinned Rust toolchain
        run: |
          # $HOME is not reliable here: actions/checkout temporarily overrides
          # it, so resolve the account's real home instead.
          real_home="$(eval echo "~$(id -un)")"
          export PATH="$real_home/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          echo "$real_home/.cargo/bin" >> "$GITHUB_PATH"
          # Named step so the pinned toolchain's first-use download shows up
          # here rather than inside whichever cargo step ran first.
          rustc --version

      # apps/isolated-demo is the canary that proves a release is consumable
      # from crates.io, so `sync_versions` deliberately leaves it alone before
      # publishing (the version does not exist in the registry yet). Bump it
      # here instead — otherwise `cargo xtask versions` fails and main goes
      # red after every release until someone edits it by hand.
      - name: Wait for crates.io to serve the release
        run: |
          set -euo pipefail
          cargo xtask wait-for-crates-io "$TAG_NAME"

      - name: Point the isolated demo at the release
        id: point
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          cargo xtask sync-isolated-demo "$version"
          # `cargo fetch`, not `cargo update`. The manifest has just been
          # bumped, so the lock no longer satisfies it and something has to
          # re-resolve; the two commands differ in how much.
          #
          # `cargo update -p cranpose -p cranpose-core` cannot do it -- the
          # spec names a version the lock has never seen, and it fails with
          # "package ID specification `cranpose` did not match any packages",
          # which is what once left a tag published and the demo still asking
          # for the release before it.
          #
          # Bare `cargo update` does it by updating EVERYTHING to the newest
          # compatible version. One release did that to 135 third-party crates
          # at once and put 336 KB into the demo binary, over the size budget,
          # from a step whose job was to change one number.
          #
          # `cargo fetch` resolves conservatively: it moves what the new
          # requirement forces and leaves every other lock entry alone. Bump
          # dependencies deliberately, in their own commit, where the size and
          # dependency budgets can say what the bump cost.
          cargo fetch --manifest-path apps/isolated-demo/Cargo.toml

      - name: Land the bump on the default branch
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/isolated-demo; then
            echo "Isolated demo already points at ${TAG_NAME}."
            exit 0
          fi
          git diff --stat -- apps/isolated-demo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/isolated-demo
          git commit -m "chore: point isolated demo at ${TAG_NAME}"
          # Pushes made with GITHUB_TOKEN do not retrigger workflows, so this
          # cannot recurse into another Publish run.
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"

      # Bumping the version only claims the release is consumable. Building
      # proves it, and this is the one place it can be proved: apps/isolated-demo
      # resolves `cranpose` from crates.io and the Gradle plugin by version, the
      # way a project copied out of this repository does. A release that cannot
      # be built this way is broken for every application that is not this
      # repository, and nothing else in the pipeline would notice.
      - name: Build the isolated demo against the release
        if: ${{ !cancelled() && steps.point.conclusion == 'success' }}
        run: |
          set -euo pipefail
          cargo build --manifest-path apps/isolated-demo/Cargo.toml \
            --features desktop --release

      # The web is the one target whose build can differ from this
      # repository's own: `apps/desktop-demo` compiles under the cargo
      # configuration checked in here, and an application compiles under its
      # own. apps/isolated-demo carries no cargo configuration, so this is the
      # only place a release is proven to build for the browser the way an
      # application builds it.
      - name: Build the isolated demo for the web
        if: ${{ !cancelled() && steps.point.conclusion == 'success' }}
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          command -v wasm-pack >/dev/null || cargo install wasm-pack --version 0.13.1 --locked
          apps/isolated-demo/build-web.sh

      # The Gradle plugin has no Maven coordinate: apps/isolated-demo/android's
      # settings.gradle.kts locates the `cranpose` crate cargo just resolved
      # from crates.io (see the "Point the isolated demo at the release" step
      # above) and includes the plugin straight from that source. Nothing to
      # publish or pre-seed here first. ANDROID_HOME comes from the runner's
      # own environment; setting it here would override a working one with an
      # empty string.
      - name: Build the isolated demo's Android release
        if: ${{ !cancelled() && steps.point.conclusion == 'success' }}
        run: |
          set -euo pipefail
          ./apps/isolated-demo/android/gradlew \
            -p apps/isolated-demo/android :app:assembleRelease

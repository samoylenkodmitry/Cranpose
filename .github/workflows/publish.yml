name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync_versions:
    name: Sync versions with tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_publish: ${{ steps.sync.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Sync Cargo versions with tag
        id: sync
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IS_TAG_PUSH: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          tag="${TAG_NAME}"
          if [[ "$tag" != v* ]]; then
            echo "Expected tag starting with 'v', got '$tag'" >&2
            exit 1
          fi
          version="${tag#v}"

          git fetch origin "$DEFAULT_BRANCH"
          git checkout "$DEFAULT_BRANCH"

          tag_commit="$(git rev-list -n 1 "$tag")"
          branch_commit="$(git rev-parse HEAD)"
          if [[ "$IS_TAG_PUSH" == "true" && "$tag_commit" != "$branch_commit" ]]; then
            echo "Tag $tag must be created from $DEFAULT_BRANCH HEAD." >&2
            exit 1
          fi

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["TAG_NAME"]
          if not tag.startswith("v"):
              raise SystemExit(f"Expected tag starting with 'v', got '{tag}'")
          version = tag[1:]

          path = Path("Cargo.toml")
          text = path.read_text()
          original = text
          lines = text.splitlines(keepends=True)

          def find_section_header(lines, section):
              header = f"[{section}]"
              for i, line in enumerate(lines):
                  if line.strip() == header:
                      return i
              return None

          def find_section_bounds(lines, section):
              header_index = find_section_header(lines, section)
              if header_index is None:
                  raise SystemExit(f"Missing [{section}] in Cargo.toml")
              start = header_index + 1
              end = len(lines)
              for j in range(start, len(lines)):
                  stripped = lines[j].strip()
                  if stripped.startswith("[") and stripped.endswith("]"):
                      end = j
                      break
              return start, end

          def ensure_workspace_package(lines):
              header_index = find_section_header(lines, "workspace.package")
              if header_index is not None:
                  return

              workspace_header = find_section_header(lines, "workspace")
              if workspace_header is None:
                  raise SystemExit("Missing [workspace] in Cargo.toml")
              ws_start, ws_end = find_section_bounds(lines, "workspace")
              insert_at = ws_end

              block = []
              if insert_at > 0 and lines[insert_at - 1].strip():
                  block.append("\n")
              block.extend(
                  [
                      "[workspace.package]\n",
                      f"version = \"{version}\"\n",
                      "edition = \"2021\"\n",
                      "license = \"Apache-2.0\"\n",
                      "repository = \"https://github.com/samoylenkodmitry/cranpose\"\n",
                      "homepage = \"https://samoylenkodmitry.github.io/cranpose/\"\n",
                      "\n",
                  ]
              )
              lines[insert_at:insert_at] = block

          def update_workspace_package(lines):
              ensure_workspace_package(lines)
              start, end = find_section_bounds(lines, "workspace.package")
              new_lines = []
              version_written = False
              for line in lines[start:end]:
                  if re.match(r"\s*version\s*=", line):
                      if not version_written:
                          indent = re.match(r"^\s*", line).group(0)
                          new_lines.append(f"{indent}version = \"{version}\"\n")
                          version_written = True
                      continue
                  if re.match(r"\s*version\.", line):
                      continue
                  new_lines.append(line)
              if not version_written:
                  new_lines.insert(0, f"version = \"{version}\"\n")
              lines[start:end] = new_lines

          def update_workspace_deps(lines):
              start, end = find_section_bounds(lines, "workspace.dependencies")
              mismatches = []
              for i in range(start, end):
                  line = lines[i]
                  if not re.match(r"\s*cranpose[\w-]*\s*=\s*\{", line):
                      continue
                  if re.search(r'version\s*=\s*"[^"]+"', line) is None:
                      mismatches.append(line.strip())
                      continue
                  lines[i] = re.sub(
                      r'(version\s*=\s*")[^"]+("\s*)',
                      rf"\g<1>{version}\g<2>",
                      line,
                  )
                  if re.search(rf'version\s*=\s*"{re.escape(version)}"', lines[i]) is None:
                      mismatches.append(lines[i].strip())
              if mismatches:
                  joined = "\n".join(mismatches)
                  raise SystemExit(
                      "Some cranpose workspace dependencies were not updated:\n"
                      + joined
                  )

          update_workspace_package(lines)
          update_workspace_deps(lines)

          text = "".join(lines)
          if text != original:
              path.write_text(text)
          PY

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["TAG_NAME"][1:]
          lock_path = Path("Cargo.lock")
          if not lock_path.exists():
              raise SystemExit("Cargo.lock not found")

          lines = lock_path.read_text().splitlines(keepends=True)
          in_package = False
          update_version = False

          for i, line in enumerate(lines):
              stripped = line.strip()
              if stripped == "[[package]]":
                  in_package = True
                  update_version = False
                  continue
              if in_package and stripped.startswith("[") and stripped.endswith("]"):
                  in_package = False
                  update_version = False
                  continue
              if in_package and stripped.startswith("name = "):
                  name = stripped.split("=", 1)[1].strip().strip('"')
                  update_version = name.startswith("cranpose")
                  continue
              if in_package and update_version and stripped.startswith("version = "):
                  indent = re.match(r"^\s*", line).group(0)
                  lines[i] = f'{indent}version = "{version}"\n'
                  update_version = False

          lock_path.write_text("".join(lines))
          PY

          # Update isolated-demo to point to latest cranpose version
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["TAG_NAME"][1:]
          toml_path = Path("apps/isolated-demo/Cargo.toml")
          text = toml_path.read_text()
          text = re.sub(
              r'(cranpose\s*=\s*\{\s*version\s*=\s*")[^"]+(")',
              rf"\g<1>{version}\g<2>",
              text,
          )
          text = re.sub(
              r'(cranpose-core\s*=\s*")[^"]+(")',
              rf"\g<1>{version}\g<2>",
              text,
          )
          toml_path.write_text(text)
          PY

          # Update isolated-demo lockfile
          (cd apps/isolated-demo && cargo update -p cranpose -p cranpose-core 2>/dev/null || true)

          if git diff --quiet; then
            echo "No version changes needed for ${tag}."
          elif [[ "$IS_TAG_PUSH" == "true" ]]; then
            # A bare web-UI tag on an unbumped main is the NORMAL release
            # flow: land the bump on the default branch and move the tag
            # onto it so the tag tree matches the published crates. Pushes
            # made with GITHUB_TOKEN do not retrigger workflows, so the
            # moved tag cannot recurse into a second Publish run.
            git diff --stat -- Cargo.toml Cargo.lock apps/isolated-demo/Cargo.toml apps/isolated-demo/Cargo.lock
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock apps/isolated-demo/Cargo.toml apps/isolated-demo/Cargo.lock
            git commit -m "release: ${tag}"
            if ! git push origin "HEAD:$DEFAULT_BRANCH"; then
              echo "$DEFAULT_BRANCH moved while preparing ${tag}; re-tag from the new HEAD." >&2
              exit 1
            fi
            git tag -f "$tag" HEAD
            git push origin -f "refs/tags/$tag"
            echo "Landed release metadata for ${tag} on $DEFAULT_BRANCH and moved the tag."
          else
            git diff -- Cargo.toml Cargo.lock apps/isolated-demo/Cargo.toml apps/isolated-demo/Cargo.lock
            echo "$DEFAULT_BRANCH must already contain the release metadata for ${tag} for a manual dispatch." >&2
            exit 1
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: sync_versions
    if: needs.sync_versions.outputs.should_publish == 'true'
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify tag and workspace versions
        run: |
          git fetch --tags origin
          tag_commit="$(git rev-list -n 1 "$TAG_NAME")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$tag_commit" != "$head_commit" ]; then
            echo "Tag $TAG_NAME does not point to HEAD." >&2
            exit 1
          fi
          python - <<'PY'
          import os
          import sys
          import tomllib

          tag = os.environ.get("TAG_NAME", "")
          if not tag.startswith("v"):
              sys.exit(f"Expected tag starting with 'v', got '{tag}'")
          tag_version = tag[1:]

          with open("Cargo.toml", "rb") as handle:
              data = tomllib.load(handle)

          workspace_version = data["workspace"]["package"]["version"]
          if tag_version != workspace_version:
              sys.exit(
                  f"Tag version v{tag_version} does not match workspace version {workspace_version}"
              )

          deps = data["workspace"].get("dependencies", {})
          mismatches = []
          for name, spec in deps.items():
              if not name.startswith("cranpose"):
                  continue
              if isinstance(spec, str):
                  dep_version = spec
              else:
                  dep_version = spec.get("version")
              if dep_version != workspace_version:
                  mismatches.append(f"{name} => {dep_version}")

          if mismatches:
              joined = "\n".join(mismatches)
              sys.exit(
                  "Workspace dependency versions must match workspace version:\n"
                  + joined
              )

          print(f"Tag v{tag_version} matches workspace version {workspace_version}")
          PY

      - name: Publish crates (skip existing versions)
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"

          cargo metadata --format-version 1 --no-deps > publish-metadata.json
          python - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("publish-metadata.json").read_text())
          workspace_members = set(metadata["workspace_members"])
          member_index = {package_id: index for index, package_id in enumerate(metadata["workspace_members"])}

          packages = {}
          package_order = {}
          for package in metadata["packages"]:
              if package["id"] not in workspace_members:
                  continue
              if not package["name"].startswith("cranpose"):
                  continue
              packages[package["name"]] = package
              package_order[package["name"]] = member_index[package["id"]]

          remaining = {}
          for name, package in packages.items():
              # Dev-deps never gate publish order (path-only dev-deps are
              # stripped from published manifests); counting them creates
              # false cycles like liquid -> testing -> cranpose -> liquid.
              remaining[name] = {
                  dependency["name"]
                  for dependency in package["dependencies"]
                  if dependency["name"] in packages
                  and dependency.get("kind") != "dev"
              }

          order = []
          while remaining:
              ready = sorted(
                  [name for name, dependencies in remaining.items() if not dependencies],
                  key=lambda name: (package_order[name], name),
              )
              if not ready:
                  cycle = ", ".join(sorted(remaining))
                  raise SystemExit(f"Cyclic cranpose publish dependencies: {cycle}")

              for name in ready:
                  order.append(name)
                  del remaining[name]
              for dependencies in remaining.values():
                  dependencies.difference_update(ready)

          Path("publish-order.txt").write_text("\n".join(order) + "\n")
          print("Resolved publish order:")
          for name in order:
              print(f"  {name}")
          PY

          crate_exists() {
            python - "$1" "$2" <<'PY'
          import sys
          import urllib.error
          import urllib.request

          crate, version = sys.argv[1], sys.argv[2]
          url = f"https://crates.io/api/v1/crates/{crate}/{version}"
          try:
              with urllib.request.urlopen(url) as resp:
                  if resp.status == 200:
                      sys.exit(0)
                  sys.exit(2)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  sys.exit(1)
              print(f"Unexpected response for {crate} {version}: {exc}", file=sys.stderr)
              sys.exit(2)
          except Exception as exc:
              print(f"Failed to query crates.io for {crate} {version}: {exc}", file=sys.stderr)
              sys.exit(2)
          PY
          }

          publish_if_needed() {
            local crate="$1"
            if crate_exists "$crate" "$version"; then
              echo "Skipping ${crate} ${version} (already published)."
              return 0
            else
              local rc=$?
              if [ "$rc" -ne 1 ]; then
                echo "Failed to determine publish status for ${crate} ${version}." >&2
                exit 1
              fi
            fi
            cargo publish -p "$crate"
          }

          while IFS= read -r crate; do
            publish_if_needed "$crate"
          done < publish-order.txt

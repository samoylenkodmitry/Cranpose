name: Release Artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: cranpose-demo-linux-x86_64

          - name: macos-aarch64
            runner: [self-hosted, macOS, ARM64]
            target: aarch64-apple-darwin
            artifact_name: cranpose-demo-macos-aarch64

          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: cranpose-demo-windows-x86_64

    steps:
      - uses: actions/checkout@v6
        with:
          # publish.yml may move the release tag onto its generated version-bump
          # commit while this matrix is queued. Resolve the tag when the runner
          # starts instead of pinning checkout to the event's original SHA.
          ref: ${{ github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # dist-min needs nightly cargo with build-std (rust-src).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev libgl-dev lld

      # Size-minimized distribution build (nightly build-std + abort panics;
      # see docs/binary_size.md). xtask picks per-OS linker flags.
      - name: Build desktop (dist-min)
        run: >
          cargo run -p xtask -- dist-min
          --package desktop-app
          --bin desktop-app
          --target ${{ matrix.target }}
          --features desktop,renderer-wgpu
          --no-default-features

      - name: Package macOS .app bundle
        if: runner.os == 'macOS'
        # Assemble and ad-hoc sign the bundle through xtask so the `.app` carries
        # a valid code-signature seal (`_CodeSignature/CodeResources`). An
        # unsealed bundle is reported as "damaged" by Gatekeeper once downloaded
        # (quarantined). This reuses the single bundling path in `cargo xtask
        # bundle-macos` instead of duplicating the Info.plist here.
        run: |
          cargo run -p xtask -- bundle-macos \
            --no-build \
            --profile release-small \
            --target ${{ matrix.target }} \
            --app-name CranposeDemo \
            --bundle-id io.cranpose.demo \
            --out-dir target/macos-bundles
          codesign --verify --strict --verbose=2 \
            target/macos-bundles/CranposeDemo.app
          tar czf ${{ matrix.artifact_name }}.tar.gz \
            -C target/macos-bundles CranposeDemo.app

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          tar czf ${{ matrix.artifact_name }}.tar.gz \
            -C target/${{ matrix.target }}/release-small desktop-app

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target\${{ matrix.target }}\release-small\desktop-app.exe `
            -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Keep Android on the same final tag commit as the desktop matrix.
          ref: ${{ github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: bash scripts/ci/install_android_ndk.sh 27.0.12077973

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build APK
        working-directory: apps/android-demo/android
        run: ./gradlew :app:assembleRelease -PrustFastRelease=false

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cranpose-demo-android
          path: apps/android-demo/android/app/build/outputs/apk/release/app-*-release.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, build-android]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

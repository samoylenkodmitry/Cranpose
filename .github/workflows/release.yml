name: Release Artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true

  build:
    name: Build ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: [self-hosted, Linux, cranpose-heavy]
            target: x86_64-unknown-linux-gnu
            artifact_name: cranpose-demo-linux-x86_64

          - name: macos-aarch64
            runner: [self-hosted, macOS, ARM64]
            target: aarch64-apple-darwin
            artifact_name: cranpose-demo-macos-aarch64

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # publish.yml may move the release tag onto its generated version-bump
          # commit while this matrix is queued. Resolve the tag when the runner
          # starts instead of pinning checkout to the event's original SHA.
          ref: ${{ github.ref_name }}

      - name: Provision the pinned toolchains
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # rust-toolchain.toml owns the stable pin. dist-min additionally needs
          # nightly cargo for -Zbuild-std, so provision the nightly that
          # rust-toolchain-nightly.toml names rather than whatever `nightly`
          # resolves to on the runner today -- release artifacts have to be
          # reproducible from the tag alone.
          nightly="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain-nightly.toml)"
          rustc --version
          rustup target add '${{ matrix.target }}'
          rustup toolchain install "$nightly" --profile minimal --component rust-src
          rustup target add --toolchain "$nightly" '${{ matrix.target }}'

      - name: Verify provisioned Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # The persistent runner image owns its system packages; release jobs
          # remain unprivileged and fail clearly if provisioning drifts.
          command -v pkg-config
          command -v lld
          pkg-config --exists wayland-client xkbcommon x11 xrandr xcursor xi gl

      # Size-minimized distribution build (nightly build-std + abort panics;
      # see docs/binary_size.md). xtask picks per-OS linker flags.
      - name: Build desktop (dist-min)
        run: >
          cargo run -p xtask -- dist-min
          --package desktop-app
          --bin desktop-app
          --target ${{ matrix.target }}
          --features desktop,renderer-wgpu
          --no-default-features

      - name: Package macOS .app bundle
        if: runner.os == 'macOS'
        # Assemble and ad-hoc sign the bundle through xtask so the `.app` carries
        # a valid code-signature seal (`_CodeSignature/CodeResources`). An
        # unsealed bundle is reported as "damaged" by Gatekeeper once downloaded
        # (quarantined). This reuses the single bundling path in `cargo xtask
        # bundle-macos` instead of duplicating the Info.plist here.
        run: |
          cargo run -p xtask -- bundle-macos \
            --no-build \
            --profile release-small \
            --target ${{ matrix.target }} \
            --app-name CranposeDemo \
            --bundle-id io.cranpose.demo \
            --out-dir target/macos-bundles
          codesign --verify --strict --verbose=2 \
            target/macos-bundles/CranposeDemo.app
          tar czf ${{ matrix.artifact_name }}.tar.gz \
            -C target/macos-bundles CranposeDemo.app

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          tar czf ${{ matrix.artifact_name }}.tar.gz \
            -C target/${{ matrix.target }}/release-small desktop-app

      # Release assets do not consume the Actions artifact quota. Upload each
      # platform directly instead of retaining a second copy for 90 days.
      - name: Attach to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            *.tar.gz
            *.zip

  build-windows:
    name: Build windows-x86_64
    needs: create-release
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}

      - name: Provision the pinned toolchain and Windows target
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version
          rustup target add x86_64-pc-windows-msvc

      - name: Provision Windows cross-build tooling
        run: |
          command -v zip
          command -v cargo-xwin >/dev/null \
            || cargo install cargo-xwin --locked --version 0.23.0

      # Cross-compile the Windows MSVC binary on our macOS runner. cargo-xwin
      # supplies Microsoft's CRT and SDK import libraries without a hosted
      # Windows VM, so this artifact no longer consumes hosted-runner quota.
      - name: Build Windows desktop on macOS
        run: >
          cargo xwin build
          --package desktop-app
          --bin desktop-app
          --profile release-small
          --target x86_64-pc-windows-msvc
          --features desktop,renderer-wgpu
          --no-default-features

      - name: Package Windows binary
        run: >
          zip cranpose-demo-windows-x86_64.zip
          target/x86_64-pc-windows-msvc/release-small/desktop-app.exe

      - name: Attach to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: cranpose-demo-windows-x86_64.zip

  build-android:
    name: Build Android APK
    needs: create-release
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Keep Android on the same final tag commit as the desktop matrix.
          ref: ${{ github.ref_name }}

      - name: Provision the pinned toolchain and Android targets
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      # No broad setup-android action (repo contract:
      # platform_scheduling_static): the pinned installer resolves the
      # runner's SDK (incl. the macOS default ~/Library/Android/sdk) and
      # provisions exactly the required packages.
      - name: Install Android SDK packages
        run: bash scripts/ci/install_android_ndk.sh 27.0.12077973

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build APK
        working-directory: apps/android-demo/android
        # The self-hosted runner is shared across release jobs. A single-use
        # daemon inherits this step's toolchain environment instead of attaching
        # to an unrelated Gradle daemon with stale process state.
        run: ./gradlew --no-daemon :app:assembleRelease -PrustFastRelease=false

      - name: Attach to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: apps/android-demo/android/app/build/outputs/apk/release/app-*-release.apk

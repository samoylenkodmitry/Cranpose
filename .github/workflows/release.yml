name: Release Artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: cranpose-demo-linux-x86_64

          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact_name: cranpose-demo-macos-aarch64

          - name: ios-sim-aarch64
            runner: macos-latest
            target: aarch64-apple-ios-sim
            artifact_name: cranpose-demo-ios-sim-aarch64

          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: cranpose-demo-windows-x86_64

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev libgl-dev

      - name: Build desktop
        if: "!contains(matrix.target, 'ios')"
        run: >
          cargo build --release
          -p desktop-app
          --target ${{ matrix.target }}
          --features desktop,renderer-wgpu
          --no-default-features

      - name: Build iOS
        if: contains(matrix.target, 'ios')
        run: >
          cargo build --release
          -p desktop-app --lib
          --target ${{ matrix.target }}
          --features ios,renderer-wgpu
          --no-default-features

      - name: Package iOS Simulator .app bundle
        if: contains(matrix.target, 'ios')
        run: |
          mkdir -p CranposeDemo.app
          # Compile main.m and link with the Rust static lib into an iOS Simulator executable
          xcrun --sdk iphonesimulator clang \
            -target arm64-apple-ios15.0-simulator \
            -isysroot $(xcrun --sdk iphonesimulator --show-sdk-path) \
            -fobjc-arc \
            apps/ios-demo/ios/CranposeDemo/main.m \
            -Ltarget/${{ matrix.target }}/release \
            -ldesktop_app \
            -framework Metal -framework QuartzCore -framework UIKit \
            -framework CoreGraphics -framework Foundation \
            -o CranposeDemo.app/CranposeDemo
          cat > CranposeDemo.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key>
            <string>com.cranpose.demo</string>
            <key>CFBundleName</key>
            <string>Cranpose Demo</string>
            <key>CFBundleExecutable</key>
            <string>CranposeDemo</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UIDeviceFamily</key>
            <array>
              <integer>1</integer>
              <integer>2</integer>
            </array>
            <key>DTPlatformName</key>
            <string>iphonesimulator</string>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
              <string>arm64</string>
            </array>
          </dict>
          </plist>
          PLIST
          tar czf ${{ matrix.artifact_name }}.tar.gz CranposeDemo.app

      - name: Package macOS .app bundle
        if: runner.os == 'macOS' && !contains(matrix.target, 'ios')
        run: |
          mkdir -p CranposeDemo.app/Contents/MacOS
          mkdir -p CranposeDemo.app/Contents/Resources
          cp target/${{ matrix.target }}/release/desktop-app \
             CranposeDemo.app/Contents/MacOS/CranposeDemo
          cat > CranposeDemo.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key>
            <string>com.cranpose.desktop-demo</string>
            <key>CFBundleName</key>
            <string>Cranpose Demo</string>
            <key>CFBundleExecutable</key>
            <string>CranposeDemo</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          tar czf ${{ matrix.artifact_name }}.tar.gz CranposeDemo.app

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          tar czf ${{ matrix.artifact_name }}.tar.gz \
            -C target/${{ matrix.target }}/release desktop-app

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target\${{ matrix.target }}\release\desktop-app.exe `
            -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build APK
        working-directory: apps/android-demo/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: ./gradlew :app:assembleRelease -PrustFastRelease=false

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cranpose-demo-android
          path: apps/android-demo/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, build-android]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  default-features:
    name: linux / stable / default features
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-default

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev libgl-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Run workspace tests
        run: cargo test --profile ci --workspace --verbose

      - name: Run workspace clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  feature-smoke:
    name: linux / stable / ${{ matrix.feature }} feature
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        feature: [std-hash, internal]

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-${{ matrix.feature }}

      - name: Run cranpose-core feature tests
        run: cargo test --profile ci -p cranpose-core --features ${{ matrix.feature }} --verbose

  property-smoke:
    name: linux / stable / property smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-property-smoke

      - name: Run deterministic slot-table model smoke
        run: >
          cargo test --profile ci
          -p cranpose-core
          deterministic_model_render_frames_match_slot_table
          --verbose

  criterion-smoke:
    name: linux / stable / criterion smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-criterion-smoke

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev libgl-dev

      - name: Run slot-table Criterion smoke
        run: cargo bench --package cranpose-ui --bench slot_table_v2 -- --test

  wasm-build:
    name: wasm build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-wasm

      - name: Install binaryen 120
        run: |
          curl -L https://github.com/WebAssembly/binaryen/releases/download/version_120/binaryen-version_120-x86_64-linux.tar.gz | tar xz
          sudo mv binaryen-version_120/bin/* /usr/local/bin/
          wasm-opt --version

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1

      - name: Build web demo
        run: apps/desktop-demo/build-web.sh

  android-release:
    name: Android release build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Android release APK
        working-directory: apps/android-demo/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: ./gradlew :app:assembleRelease

  robot-e2e-build:
    name: robot e2e build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-robot-build

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev libgl-dev \
            libegl1 libgl1-mesa-dri mesa-vulkan-drivers \
            python3-pil \
            xvfb xauth xdotool imagemagick

      - name: Build robot examples
        env:
          CARGO_BUILD_JOBS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          WGPU_BACKEND: vulkan
          WINIT_UNIX_BACKEND: x11
        run: timeout 600s ./run_robot_test.sh --build-only

      - name: Upload robot examples
        uses: actions/upload-artifact@v4
        with:
          name: robot-examples
          path: target/robot/examples/robot_*
          compression-level: 0
          if-no-files-found: error

  robot-e2e-shard:
    name: robot e2e shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: robot-e2e-build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1/16
          - 2/16
          - 3/16
          - 4/16
          - 5/16
          - 6/16
          - 7/16
          - 8/16
          - 9/16
          - 10/16
          - 11/16
          - 12/16
          - 13/16
          - 14/16
          - 15/16
          - 16/16

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev libgl-dev \
            libegl1 libgl1-mesa-dri mesa-vulkan-drivers \
            python3-pil \
            xvfb xauth xdotool imagemagick

      - name: Download robot examples
        uses: actions/download-artifact@v4
        with:
          name: robot-examples
          path: target/robot/examples

      - name: Run robot shard
        env:
          CARGO_BUILD_JOBS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          WGPU_BACKEND: vulkan
          WINIT_UNIX_BACKEND: x11
        run: |
          chmod +x target/robot/examples/robot_*
          timeout 600s xvfb-run -a ./run_robot_test.sh --skip-build --sequential --shard "${{ matrix.shard }}"

  robot-e2e:
    name: robot e2e
    runs-on: ubuntu-latest
    needs: robot-e2e-shard
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check robot shard results
        run: |
          if [ "${{ needs.robot-e2e-shard.result }}" != "success" ]; then
            echo "robot e2e shards did not all pass"
            exit 1
          fi
          echo "robot e2e shards passed"

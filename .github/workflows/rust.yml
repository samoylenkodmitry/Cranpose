name: Rust

# Fleet-only CI: every job runs on the repo's self-hosted runners (two
# ARM64 MacBooks + the Linux GPU server). Every job explicitly rejects fork
# heads before allocating a runner; same-repository pull requests remain safe.
# The robot suite lives in heavy-selfhosted.yml where it runs on the real GPU.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 40G
  CARGO_INCREMENTAL: "0"
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  checks:
    name: fmt + tests + clippy (mac)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Provision PATH and sccache
        run: |
          # Both, and in this order. `GITHUB_PATH` only reaches LATER steps,
          # and the `cargo install` on the next line runs in THIS one -- so on
          # a self-hosted runner whose service PATH does not already carry
          # `~/.cargo/bin` the step dies with `cargo: command not found` and
          # exit 127, having "provisioned" a PATH it never used itself.
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          command -v sccache >/dev/null || RUSTC_WRAPPER= cargo install sccache --locked
          sccache --start-server || true

      - name: Check formatting
        run: cargo fmt --check

      - name: Check Cranpose package versions
        run: python3 scripts/check_cranpose_versions.py

      - name: Run workspace tests
        run: cargo test --profile ci --workspace

      - name: Run workspace clippy
        # `question_mark` is an opinionated style lint that newer clippy (1.97+)
        # flags on pre-existing code; allow it so a floating-stable toolchain bump
        # doesn't break the gate. Everything else stays `-D warnings`.
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::question_mark

  architecture-budget:
    name: architecture budgets (linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # The binary-size budget is pinned against Linux codegen.
    runs-on: [self-hosted, Linux, cranpose-heavy]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Provision PATH and sccache
        run: |
          # Both, and in this order. `GITHUB_PATH` only reaches LATER steps,
          # and the `cargo install` on the next line runs in THIS one -- so on
          # a self-hosted runner whose service PATH does not already carry
          # `~/.cargo/bin` the step dies with `cargo: command not found` and
          # exit 127, having "provisioned" a PATH it never used itself.
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          command -v sccache >/dev/null || RUSTC_WRAPPER= cargo install sccache --locked
          sccache --start-server || true

      # The winit adapter cannot build featureless on Linux (winit itself
      # requires a backend), so it is checked per-backend instead.
      - name: Build workspace without default features
        run: cargo build --workspace --no-default-features --exclude cranpose-platform-desktop-winit

      - name: Check winit platform adapter per backend
        run: |
          cargo check -p cranpose-platform-desktop-winit --no-default-features --features x11
          cargo check -p cranpose-platform-desktop-winit --no-default-features --features wayland

      - name: Check cranpose facade without default features
        run: cargo check -p cranpose --no-default-features

      - name: Check app shell without default features
        run: cargo check -p cranpose-app-shell --no-default-features

      - name: Check testing utilities without default features
        run: cargo check -p cranpose-testing --no-default-features

      - name: Check workspace with all features
        run: cargo check --workspace --all-features

      - name: Check duplicate dependency budget
        run: |
          cargo xtask dependency-budget --explain
          cargo xtask dependency-budget --strict --explain
          cargo xtask dependency-budget --strict --slice desktop-platform --explain
          cargo xtask dependency-budget --strict --slice optional-features --explain

      - name: Check desktop binary size budget
        # Desktop accessibility is part of the default facade and links the
        # AccessKit platform adapter. Keep a measured 15 MiB ceiling for that
        # supported baseline while still catching accidental dependency bloat.
        run: >
          cargo xtask binary-size
          --manifest-path apps/isolated-demo/Cargo.toml
          --package isolated-demo
          --bin isolated-demo
          --profile release-small
          --patch-workspace-cranpose
          --max-bytes 15728640

  feature-smoke:
    name: ${{ matrix.feature }} feature (mac)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        feature: [std-hash, internal]
    steps:
      - uses: actions/checkout@v6

      - name: Provision PATH and sccache
        run: |
          # Both, and in this order. `GITHUB_PATH` only reaches LATER steps,
          # and the `cargo install` on the next line runs in THIS one -- so on
          # a self-hosted runner whose service PATH does not already carry
          # `~/.cargo/bin` the step dies with `cargo: command not found` and
          # exit 127, having "provisioned" a PATH it never used itself.
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          command -v sccache >/dev/null || RUSTC_WRAPPER= cargo install sccache --locked
          sccache --start-server || true

      - name: Run cranpose-core feature tests
        run: cargo test --profile ci -p cranpose-core --features ${{ matrix.feature }}

  property-smoke:
    name: property smoke (mac)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Provision PATH and sccache
        run: |
          # Both, and in this order. `GITHUB_PATH` only reaches LATER steps,
          # and the `cargo install` on the next line runs in THIS one -- so on
          # a self-hosted runner whose service PATH does not already carry
          # `~/.cargo/bin` the step dies with `cargo: command not found` and
          # exit 127, having "provisioned" a PATH it never used itself.
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          command -v sccache >/dev/null || RUSTC_WRAPPER= cargo install sccache --locked
          sccache --start-server || true

      - name: Run deterministic slot-table model smoke
        run: >
          cargo test --profile ci
          -p cranpose-core
          deterministic_model_render_frames_match_slot_table

  criterion-smoke:
    name: criterion smoke (mac)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Provision PATH and sccache
        run: |
          # Both, and in this order. `GITHUB_PATH` only reaches LATER steps,
          # and the `cargo install` on the next line runs in THIS one -- so on
          # a self-hosted runner whose service PATH does not already carry
          # `~/.cargo/bin` the step dies with `cargo: command not found` and
          # exit 127, having "provisioned" a PATH it never used itself.
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          command -v sccache >/dev/null || RUSTC_WRAPPER= cargo install sccache --locked
          sccache --start-server || true

      - name: Run slot-table Criterion smoke
        run: cargo bench --package cranpose-ui --bench slot_table_v2 -- --test

  wasm-build:
    name: wasm build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # A wasm32 build and lint do not depend on the host, and the step below
    # provisions what they need, so any cranpose-heavy runner can serve them.
    # Pinning to Linux put every wasm result behind the one Linux machine, which
    # also carries the X11 robot suite and the binary-size budget -- the work
    # that genuinely cannot move.
    runs-on: [self-hosted, cranpose-heavy]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Provision PATH and sccache
        run: |
          # Both, and in this order. `GITHUB_PATH` only reaches LATER steps,
          # and the `cargo install` on the next line runs in THIS one -- so on
          # a self-hosted runner whose service PATH does not already carry
          # `~/.cargo/bin` the step dies with `cargo: command not found` and
          # exit 127, having "provisioned" a PATH it never used itself.
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          command -v sccache >/dev/null || RUSTC_WRAPPER= cargo install sccache --locked
          sccache --start-server || true
          rustup target add --toolchain stable wasm32-unknown-unknown
          command -v wasm-pack >/dev/null || cargo install wasm-pack --version 0.13.1 --locked
          # wasm-pack fetches its own binaryen when the host has none, so a
          # missing system wasm-opt is reported rather than treated as fatal.
          wasm-opt --version || echo "no system binaryen; wasm-pack supplies its own"

      - name: Run wasm clippy
        # A build alone (below) does not lint: `Arc<dyn Trait>` values that are
        # not `Send + Sync` on the single-threaded wasm target compile fine but
        # pay for synchronisation the target cannot use. Only clippy catches
        # that, and only for the exact package/feature set the web demo ships.
        run: cargo clippy --target wasm32-unknown-unknown -p desktop-app-platform --no-default-features --features web,renderer-wgpu -- -D warnings

      - name: Build web demo
        run: apps/desktop-demo/build-web.sh --release

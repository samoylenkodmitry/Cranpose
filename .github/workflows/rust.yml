name: Rust

# Fleet-only CI: every job runs on the repo's self-hosted runners (two
# ARM64 MacBooks + the Linux GPU server). Every job explicitly rejects fork
# heads before allocating a runner; same-repository pull requests remain safe.
# The robot suite lives in heavy-selfhosted.yml where it runs on the real GPU.
#
# The mac work is three jobs, cheapest first. `lint` answers in about a
# minute and is what a typo, a stale version or an unformatted file comes
# back as; `tests` and `clippy` are the long ones. Splitting them is what
# makes a single failure re-runnable on its own -- GitHub re-runs jobs, not
# steps, so one job carrying every gate meant a one-line fix at the end
# re-ran everything before it.
#
# `architecture budgets` and `wasm build` both draw on the heavy pool, so they
# short-circuit on a prose-only diff the same way the heavy workflow's jobs do.
# `checks` never does, and must not: `just typos` spell-checks docs/ and every
# .md, `just doc` fails on a broken intra-doc link, and `just test` compiles the
# doctests that crates/cranpose-core/src/lib.rs pulls in from its README. Prose
# is exactly what that job gates, so a prose diff is signal there, not waste.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCCACHE_CACHE_SIZE: 40G
  CARGO_INCREMENTAL: "0"
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  lint:
    name: lint + gates (mac)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Provision toolchain
        id: provision
        run: scripts/ci/provision_toolchain.sh

      - name: Check formatting
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just fmt-check

      - name: Check Cranpose package versions
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just versions

      - name: Spell check
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just typos

      - name: Check cyclomatic complexity of changed functions
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just complexity-gate

      - name: Check for duplicated code in the diff
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just duplication-gate

      - name: Check the docs-only trigger filter
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        # The predicate the heavy jobs skip on. It runs in this job because
        # this job is the one that never skips.
        run: just test-ci-filters

      - name: Check robot test discovery
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        # The predicate the robot suite discovers its examples by, pinned
        # before the heavy job ever spends a build on it.
        run: just test-robot-discovery

      - name: Check every test file and robot runner is linked into its binary
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        # A file left out would compile and run nothing, and no test fails.
        run: just test-layout

      - name: Check the robot suite's two halves still partition it
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just test-robot-suite-partition

      - name: Test Android robot result validation
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just test-android-accessibility-contract

      - name: Test the shell helpers
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just test-shell-helpers

      - name: Check every `just` recipe CI runs is reachable from `ci`/`ci-full`
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just test-ci-gate-reachability

  tests:
    name: tests (mac)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Provision toolchain
        id: provision
        run: scripts/ci/provision_toolchain.sh

      - name: Run workspace tests
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just test

      - name: Run feature permutations the default build skips
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just test-features

      - name: Run the deterministic slot-table model check
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just test-property

      - name: Run the slot-table Criterion smoke
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just bench-smoke

  clippy:
    name: clippy + docs (mac)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Provision toolchain
        id: provision
        run: scripts/ci/provision_toolchain.sh

      - name: Run workspace clippy
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just clippy

      - name: Run clippy on the optional desktop backends
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just clippy-optional-backends

      - name: Run clippy on the SVG image painter
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just clippy-svg

      - name: Run clippy on the embedded hyphenation dictionary
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just clippy-hyphenation

      - name: Run clippy on the robot runners
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just clippy-robot

      - name: Build documentation
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        # A broken intra-doc link is a broken published page.
        run: just doc

  wasm-build:
    name: wasm build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # A wasm32 build and lint do not depend on the host, so this runs where
    # the fleet has room rather than where the work is stuck. Pinning it to
    # Linux was the original mistake: that machine also carries the X11 robot
    # suite and the binary-size budget, the two jobs that genuinely cannot
    # move, and it has two slots against the macOS pool's three. Leaving it
    # on the shared `cranpose-heavy` label was only half a fix -- a free
    # Linux slot still won the job, and every wasm build that took one made
    # the robot suite wait.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Both parents of the merge commit, for the diff below.
          fetch-depth: 2

      - name: Detect a docs-only change
        id: changes
        # Why a short-circuit and not paths-ignore: see the header.
        run: scripts/ci/docs_only_change.sh

      - name: Provision toolchain
        id: provision
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          scripts/ci/provision_toolchain.sh
          rustup target add wasm32-unknown-unknown
          command -v wasm-pack >/dev/null || cargo install wasm-pack --version 0.13.1 --locked
          # wasm-pack fetches its own binaryen when the host has none, so a
          # missing system wasm-opt is reported rather than treated as fatal.
          wasm-opt --version || echo "no system binaryen; wasm-pack supplies its own"

      - name: Run wasm clippy
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' && steps.changes.outputs.docs_only != 'true' }}
        # A build alone (below) does not lint: `Arc<dyn Trait>` values that are
        # not `Send + Sync` on the single-threaded wasm target compile fine but
        # pay for synchronisation the target cannot use. Only clippy catches
        # that, and only for the exact package/feature set the web demo ships.
        run: just clippy-wasm

      - name: Build web demo
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' && steps.changes.outputs.docs_only != 'true' }}
        run: just web
      - name: Package the web demo for a check in a browser
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' && steps.changes.outputs.docs_only != 'true' }}
        run: apps/desktop-demo/package-web.sh "$RUNNER_TEMP/web-demo"
      - name: Keep the web demo three days
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' && steps.changes.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-demo
          path: ${{ runner.temp }}/web-demo
          retention-days: 3

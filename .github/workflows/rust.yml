name: Rust

# Fleet-only CI: every job runs on the repo's self-hosted runners (two
# ARM64 MacBooks + the Linux GPU server). Every job explicitly rejects fork
# heads before allocating a runner; same-repository pull requests remain safe.
# The robot suite lives in heavy-selfhosted.yml where it runs on the real GPU.
#
# `architecture budgets` and `wasm build` both draw on the heavy pool, so they
# short-circuit on a prose-only diff the same way the heavy workflow's jobs do.
# `checks` never does, and must not: `just typos` spell-checks docs/ and every
# .md, `just doc` fails on a broken intra-doc link, and `just test` compiles the
# doctests that crates/cranpose-core/src/lib.rs pulls in from its README. Prose
# is exactly what that job gates, so a prose diff is signal there, not waste.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCCACHE_CACHE_SIZE: 40G
  CARGO_INCREMENTAL: "0"
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  checks:
    name: fmt + tests + clippy (mac)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    # Carries what were four separate mac jobs. The fleet has one online macOS
    # runner, so those never ran in parallel anyway -- they queued.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Provision PATH and sccache
        id: provision
        run: |
          # Both, and in this order. `GITHUB_PATH` only reaches LATER steps,
          # and the `cargo install` on the next line runs in THIS one -- so on
          # a self-hosted runner whose service PATH does not already carry
          # `~/.cargo/bin` the step dies with `cargo: command not found` and
          # exit 127, having "provisioned" a PATH it never used itself.
          # Resolve the account's real home rather than trusting $HOME:
          # actions/checkout temporarily overrides HOME, and a step that runs
          # while it is overridden prepends a .cargo/bin that does not exist.
          # That is why the sccache line below survived for so long -- sccache
          # was already on the runner's own PATH, so nothing needed `cargo`
          # until another tool did, and then it failed with exit 127.
          real_home="$(eval echo "~$(id -un)")"
          export PATH="$real_home/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          echo "$real_home/.cargo/bin" >> "$GITHUB_PATH"
          command -v cargo >/dev/null || {
            echo "cargo not found. HOME=$HOME real_home=$real_home PATH=$PATH" >&2
            exit 1
          }
          # CI runs the same recipes a developer runs, so a gate cannot mean
          # one thing locally and another thing here.
          command -v just >/dev/null || cargo install just --locked
          scripts/ci/start_sccache.sh

      - name: Check formatting
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just fmt-check

      - name: Check Cranpose package versions
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just versions

      - name: Spell check
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just typos

      - name: Test the quality gates' diff-scoping logic
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just test-quality-gates

      - name: Check the docs-only trigger filter
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        # The predicate the heavy jobs skip on. It runs in this job because
        # this job is the one that never skips.
        run: just test-ci-filters

      - name: Check cyclomatic complexity of changed functions
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just complexity-gate

      - name: Check for duplicated code in the diff
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just duplication-gate

      - name: Run workspace tests
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just test

      - name: Run workspace clippy
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just clippy

      - name: Run clippy on the macOS camera backend
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just clippy-camera-desktop

      - name: Run clippy on the robot runners
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just clippy-robot

      - name: Build documentation
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        # A broken intra-doc link is a broken published page.
        run: just doc

      - name: Run cranpose-core feature permutations
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just test-features

      - name: Run the deterministic slot-table model check
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just test-property

      - name: Run the slot-table Criterion smoke
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' }}
        run: just bench-smoke

  architecture-budget:
    name: architecture budgets (linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # The binary-size budget is pinned against Linux codegen.
    runs-on: [self-hosted, Linux, cranpose-heavy]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Both parents of the merge commit, for the diff below.
          fetch-depth: 2

      - name: Detect a docs-only change
        id: changes
        # Why a short-circuit and not paths-ignore: see the header.
        run: scripts/ci/docs_only_change.sh

      - name: Provision PATH and sccache
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          # Both, and in this order. `GITHUB_PATH` only reaches LATER steps,
          # and the `cargo install` on the next line runs in THIS one -- so on
          # a self-hosted runner whose service PATH does not already carry
          # `~/.cargo/bin` the step dies with `cargo: command not found` and
          # exit 127, having "provisioned" a PATH it never used itself.
          # Resolve the account's real home rather than trusting $HOME:
          # actions/checkout temporarily overrides HOME, and a step that runs
          # while it is overridden prepends a .cargo/bin that does not exist.
          # That is why the sccache line below survived for so long -- sccache
          # was already on the runner's own PATH, so nothing needed `cargo`
          # until another tool did, and then it failed with exit 127.
          real_home="$(eval echo "~$(id -un)")"
          export PATH="$real_home/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          echo "$real_home/.cargo/bin" >> "$GITHUB_PATH"
          command -v cargo >/dev/null || {
            echo "cargo not found. HOME=$HOME real_home=$real_home PATH=$PATH" >&2
            exit 1
          }
          # CI runs the same recipes a developer runs, so a gate cannot mean
          # one thing locally and another thing here.
          command -v just >/dev/null || cargo install just --locked
          scripts/ci/start_sccache.sh

      - name: Check architecture budgets
        if: steps.changes.outputs.docs_only != 'true'
        # Featureless and all-features builds, the per-backend winit checks, the
        # duplicate-dependency budgets and the desktop binary-size ceiling.
        run: just budgets

  wasm-build:
    name: wasm build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # A wasm32 build and lint do not depend on the host, and the step below
    # provisions what they need, so any cranpose-heavy runner can serve them.
    # Pinning to Linux put every wasm result behind the one Linux machine, which
    # also carries the X11 robot suite and the binary-size budget -- the work
    # that genuinely cannot move.
    runs-on: [self-hosted, cranpose-heavy]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Both parents of the merge commit, for the diff below.
          fetch-depth: 2

      - name: Detect a docs-only change
        id: changes
        # Why a short-circuit and not paths-ignore: see the header.
        run: scripts/ci/docs_only_change.sh

      - name: Provision PATH and sccache
        id: provision
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          # Both, and in this order. `GITHUB_PATH` only reaches LATER steps,
          # and the `cargo install` on the next line runs in THIS one -- so on
          # a self-hosted runner whose service PATH does not already carry
          # `~/.cargo/bin` the step dies with `cargo: command not found` and
          # exit 127, having "provisioned" a PATH it never used itself.
          # Resolve the account's real home rather than trusting $HOME:
          # actions/checkout temporarily overrides HOME, and a step that runs
          # while it is overridden prepends a .cargo/bin that does not exist.
          # That is why the sccache line below survived for so long -- sccache
          # was already on the runner's own PATH, so nothing needed `cargo`
          # until another tool did, and then it failed with exit 127.
          real_home="$(eval echo "~$(id -un)")"
          export PATH="$real_home/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          echo "$real_home/.cargo/bin" >> "$GITHUB_PATH"
          command -v cargo >/dev/null || {
            echo "cargo not found. HOME=$HOME real_home=$real_home PATH=$PATH" >&2
            exit 1
          }
          # CI runs the same recipes a developer runs, so a gate cannot mean
          # one thing locally and another thing here.
          command -v just >/dev/null || cargo install just --locked
          scripts/ci/start_sccache.sh
          rustup target add wasm32-unknown-unknown
          command -v wasm-pack >/dev/null || cargo install wasm-pack --version 0.13.1 --locked
          # wasm-pack fetches its own binaryen when the host has none, so a
          # missing system wasm-opt is reported rather than treated as fatal.
          wasm-opt --version || echo "no system binaryen; wasm-pack supplies its own"

      - name: Run wasm clippy
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' && steps.changes.outputs.docs_only != 'true' }}
        # A build alone (below) does not lint: `Arc<dyn Trait>` values that are
        # not `Send + Sync` on the single-threaded wasm target compile fine but
        # pay for synchronisation the target cannot use. Only clippy catches
        # that, and only for the exact package/feature set the web demo ships.
        run: just clippy-wasm

      - name: Build web demo
        if: ${{ !cancelled() && steps.provision.conclusion == 'success' && steps.changes.outputs.docs_only != 'true' }}
        run: just web

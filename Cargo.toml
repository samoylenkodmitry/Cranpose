[workspace]
members = [
    "crates/cranpose-app-shell",
    "crates/cranpose",
    "crates/cranpose-assets",
    "crates/cranpose-capabilities",
    "crates/cranpose-core",
    "crates/cranpose-macros",
    "crates/cranpose-runtime-std",
    "crates/cranpose-ui-graphics",
    "crates/cranpose-ui-layout",
    "crates/cranpose-foundation",
    "crates/cranpose-animation",
    "crates/cranpose-ui",
    "crates/cranpose-liquid",
    "crates/cranpose-testing",
    "crates/cranpose-platform/desktop-winit",
    "crates/cranpose-platform/android",
    "crates/cranpose-platform/web",
    "crates/cranpose-render/common",
    "crates/cranpose-render/pixels",
    "crates/cranpose-render/wgpu",
    "apps/desktop-demo",
    "apps/desktop-demo-platform",
    "crates/cranpose-audio",
    "crates/cranpose-media",
    "crates/cranpose-services",
    "crates/cranpose-storekit",
    "xtask",
    "crates/coroflow",
    "crates/cranpose-coroflow",
    "crates/cranpose-navigation",
    "apps/coroflow-demo",
    "apps/coroflow-demo/android",
    "apps/coroflow-demo/web",
]
resolver = "2"

[workspace.package]
version = "0.1.165"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/samoylenkodmitry/cranpose"
homepage = "https://samoylenkodmitry.github.io/cranpose/"
authors = ["Dmitry Samoylenko"]
keywords = ["gui", "ui", "compose", "declarative", "framework"]
categories = ["gui"]


[workspace.dependencies]
# Force android-activity to use native-activity feature across all workspace crates
android-activity = { version = "0.6", features = ["native-activity"] }
bytemuck = { version = "1.25", features = ["derive"] }
cranpose-animation = { path = "crates/cranpose-animation", version = "0.1.165" }
cranpose-capabilities = { path = "crates/cranpose-capabilities", version = "0.1.165" }
cranpose-liquid = { path = "crates/cranpose-liquid", version = "0.1.165" }
cranpose = { path = "crates/cranpose", version = "0.1.165", default-features = false }
cranpose-app-shell = { path = "crates/cranpose-app-shell", version = "0.1.165" }
cranpose-audio = { path = "crates/cranpose-audio", version = "0.1.165", default-features = false }
cranpose-core = { path = "crates/cranpose-core", version = "0.1.165" }
coroflow = { path = "crates/coroflow", version = "0.1.165" }
cranpose-coroflow = { path = "crates/cranpose-coroflow", version = "0.1.165" }
cranpose-navigation = { path = "crates/cranpose-navigation", version = "0.1.165" }
cranpose-foundation = { path = "crates/cranpose-foundation", version = "0.1.165" }
cranpose-macros = { path = "crates/cranpose-macros", version = "0.1.165" }
cranpose-media = { path = "crates/cranpose-media", version = "0.1.165" }
cranpose-platform-android = { path = "crates/cranpose-platform/android", version = "0.1.165" }
cranpose-platform-desktop-winit = { path = "crates/cranpose-platform/desktop-winit", version = "0.1.165", default-features = false }
cranpose-platform-web = { path = "crates/cranpose-platform/web", version = "0.1.165" }
cranpose-render-common = { path = "crates/cranpose-render/common", version = "0.1.165", default-features = false }
cranpose-render-pixels = { path = "crates/cranpose-render/pixels", version = "0.1.165" }
cranpose-render-wgpu = { path = "crates/cranpose-render/wgpu", version = "0.1.165" }
cranpose-runtime-std = { path = "crates/cranpose-runtime-std", version = "0.1.165" }
cranpose-services = { path = "crates/cranpose-services", version = "0.1.165", default-features = false }
cranpose-storekit = { path = "crates/cranpose-storekit", version = "0.1.165", default-features = false }
cranpose-ui = { path = "crates/cranpose-ui", version = "0.1.165" }
cranpose-ui-graphics = { path = "crates/cranpose-ui-graphics", version = "0.1.165" }
cranpose-ui-layout = { path = "crates/cranpose-ui-layout", version = "0.1.165" }

cursor-icon = "1.2"
web-time = "1.1"

# Rules that AGENTS.md states as prose, enforced by the compiler instead.
#
# `unsafe_code` replaced 31 identical `#![deny(unsafe_code)]` crate-root
# attributes. The FFI modules that genuinely need it still opt in with a
# module-level `#![allow(unsafe_code)]`, exactly as before -- a source
# attribute overrides a lint level Cargo sets on the command line.
[workspace.lints.rust]
unsafe_code = "deny"

# The one warning class `-D warnings` structurally cannot reach: `clippy`
# stops at metadata and never links, so a message from the target linker only
# ever appears under `cargo build`/`cargo test`, where nothing escalates it.
# Denying it here is what extends the zero-warnings rule over the link step.
# Messages the compiler knows are informational are a separate lint,
# `linker_info`, which stays allowed.
#
# The shape that reaches this in practice is macOS ld's `__eh_frame section
# too large (max 16MB) to encode dwarf unwind offsets in compact unwind
# table`, which is a code-volume symptom of the binary being linked, not a
# profile or feature-set one -- see TIME_WASTERS.md for how to attribute the
# section back to the object files that filled it.
linker_messages = "deny"

# "don't put unfinished parts here" and "never leave debug logs", as gates.
[workspace.lints.clippy]
todo = "deny"
dbg_macro = "deny"
clone_on_copy = "deny"
redundant_locals = "deny"

# Work the code asks for and then throws away: a clone nobody needed, a default
# computed on the path that does not use it, a copy spelled as a clone, a fresh
# allocation where the destination's could be reused. A clone is only ever
# redundant here because no API keeps a caller's handle alive for it: whatever
# a registry needs, it owns. `needless_collect` and `iter_with_drain` stay off:
# a collect ends a RefCell borrow before re-entrant calls, and `drain(..)`
# keeps a scratch buffer's capacity.
redundant_clone = "warn"
or_fun_call = "warn"
cloned_instead_of_copied = "warn"
assigning_clones = "warn"

# One spelling for each shape, so a reader does not decode two forms of the
# same thing. None of these changes a float result, so pictures stay exact.
uninlined_format_args = "warn"
redundant_closure_for_method_calls = "warn"
map_unwrap_or = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
unnested_or_patterns = "warn"
explicit_iter_loop = "warn"
ignored_unit_patterns = "warn"
needless_raw_string_hashes = "warn"
elidable_lifetime_names = "warn"
manual_assert = "warn"

# Faster local debug builds while preserving useful panic locations.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Proc macros re-run over every composable each time the crate using them
# rebuilds; they are not incremental. Optimising them (and build scripts)
# halved an incremental `cargo check -p desktop-app` on samarch-1 (median
# 6.2 s -> 3.1 s after touching desktop-demo or cranpose-ui), for a one-time
# 15 s on a cold target directory while syn and friends build optimised.
[profile.dev.build-override]
debug = false
opt-level = 3

# A debug-mode graphics and decoding stack changes what a dev build feels like:
# these are the crates that run per frame or per asset, not per build. They are
# third-party and rebuilt rarely, so optimising them costs one compile and buys
# every subsequent run. The workspace's own crates stay unoptimised so stepping
# through them still works.
[profile.dev.package.wgpu]
opt-level = 3
[profile.dev.package.wgpu-core]
opt-level = 3
[profile.dev.package.wgpu-hal]
opt-level = 3
[profile.dev.package.wgpu-types]
opt-level = 3
[profile.dev.package.naga]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3

# CI keeps full dev debuginfo instead of inheriting local iteration settings.
[profile.ci]
inherits = "dev"
debug = true

[profile.ci.package."*"]
debug = true

[profile.ci.build-override]
debug = true

# Distribution profile optimized for runtime speed.
[profile.release]
opt-level = 3           # Maximum runtime performance
lto = true              # Link-Time Optimization across crates
codegen-units = 1       # Better optimization (single codegen unit)
strip = true            # Strip symbols from binary
panic = "abort"         # Smaller binaries (no unwinding)
debug = 0               # No debug info

# Faster local release-style profile for iteration.
[profile.release-fast]
inherits = "release"
opt-level = 2
lto = "thin"
codegen-units = 16
strip = "none"
debug = 1

# Native perf profile optimized for runtime speed and profiling.
[profile.native-release]
inherits = "release"
opt-level = 3
debug = 1
strip = "none"

# Fast profile for local robot runners and headless UI checks.
[profile.robot]
inherits = "dev"
opt-level = 2
debug = 0
codegen-units = 256
incremental = true

[profile.robot.package."*"]
opt-level = 2
debug = 0

[profile.robot.build-override]
debug = false

# Maximum size optimization profile (slower builds, smaller binaries)
[profile.release-small]
inherits = "release"
opt-level = "z"         # Optimize for size over speed
lto = "fat"             # Full LTO for maximum optimization

# WASM-specific profile for web builds
[profile.wasm-release]
inherits = "release"
opt-level = "z"         # Aggressive size optimization for WASM
lto = "thin"            # Keep optimized web builds within practical local/CI memory limits
codegen-units = 16      # Let wasm-opt own the final size cleanup pass

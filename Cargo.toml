[workspace]
members = [
    "crates/cranpose-app-shell",
    "crates/cranpose",
    "crates/cranpose-assets",
    "crates/cranpose-core",
    "crates/cranpose-macros",
    "crates/cranpose-runtime-std",
    "crates/cranpose-ui-graphics",
    "crates/cranpose-ui-layout",
    "crates/cranpose-foundation",
    "crates/cranpose-animation",
    "crates/cranpose-ui",
    "crates/cranpose-testing",
    "crates/cranpose-platform/desktop-winit",
    "crates/cranpose-platform/android",
    "crates/cranpose-platform/web",
    "crates/cranpose-render/common",
    "crates/cranpose-render/pixels",
    "crates/cranpose-render/wgpu",
    "apps/desktop-demo",
    "crates/cranpose-services",
]
resolver = "2"

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/samoylenkodmitry/cranpose"
homepage = "https://samoylenkodmitry.github.io/cranpose/"
authors = ["Dmitry Samoylenko"]
keywords = ["gui", "ui", "compose", "declarative", "framework"]
categories = ["gui"]


[workspace.dependencies]
# Force android-activity to use native-activity feature across all workspace crates
android-activity = { version = "0.6", features = ["native-activity"] }
cranpose-animation = { path = "crates/cranpose-animation", version = "0.1.6" }
cranpose = { path = "crates/cranpose", version = "0.1.6" }
cranpose-app-shell = { path = "crates/cranpose-app-shell", version = "0.1.6" }
cranpose-assets = { path = "crates/cranpose-assets", version = "0.1.6" }
cranpose-core = { path = "crates/cranpose-core", version = "0.1.6" }
cranpose-foundation = { path = "crates/cranpose-foundation", version = "0.1.6" }
cranpose-macros = { path = "crates/cranpose-macros", version = "0.1.6" }
cranpose-platform-android = { path = "crates/cranpose-platform/android", version = "0.1.6" }
cranpose-platform-desktop-winit = { path = "crates/cranpose-platform/desktop-winit", version = "0.1.6" }
cranpose-platform-web = { path = "crates/cranpose-platform/web", version = "0.1.6" }
cranpose-render-common = { path = "crates/cranpose-render/common", version = "0.1.6" }
cranpose-render-pixels = { path = "crates/cranpose-render/pixels", version = "0.1.6" }
cranpose-render-wgpu = { path = "crates/cranpose-render/wgpu", version = "0.1.6" }
cranpose-runtime-std = { path = "crates/cranpose-runtime-std", version = "0.1.6" }
cranpose-services = { path = "crates/cranpose-services", version = "0.1.6" }
cranpose-testing = { path = "crates/cranpose-testing", version = "0.1.6" }
cranpose-ui = { path = "crates/cranpose-ui", version = "0.1.6" }
cranpose-ui-graphics = { path = "crates/cranpose-ui-graphics", version = "0.1.6" }
cranpose-ui-layout = { path = "crates/cranpose-ui-layout", version = "0.1.6" }

# Faster local debug builds while preserving useful panic locations.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false

# CI keeps full dev debuginfo instead of inheriting local iteration settings.
[profile.ci]
inherits = "dev"
debug = true

[profile.ci.package."*"]
debug = true

[profile.ci.build-override]
debug = true

# Distribution profile optimized for runtime speed.
[profile.release]
opt-level = 3           # Maximum runtime performance
lto = true              # Link-Time Optimization across crates
codegen-units = 1       # Better optimization (single codegen unit)
strip = true            # Strip symbols from binary
panic = "abort"         # Smaller binaries (no unwinding)
debug = 0               # No debug info

# Faster local release-style profile for iteration.
[profile.release-fast]
inherits = "release"
opt-level = 2
lto = "thin"
codegen-units = 16
strip = "none"
debug = 1

# Native perf profile optimized for runtime speed and profiling.
[profile.native-release]
inherits = "release"
opt-level = 3
debug = 1
strip = "none"

# Fast profile for local robot runners and headless UI checks.
[profile.robot]
inherits = "dev"
debug = 0
codegen-units = 256
incremental = true

[profile.robot.package."*"]
debug = 0

[profile.robot.build-override]
debug = false

# Maximum size optimization profile (slower builds, smaller binaries)
[profile.release-small]
inherits = "release"
opt-level = "z"         # Optimize for size over speed
lto = "fat"             # Full LTO for maximum optimization

# WASM-specific profile for web builds
[profile.wasm-release]
inherits = "release"
opt-level = "z"         # Aggressive size optimization for WASM

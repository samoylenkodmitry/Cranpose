[workspace]
members = [
    "crates/cranpose-app-shell",
    "crates/cranpose",
    "crates/cranpose-assets",
    "crates/cranpose-core",
    "crates/cranpose-macros",
    "crates/cranpose-runtime-std",
    "crates/cranpose-ui-graphics",
    "crates/cranpose-ui-layout",
    "crates/cranpose-foundation",
    "crates/cranpose-animation",
    "crates/cranpose-ui",
    "crates/cranpose-liquid",
    "crates/cranpose-testing",
    "crates/cranpose-platform/desktop-winit",
    "crates/cranpose-platform/android",
    "crates/cranpose-platform/web",
    "crates/cranpose-render/common",
    "crates/cranpose-render/pixels",
    "crates/cranpose-render/wgpu",
    "apps/desktop-demo",
    "apps/desktop-demo-platform",
    "crates/cranpose-audio",
    "crates/cranpose-media",
    "crates/cranpose-services",
    "crates/cranpose-storekit",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.106"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/samoylenkodmitry/cranpose"
homepage = "https://samoylenkodmitry.github.io/cranpose/"
authors = ["Dmitry Samoylenko"]
keywords = ["gui", "ui", "compose", "declarative", "framework"]
categories = ["gui"]


[workspace.dependencies]
# Force android-activity to use native-activity feature across all workspace crates
android-activity = { version = "0.6", features = ["native-activity"] }
cranpose-animation = { path = "crates/cranpose-animation", version = "0.1.106" }
cranpose-liquid = { path = "crates/cranpose-liquid", version = "0.1.106" }
cranpose = { path = "crates/cranpose", version = "0.1.106", default-features = false }
cranpose-app-shell = { path = "crates/cranpose-app-shell", version = "0.1.106" }
cranpose-audio = { path = "crates/cranpose-audio", version = "0.1.106", default-features = false }
cranpose-core = { path = "crates/cranpose-core", version = "0.1.106" }
cranpose-foundation = { path = "crates/cranpose-foundation", version = "0.1.106" }
cranpose-macros = { path = "crates/cranpose-macros", version = "0.1.106" }
cranpose-media = { path = "crates/cranpose-media", version = "0.1.106" }
cranpose-platform-android = { path = "crates/cranpose-platform/android", version = "0.1.106" }
cranpose-platform-desktop-winit = { path = "crates/cranpose-platform/desktop-winit", version = "0.1.106", default-features = false }
cranpose-platform-web = { path = "crates/cranpose-platform/web", version = "0.1.106" }
cranpose-render-common = { path = "crates/cranpose-render/common", version = "0.1.106", default-features = false }
cranpose-render-pixels = { path = "crates/cranpose-render/pixels", version = "0.1.106" }
cranpose-render-wgpu = { path = "crates/cranpose-render/wgpu", version = "0.1.106" }
cranpose-runtime-std = { path = "crates/cranpose-runtime-std", version = "0.1.106" }
cranpose-services = { path = "crates/cranpose-services", version = "0.1.106", default-features = false }
cranpose-storekit = { path = "crates/cranpose-storekit", version = "0.1.106", default-features = false }
cranpose-ui = { path = "crates/cranpose-ui", version = "0.1.106" }
cranpose-ui-graphics = { path = "crates/cranpose-ui-graphics", version = "0.1.106" }
cranpose-ui-layout = { path = "crates/cranpose-ui-layout", version = "0.1.106" }
web-time = "1.1"

# Rules that AGENTS.md states as prose, enforced by the compiler instead.
#
# `unsafe_code` replaced 31 identical `#![deny(unsafe_code)]` crate-root
# attributes. The FFI modules that genuinely need it still opt in with a
# module-level `#![allow(unsafe_code)]`, exactly as before -- a source
# attribute overrides a lint level Cargo sets on the command line.
[workspace.lints.rust]
unsafe_code = "deny"

# "don't put unfinished parts here" and "never leave debug logs", as gates.
[workspace.lints.clippy]
todo = "deny"
dbg_macro = "deny"
clone_on_copy = "deny"
redundant_locals = "deny"

[patch.crates-io]
# Upstream master moved on to hashbrown 0.17. Pin the 0.16 alignment commit so
# WGPU 29 and gpu-descriptor share one hashbrown/foldhash version family.
gpu-descriptor = { git = "https://github.com/zakarumych/gpu-descriptor", rev = "79804e422186805f1ff5ab3d8310c07c145a6731" }

# Faster local debug builds while preserving useful panic locations.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false

# A debug-mode graphics and decoding stack changes what a dev build feels like:
# these are the crates that run per frame or per asset, not per build. They are
# third-party and rebuilt rarely, so optimising them costs one compile and buys
# every subsequent run. The workspace's own crates stay unoptimised so stepping
# through them still works.
[profile.dev.package.wgpu]
opt-level = 3
[profile.dev.package.wgpu-core]
opt-level = 3
[profile.dev.package.wgpu-hal]
opt-level = 3
[profile.dev.package.wgpu-types]
opt-level = 3
[profile.dev.package.naga]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3

# CI keeps full dev debuginfo instead of inheriting local iteration settings.
[profile.ci]
inherits = "dev"
debug = true

[profile.ci.package."*"]
debug = true

[profile.ci.build-override]
debug = true

# Distribution profile optimized for runtime speed.
[profile.release]
opt-level = 3           # Maximum runtime performance
lto = true              # Link-Time Optimization across crates
codegen-units = 1       # Better optimization (single codegen unit)
strip = true            # Strip symbols from binary
panic = "abort"         # Smaller binaries (no unwinding)
debug = 0               # No debug info

# Faster local release-style profile for iteration.
[profile.release-fast]
inherits = "release"
opt-level = 2
lto = "thin"
codegen-units = 16
strip = "none"
debug = 1

# Native perf profile optimized for runtime speed and profiling.
[profile.native-release]
inherits = "release"
opt-level = 3
debug = 1
strip = "none"

# Fast profile for local robot runners and headless UI checks.
[profile.robot]
inherits = "dev"
opt-level = 2
debug = 0
codegen-units = 256
incremental = true

[profile.robot.package."*"]
opt-level = 2
debug = 0

[profile.robot.build-override]
debug = false

# Maximum size optimization profile (slower builds, smaller binaries)
[profile.release-small]
inherits = "release"
opt-level = "z"         # Optimize for size over speed
lto = "fat"             # Full LTO for maximum optimization

# WASM-specific profile for web builds
[profile.wasm-release]
inherits = "release"
opt-level = "z"         # Aggressive size optimization for WASM
lto = "thin"            # Keep optimized web builds within practical local/CI memory limits
codegen-units = 16      # Let wasm-opt own the final size cleanup pass

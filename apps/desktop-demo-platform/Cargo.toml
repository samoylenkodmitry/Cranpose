[package]
name = "desktop-app-platform"
version = "0.1.0"
edition = "2021"
description = "Cranpose desktop demo platform export library."
repository = "https://github.com/samoylenkodmitry/cranpose"
license = "Apache-2.0 OR MIT"
publish = false

[lints]
workspace = true

# `-ocimfs=100` keeps wasm-opt from folding each function that has a single
# caller into that caller, whatever its size. A page compiles a function whole
# at its first call, so those folds made functions of over 100 KB whose unused
# branches a first visit compiled: on a Mate 20 X the gauntlet's first frame
# came 110-170 ms sooner without them.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "-ocimfs=100", "--all-features"]

[lib]
name = "desktop_app"
crate-type = ["cdylib", "staticlib"]
path = "src/lib.rs"

[features]
default = ["renderer-wgpu"]
renderer-wgpu = ["cranpose/renderer-wgpu", "desktop_demo/renderer-wgpu"]
android = ["cranpose/android", "desktop_demo/android"]
web = [
    "cranpose/web",
    "desktop_demo/web",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:wasm-logger",
]
logging = ["dep:env_logger", "desktop_demo/logging"]

[dependencies]
cranpose = { path = "../../crates/cranpose", default-features = false }
desktop_demo = { package = "desktop-app", path = "../desktop-demo", default-features = false }
log = "0.4"
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4.79", optional = true }
wasm-logger = { version = "0.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { version = "0.11", optional = true }


[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"

[build-dependencies]
cranpose-capabilities = { path = "../../crates/cranpose-capabilities" }

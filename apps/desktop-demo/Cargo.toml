[package]
name = "desktop-app"
version = "0.1.0"
edition = "2021"
description = "Cranpose desktop demo application."
repository = "https://github.com/samoylenkodmitry/cranpose"
license = "Apache-2.0"

[lints.clippy]
clone_on_copy = "deny"
redundant_locals = "deny"

[package.metadata.wasm-pack.profile.release]
# Enable wasm-opt with size optimization (can reduce WASM size by 20-40%)
# --all-features enables all standard WASM features that Rust 1.83+ uses by default
# (bulk-memory, nontrapping-float-to-int, sign-ext, mutable-globals)
wasm-opt = ["-Oz", "--all-features"]

# Support both binary (desktop) and cdylib (Android)
# IMPORTANT: The cdylib name (libdesktop_app.so) must match the android.app.lib_name
# in apps/android-demo/android/app/src/main/AndroidManifest.xml.
# Cargo converts hyphens to underscores: "desktop-app" → "libdesktop_app.so"
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "desktop-app"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["renderer-wgpu", "desktop"]
renderer-pixels = ["cranpose/renderer-pixels"]
renderer-wgpu = ["cranpose/renderer-wgpu"]
desktop = ["cranpose/desktop"]
ios = ["cranpose/ios"]
android =["cranpose/android"]
web = ["cranpose/web", "dep:wasm-bindgen", "dep:wasm-logger"]
# Enable real app robot testing
robot-app = ["logging", "cranpose-ui/test-helpers"]
# Enable env_logger (adds ~600KB from regex)
logging = ["dep:env_logger"]

[dependencies]
cranpose = { path = "../../crates/cranpose", default-features = false }
cranpose-animation = { path = "../../crates/cranpose-animation" }
cranpose-core = { path = "../../crates/cranpose-core" }
cranpose-ui = { path = "../../crates/cranpose-ui" }
cranpose-foundation = { path = "../../crates/cranpose-foundation" }
log = "0.4"
instant = { version = "0.1", features = ["wasm-bindgen"] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-logger = { version = "0.2", optional = true }
getrandom = { version = "0.3", features = ["wasm_js"] }
anyhow = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
cranpose-services = { path = "../../crates/cranpose-services" }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
zip = { version = "8.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
cranpose-ui-graphics = { workspace = true }
pulldown-cmark = { version = "0.13.1", default-features = false }

# Non-WASM dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { version = "0.11", optional = true }

# Android-specific dependencies (only when building for Android)
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { workspace = true }

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4.64"

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]

[dev-dependencies]
cranpose-macros = { path = "../../crates/cranpose-macros" }
cranpose-render-wgpu = { path = "../../crates/cranpose-render/wgpu" }
cranpose-testing = { path = "../../crates/cranpose-testing" }
pollster = "0.4.0"


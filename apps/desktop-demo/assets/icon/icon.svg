<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Cranpose</title>
  <!--
    The Cranpose demo's app icon, after the logo in docs/images/logo.webp.
    scripts/dev/render_app_icons.mjs draws every platform's icon from this
    file: it keeps #backdrop (the tile) apart from #mark (the crayfish over the
    gear), and reshapes each rect, which is the tile. Each plate is an outlined
    rim with its core inset inside it.
  -->
  <defs>
    <linearGradient id="tile-fill" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#382f26"/>
      <stop offset="1" stop-color="#151b23"/>
    </linearGradient>
    <radialGradient id="warm-glow" cx="442" cy="355" r="551" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8a36" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ff8a36" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool-glow" cx="515" cy="805" r="566" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5fb4d4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5fb4d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="210" y1="167" x2="558" y2="602" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc879"/>
      <stop offset="1" stop-color="#f59843"/>
    </linearGradient>
    <linearGradient id="core" x1="210" y1="167" x2="558" y2="602" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2862f"/>
      <stop offset="1" stop-color="#cf5419"/>
    </linearGradient>
    <linearGradient id="deep" x1="210" y1="167" x2="558" y2="602" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c8461b"/>
      <stop offset="1" stop-color="#9c2c12"/>
    </linearGradient>
    <linearGradient id="steel" x1="573" y1="196" x2="732" y2="428" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d2f2fa"/>
      <stop offset="1" stop-color="#7fbdd3"/>
    </linearGradient>
    <linearGradient id="steel-core" x1="573" y1="196" x2="732" y2="428" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6cb1ca"/>
      <stop offset="1" stop-color="#2a6c89"/>
    </linearGradient>
    <radialGradient id="ball" cx=".38" cy=".34" r=".75">
      <stop offset="0" stop-color="#d4f1f9"/>
      <stop offset=".5" stop-color="#5ea6c0"/>
      <stop offset="1" stop-color="#235d78"/>
    </radialGradient>
    <linearGradient id="gear-fill" x1="516" y1="648" x2="516" y2="927" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5aa3c0"/>
      <stop offset="1" stop-color="#2a6784"/>
    </linearGradient>
  </defs>
  <g id="backdrop">
    <rect width="1024" height="1024" rx="230" fill="url(#tile-fill)"/>
    <rect width="1024" height="1024" rx="230" fill="url(#warm-glow)"/>
    <rect width="1024" height="1024" rx="230" fill="url(#cool-glow)"/>
  </g>
  <g id="mark" stroke="#17110c" stroke-width="10" stroke-linejoin="round">
    <g id="gear" stroke="#8ccbe0" stroke-width="5">

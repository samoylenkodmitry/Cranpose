<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cranpose Demo</title>
    <link rel="icon" href="data:,">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: white;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 30px;
            font-size: 1.2em;
        }

        #cranpose-canvas {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            background: white;
            display: block;
            margin: 0 auto;
        }

        .loading {
            color: white;
            font-size: 1.2em;
            margin-top: 20px;
        }

        .error {
            color: #ff6b6b;
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            max-width: 600px;
        }

        .info {
            color: rgba(255, 255, 255, 0.8);
            margin-top: 20px;
            font-size: 0.9em;
        }

        .links {
            margin-top: 20px;
        }

        .links a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            transition: background 0.3s;
        }

        .links a:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Cranpose Demo</h1>
        <p class="subtitle">Jetpack Compose-inspired UI framework for Rust</p>

        <canvas id="cranpose-canvas" width="800" height="600"></canvas>

        <div id="loading" class="loading">Loading WASM module...</div>
        <div id="error" class="error" style="display: none;"></div>

        <div class="info">
            <p>Powered by Rust 🦀 + WebAssembly + WebGPU/WebGL2</p>
            <p>Full demo with interactive examples, animations, and more!</p>
        </div>

        <div class="links">
            <a href="https://github.com/samoylenkodmitry/cranpose" target="_blank">GitHub</a>
            <a href="https://github.com/samoylenkodmitry/cranpose/blob/main/docs/ARCHITECTURE.md" target="_blank">Documentation</a>
        </div>
    </div>

    <script type="module">
        const MAX_CAPTURED_CONSOLE_MESSAGES = 2000;
        const capturedConsoleMessages = [];
        const appState = {
            phase: 'booting',
            backend: null,
            initialTab: null,
            lastUpdatedMs: Date.now(),
            error: null,
        };

        window.__cranposeConsoleMessages = capturedConsoleMessages;
        window.__cranposeAppState = appState;

        function updateAppState(phase, extra = {}) {
            Object.assign(appState, extra, {
                phase,
                lastUpdatedMs: Date.now(),
            });
        }

        function serializeConsoleValue(value) {
            if (value instanceof Error) {
                return value.stack || value.message || String(value);
            }
            if (typeof value === 'string') {
                return value;
            }
            if (value === undefined) {
                return 'undefined';
            }
            if (value === null) {
                return 'null';
            }
            if (typeof value === 'object') {
                try {
                    return JSON.stringify(value);
                } catch (_) {
                    return String(value);
                }
            }
            return String(value);
        }

        function captureConsole(level, args) {
            const serializedArgs = args.map(serializeConsoleValue);
            capturedConsoleMessages.push({
                level,
                args: serializedArgs,
                text: serializedArgs.join(' '),
                timestampMs: Date.now(),
            });
            if (capturedConsoleMessages.length > MAX_CAPTURED_CONSOLE_MESSAGES) {
                capturedConsoleMessages.splice(
                    0,
                    capturedConsoleMessages.length - MAX_CAPTURED_CONSOLE_MESSAGES,
                );
            }
        }

        const originalConsole = {};
        for (const level of ['log', 'info', 'warn', 'error']) {
            originalConsole[level] = console[level].bind(console);
            console[level] = (...args) => {
                captureConsole(level, args);
                originalConsole[level](...args);
            };
        }

        window.addEventListener('error', (event) => {
            captureConsole('error', [
                'window.error',
                event.message || '',
                event.filename || '',
                event.lineno || 0,
                event.colno || 0,
            ]);
        });

        window.addEventListener('unhandledrejection', (event) => {
            captureConsole('error', [
                'window.unhandledrejection',
                serializeConsoleValue(event.reason),
            ]);
        });

        function registerGraphicsContextMonitor(canvas) {
            if (!canvas) {
                return;
            }

            canvas.addEventListener('webglcontextlost', (event) => {
                event.preventDefault();
                const message = 'Graphics context lost';
                console.error(message);
                updateAppState('error', { error: message });
            });

            canvas.addEventListener('webglcontextrestored', (event) => {
                event.preventDefault();
                if (appState.phase !== 'error') {
                    const message = 'Graphics context restored after loss';
                    console.warn(message);
                    updateAppState('error', { error: message });
                }
            });
        }

        async function init() {
            try {
                const params = new URLSearchParams(window.location.search);
                const backend = params.get('backend') || 'gl';
                const initialTab = params.get('tab');
                updateAppState('initializing', { backend, initialTab });
                registerGraphicsContextMonitor(document.getElementById('cranpose-canvas'));
                const hasWebGpu = typeof navigator !== 'undefined' && 'gpu' in navigator;
                const canvas = document.createElement('canvas');
                const hasWebGl2 = !!canvas.getContext('webgl2');
                if (backend === 'webgpu' && !hasWebGpu) {
                    throw new Error('This URL forced backend=webgpu, but WebGPU is not available in this browser.');
                }
                if (backend === 'gl' && !hasWebGl2) {
                    throw new Error('This URL forced backend=gl, but WebGL2 is not available in this browser.');
                }
                if (!hasWebGpu && !hasWebGl2) {
                    throw new Error('Neither WebGPU nor WebGL2 is supported in this browser. Please use a current browser with modern graphics support.');
                }
                console.log(`Graphics startup preference: backend=${backend}`);
                if (initialTab) {
                    console.log(`UI startup preference: tab=${initialTab}`);
                }

                // Import the WASM module
                updateAppState('loading_wasm');
                const wasm = await import('./pkg/desktop_app.js');

                // Initialize the WASM module (this loads the .wasm file)
                await wasm.default();

                // Now run the app (functions are available after init)
                updateAppState('starting_app');
                await wasm.run_app(initialTab);
                updateAppState('running');

                // Hide loading message
                document.getElementById('loading').style.display = 'none';
            } catch (err) {
                console.error('Failed to initialize app:', err);
                updateAppState('error', {
                    error: err.message || err.toString(),
                });
                document.getElementById('loading').style.display = 'none';
                const errorDiv = document.getElementById('error');
                errorDiv.style.display = 'block';

                let errorHtml = `<h3>Error Loading Application</h3><p>${err.message || err.toString()}</p>`;

                if ((err.message || '').includes('WebGPU') || (err.message || '').includes('WebGL')) {
                    errorHtml += `
                        <hr>
                        <h4>Graphics Support Missing</h4>
                        <p style="text-align: left;">This demo defaults to the stable WebGL2 path and supports manual overrides with <code>?backend=webgpu</code>, <code>?backend=gl</code>, or <code>?backend=auto</code>.</p>
                        <h5>Solutions:</h5>
                        <ol style="text-align: left;">
                            <li>Update your browser to the latest version</li>
                            <li>Enable WebGPU or WebGL in your browser settings</li>
                            <li>Update your graphics drivers</li>
                            <li>Use the default WebGL2 path or <code>?backend=gl</code> if WebGPU startup is unstable on your browser</li>
                            <li>Try a different browser (Chrome, Edge, Safari, or Firefox with the needed graphics support)</li>
                        </ol>
                    `;
                } else {
                    errorHtml += `
                        <hr>
                        <h4>Troubleshooting:</h4>
                        <ol style="text-align: left;">
                            <li>Check the browser console for detailed errors</li>
                            <li>Ensure you're serving over HTTP (not file://)</li>
                            <li>Try refreshing the page</li>
                            <li>Update your browser to the latest version</li>
                        </ol>
                    `;
                }

                errorDiv.innerHTML = errorHtml;
            }
        }

        init();
    </script>
</body>
</html>

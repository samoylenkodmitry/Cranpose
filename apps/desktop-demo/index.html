<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f6f7fb">
    <title>Cranpose Demo</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #f6f7fb;
        }

        body {
            position: fixed;
            inset: 0;
        }

        #cranpose-canvas {
            position: absolute;
            z-index: 0;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            background: #ffffff;
            touch-action: none;
        }

        .boot-surface {
            position: absolute;
            z-index: 1;
            inset: 0;
            display: grid;
            place-items: center;
            box-sizing: border-box;
            padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
            background:
                radial-gradient(circle at 50% 44%, rgba(108, 99, 255, 0.08), transparent 28rem),
                #f6f7fb;
            color: #171821;
            opacity: 1;
            visibility: visible;
            transition: opacity 160ms ease, visibility 0s linear 160ms;
        }

        body[data-phase="running"] .boot-surface {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .boot-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: min(22rem, 100%);
            text-align: center;
        }

        .boot-symbol {
            display: grid;
            place-items: center;
            width: 3.5rem;
            height: 3.5rem;
            margin-bottom: 1.25rem;
            border: 1px solid rgba(65, 63, 121, 0.1);
            border-radius: 1.25rem;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(232, 230, 255, 0.92));
            box-shadow:
                0 1rem 2.5rem rgba(67, 59, 160, 0.12),
                inset 0 1px rgba(255, 255, 255, 0.9);
        }

        .boot-symbol::before {
            width: 1.1rem;
            height: 1.1rem;
            border: 3px solid rgba(91, 80, 232, 0.16);
            border-top-color: #5b50e8;
            border-radius: 50%;
            content: "";
            animation: boot-spin 850ms linear infinite;
        }

        .boot-title {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 650;
            letter-spacing: -0.02em;
        }

        .boot-status {
            min-height: 1.25rem;
            margin: 0.55rem 0 0;
            color: #727482;
            font-size: 0.9rem;
        }

        .boot-error {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        body[data-phase="error"] .boot-title,
        body[data-phase="error"] .boot-status {
            display: none;
        }

        body[data-phase="error"] .boot-symbol::before {
            width: auto;
            height: auto;
            border: 0;
            color: #bc3347;
            content: "!";
            font-size: 1.4rem;
            font-weight: 750;
            animation: none;
        }

        body[data-phase="error"] .boot-error {
            display: flex;
        }

        .boot-error-title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 650;
        }

        .boot-error-message {
            max-width: 100%;
            margin: 0.55rem 0 1.1rem;
            overflow-wrap: anywhere;
            color: #727482;
            font-size: 0.82rem;
            line-height: 1.45;
        }

        .boot-retry {
            min-width: 6.5rem;
            min-height: 2.6rem;
            border: 0;
            border-radius: 0.8rem;
            background: #27283a;
            color: #ffffff;
            font: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .boot-retry:focus-visible {
            outline: 3px solid rgba(91, 80, 232, 0.35);
            outline-offset: 3px;
        }

        @keyframes boot-spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .boot-surface {
                transition: none;
            }

            .boot-symbol::before {
                animation-duration: 1.8s;
            }
        }
    </style>
    <noscript>
        <style>
            .boot-symbol,
            #boot-status {
                display: none;
            }
        </style>
    </noscript>
</head>
<body data-phase="booting">
    <canvas id="cranpose-canvas" width="800" height="600"></canvas>

    <main id="boot-surface" class="boot-surface" role="status" aria-live="polite" aria-atomic="true">
        <div class="boot-content">
            <div class="boot-symbol" aria-hidden="true"></div>
            <p class="boot-title">Cranpose</p>
            <p id="boot-status" class="boot-status">Preparing the demo…</p>
            <noscript>
                <p class="boot-status">The demo needs JavaScript. Turn JavaScript on in the browser’s settings, then reload the page.</p>
            </noscript>
            <div class="boot-error" role="alert">
                <p class="boot-error-title">Cranpose couldn’t start</p>
                <p id="error-message" class="boot-error-message"></p>
                <button id="retry" class="boot-retry" type="button">Reload</button>
            </div>
        </div>
    </main>

    <script type="module">
        const MAX_CAPTURED_CONSOLE_MESSAGES = 2000;
        const capturedConsoleMessages = [];
        const appState = {
            phase: 'booting',
            backend: null,
            initialTab: null,
            initialShaderSection: null,
            bundle: null,
            lastUpdatedMs: Date.now(),
            error: null,
        };
        const bootSurface = document.getElementById('boot-surface');
        const bootStatus = document.getElementById('boot-status');
        const errorMessage = document.getElementById('error-message');

        window.__cranposeConsoleMessages = capturedConsoleMessages;
        window.__cranposeAppState = appState;

        function updateAppState(phase, extra = {}) {
            Object.assign(appState, extra, {
                phase,
                lastUpdatedMs: Date.now(),
            });
            document.body.dataset.phase = phase;
            if (phase === 'running') {
                bootSurface.setAttribute('aria-hidden', 'true');
            } else {
                bootSurface.removeAttribute('aria-hidden');
            }
        }

        function updateBootStatus(message) {
            bootStatus.textContent = message;
        }

        function serializeConsoleValue(value) {
            if (value instanceof Error) {
                return value.stack || value.message || String(value);
            }
            if (typeof value === 'string') {
                return value;
            }
            if (value === undefined) {
                return 'undefined';
            }
            if (value === null) {
                return 'null';
            }
            if (typeof value === 'object') {
                try {
                    return JSON.stringify(value);
                } catch (_) {
                    return String(value);
                }
            }
            return String(value);
        }

        function captureConsole(level, args) {
            const serializedArgs = args.map(serializeConsoleValue);
            capturedConsoleMessages.push({
                level,
                args: serializedArgs,
                text: serializedArgs.join(' '),
                timestampMs: Date.now(),
            });
            if (capturedConsoleMessages.length > MAX_CAPTURED_CONSOLE_MESSAGES) {
                capturedConsoleMessages.splice(
                    0,
                    capturedConsoleMessages.length - MAX_CAPTURED_CONSOLE_MESSAGES,
                );
            }
        }

        const originalConsole = {};
        for (const level of ['log', 'info', 'warn', 'error']) {
            originalConsole[level] = console[level].bind(console);
            console[level] = (...args) => {
                captureConsole(level, args);
                originalConsole[level](...args);
            };
        }

        window.addEventListener('error', (event) => {
            captureConsole('error', [
                'window.error',
                event.message || '',
                event.filename || '',
                event.lineno || 0,
                event.colno || 0,
            ]);
        });

        window.addEventListener('unhandledrejection', (event) => {
            captureConsole('error', [
                'window.unhandledrejection',
                serializeConsoleValue(event.reason),
            ]);
        });

        function verifiedAssetUrl(path) {
            if (typeof path !== 'string' || !path.startsWith('assets/')) {
                throw new Error('The web release manifest is invalid.');
            }
            const url = new URL(path, document.baseURI);
            if (url.origin !== window.location.origin) {
                throw new Error('The web release manifest points outside this site.');
            }
            return url;
        }

        async function loadBundleManifest() {
            const manifestUrl = new URL('asset-manifest.json', document.baseURI);
            manifestUrl.searchParams.set('request', Date.now().toString());
            const response = await fetch(manifestUrl, { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`Unable to load the web release manifest (${response.status}).`);
            }
            const manifest = await response.json();
            if (manifest.version !== 1) {
                throw new Error('The web release manifest version is unsupported.');
            }
            const moduleUrl = verifiedAssetUrl(manifest.module);
            const wasmUrl = verifiedAssetUrl(manifest.wasm);
            if (new URL('.', moduleUrl).href !== new URL('.', wasmUrl).href) {
                throw new Error('The JavaScript and WASM release assets do not match.');
            }
            return { moduleUrl, wasmUrl };
        }

        function showFailure(error) {
            const message = error instanceof Error ? error.message : String(error);
            updateAppState('error', { error: message });
            errorMessage.textContent = message;
        }

        // WebXR for the XR tab. The page owns the immersive session. While it runs, the session
        // paces Cranpose's frames through window.cranposeFrameSource. The app draws both eyes side
        // by side on its canvas. The page copies each half into the headset's layer for that eye.
        // With ?xr=mock a fake headset turns its head on the window's frames, and the page shows
        // what the headset would get in the corner.
        const EYE_DATA_LENGTH = 11;
        const BLIT_VERTEX = `#version 300 es
            uniform vec4 rect;
            out vec2 uv;
            void main() {
                vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
                gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
                // The texture holds the canvas top row first: the viewport's bottom takes rect.w.
                uv = vec2(mix(rect.x, rect.z, p.x), mix(rect.w, rect.y, p.y));
            }`;
        const BLIT_FRAGMENT = `#version 300 es
            precision mediump float;
            uniform sampler2D image;
            in vec2 uv;
            out vec4 color;
            void main() { color = texture(image, uv); }`;

        function blitProgram(gl) {
            const shader = (type, source) => {
                const s = gl.createShader(type);
                gl.shaderSource(s, source);
                gl.compileShader(s);
                if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
                    throw new Error(gl.getShaderInfoLog(s));
                }
                return s;
            };
            const program = gl.createProgram();
            gl.attachShader(program, shader(gl.VERTEX_SHADER, BLIT_VERTEX));
            gl.attachShader(program, shader(gl.FRAGMENT_SHADER, BLIT_FRAGMENT));
            gl.linkProgram(program);
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                throw new Error(gl.getProgramInfoLog(program));
            }
            return { program, rect: gl.getUniformLocation(program, 'rect') };
        }

        // An eye for the app: position, orientation and the tangents of the view's left, right,
        // up and down edges, read from the projection matrix.
        function writeEye(data, offset, view) {
            const { position: p, orientation: q } = view.transform;
            const m = view.projectionMatrix;
            data.set([p.x, p.y, p.z, q.x, q.y, q.z, q.w,
                (m[8] - 1) / m[0], (1 + m[8]) / m[0], (1 + m[9]) / m[5], (m[9] - 1) / m[5]], offset);
        }

        // The part of a half of the canvas that the app fills with an eye's view: the view keeps
        // square pixels and sits in the middle of the half. In texture coordinates.
        function eyeRect(data, offset, half, width, height) {
            const [l, r, u, d] = data.subarray(offset + 7, offset + EYE_DATA_LENGTH);
            const halfWidth = width / 2;
            const focal = Math.min(halfWidth / (r - l), height / (u - d));
            const w = focal * (r - l);
            const h = focal * (u - d);
            const x = half * halfWidth + (halfWidth - w) / 2;
            const y = (height - h) / 2;
            return [x / width, y / height, (x + w) / width, (y + h) / height];
        }

        function projection(l, r, u, d) {
            const m = new Float32Array(16);
            m[0] = 2 / (r - l);
            m[5] = 2 / (u - d);
            m[8] = (r + l) / (r - l);
            m[9] = (u + d) / (u - d);
            m[10] = -1;
            m[11] = -1;
            m[14] = -0.1;
            return m;
        }

        // A headset for tests: a Quest 3's views on a head that turns left and right.
        function mockXr(output) {
            const fov = { left: [-1.2, 0.95, 0.95, -1.15], right: [-0.95, 1.2, 0.95, -1.15] };
            const size = { width: 1600, height: 880 };
            return {
                isSessionSupported: async () => true,
                async requestSession() {
                    const listeners = [];
                    const session = {
                        ended: false,
                        requestReferenceSpace: async () => ({}),
                        updateRenderState() {},
                        requestAnimationFrame(callback) {
                            window.requestAnimationFrame((time) => {
                                if (!session.ended) {
                                    callback(time, mockFrame(time));
                                }
                            });
                        },
                        addEventListener(_, listener) { listeners.push(listener); },
                        async end() {
                            session.ended = true;
                            listeners.forEach((listener) => listener());
                        },
                    };
                    return session;
                },
                Layer: class {
                    constructor(_, gl) {
                        this.framebuffer = null;
                        this.framebufferWidth = size.width;
                        this.framebufferHeight = size.height;
                        gl.canvas.width = size.width;
                        gl.canvas.height = size.height;
                        output.append(gl.canvas);
                    }
                    getViewport(view) {
                        const half = size.width / 2;
                        return { x: view.eye === 'left' ? 0 : half, y: 0, width: half, height: size.height };
                    }
                },
            };
            function mockFrame(time) {
                const yaw = 0.35 * Math.sin(time / 1500);
                const orientation = { x: 0, y: Math.sin(yaw / 2), z: 0, w: Math.cos(yaw / 2) };
                const eye = (name, side) => ({
                    eye: name,
                    transform: {
                        position: { x: 0.032 * side * Math.cos(yaw), y: 1.6, z: -0.032 * side * Math.sin(yaw) },
                        orientation,
                    },
                    projectionMatrix: projection(...fov[name]),
                });
                const views = [eye('left', -1), eye('right', 1)];
                return { getViewerPose: () => ({ views }) };
            }
        }

        function installXr(wasm, canvas, mock) {
            let output = null;
            if (mock) {
                output = document.createElement('div');
                output.id = 'xr-mock-output';
                output.style.cssText = 'position:fixed;right:8px;bottom:8px;width:40%;z-index:2;'
                    + 'outline:2px solid #3c6;background:#000';
                document.body.append(output);
            }
            const xr = mock ? mockXr(output) : navigator.xr;
            const Layer = mock ? xr.Layer : window.XRWebGLLayer;
            window.cranposeXr = {
                enter() {
                    enter().catch((error) => console.error('WebXR session failed:', error));
                },
            };
            if (!xr) {
                return;
            }
            xr.isSessionSupported('immersive-vr')
                .then((supported) => wasm.xr_supported(supported))
                .catch(() => wasm.xr_supported(false));

            async function enter() {
                const glCanvas = document.createElement('canvas');
                if (mock) {
                    glCanvas.style.cssText = 'display:block;width:100%';
                }
                const gl = glCanvas.getContext('webgl2', {
                    xrCompatible: true, alpha: false, antialias: false, depth: false,
                });
                // The session needs the button's user activation: ask for it before other awaits.
                const session = await xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] });
                let space;
                try {
                    space = await session.requestReferenceSpace('local-floor');
                } catch (_) {
                    // A space at the head: the floor lies 1.6 meters below it.
                    const local = await session.requestReferenceSpace('local');
                    space = local.getOffsetReferenceSpace(new XRRigidTransform({ x: 0, y: -1.6, z: 0 }));
                }
                const layer = new Layer(session, gl, { antialias: false, depth: false });
                session.updateRenderState({ baseLayer: layer });

                const blit = blitProgram(gl);
                const texture = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, texture);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                // Chrome uploads the app's WebGL2 canvas bottom row first and its WebGPU canvas
                // top row first. getContext returns the canvas's own context of that kind, or null.
                const appUsesGl = canvas.getContext('webgl2') !== null;
                gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, appUsesGl);
                let hasImage = false;

                // The canvas takes the layer's size, so each half lands pixel for pixel in its eye.
                // The page does not render while the headset shows the session, so no resize
                // observation comes: a resize event tells the app.
                const savedStyle = canvas.style.cssText;
                const ratio = window.devicePixelRatio || 1;
                canvas.style.cssText = `position:absolute;left:0;top:0;`
                    + `width:${layer.framebufferWidth / ratio}px;height:${layer.framebufferHeight / ratio}px`;
                window.dispatchEvent(new Event('resize'));

                let appFrame = null;
                window.cranposeFrameSource = { requestFrame(callback) { appFrame = callback; } };
                wasm.xr_presenting(true);
                const data = new Float32Array(2 * EYE_DATA_LENGTH);

                session.addEventListener('end', () => {
                    delete window.cranposeFrameSource;
                    canvas.style.cssText = savedStyle;
                    wasm.xr_presenting(false);
                    window.dispatchEvent(new Event('resize'));
                    if (appFrame) {
                        window.requestAnimationFrame(appFrame);
                        appFrame = null;
                    }
                    if (output) {
                        glCanvas.remove();
                    }
                });

                const onFrame = (time, frame) => {
                    session.requestAnimationFrame(onFrame);
                    const pose = frame.getViewerPose(space);
                    if (!pose) {
                        return;
                    }
                    const left = pose.views.find((view) => view.eye === 'left') || pose.views[0];
                    const right = pose.views.find((view) => view.eye === 'right') || pose.views[1] || left;
                    writeEye(data, 0, left);
                    writeEye(data, EYE_DATA_LENGTH, right);
                    wasm.xr_views(data);
                    const run = appFrame;
                    appFrame = null;
                    gl.bindTexture(gl.TEXTURE_2D, texture);
                    if (run) {
                        // The app draws both eyes now. Its canvas keeps the picture until this
                        // task ends: the texture takes it here.
                        run();
                        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvas);
                        hasImage = true;
                    }
                    if (!hasImage) {
                        return;
                    }
                    gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
                    gl.useProgram(blit.program);
                    for (const [half, view] of [[0, left], [1, right]]) {
                        const viewport = layer.getViewport(view);
                        gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);
                        gl.uniform4fv(blit.rect, eyeRect(data, half * EYE_DATA_LENGTH, half, canvas.width, canvas.height));
                        gl.drawArrays(gl.TRIANGLES, 0, 3);
                    }
                };
                session.requestAnimationFrame(onFrame);
                window.cranposeXr.session = session;
            }
        }

        async function init() {
            try {
                const params = new URLSearchParams(window.location.search);
                const backend = params.get('backend') || 'auto';
                const initialTab = params.get('tab');
                const initialShaderSection = params.get('shader_section');
                updateAppState('initializing', { backend, initialTab, initialShaderSection });

                // Safari's Lockdown Mode removes WebAssembly together with WebGL
                // and WebGPU, so the missing WebAssembly names the cause.
                if (typeof WebAssembly !== 'object') {
                    throw new Error('This browser runs no WebAssembly. Safari turns WebAssembly off in Lockdown Mode. Turn Lockdown Mode off for this site in Safari’s Website Settings.');
                }
                const hasWebGpu = 'gpu' in navigator;
                const probeCanvas = document.createElement('canvas');
                const hasWebGl2 = !!probeCanvas.getContext('webgl2');
                if (backend === 'webgpu' && !hasWebGpu) {
                    throw new Error('WebGPU is unavailable. Reload without the WebGPU override.');
                }
                if (backend === 'gl' && !hasWebGl2) {
                    throw new Error('WebGL2 is unavailable in this browser.');
                }
                if (!hasWebGpu && !hasWebGl2) {
                    throw new Error('This browser does not provide WebGPU or WebGL2.');
                }

                console.log(`Graphics startup preference: backend=${backend}`);
                updateBootStatus('Loading the interface…');
                updateAppState('loading_wasm');
                const { moduleUrl, wasmUrl } = await loadBundleManifest();
                const wasm = await import(moduleUrl.href);
                await wasm.default({ module_or_path: wasmUrl });

                updateBootStatus('Starting Cranpose…');
                updateAppState('starting_app', { bundle: moduleUrl.pathname });
                await wasm.run_app(initialTab, initialShaderSection);
                installXr(wasm, document.getElementById('cranpose-canvas'), params.get('xr') === 'mock');
                updateAppState('running');
            } catch (error) {
                console.error('Failed to initialize app:', error);
                showFailure(error);
            }
        }

        document.getElementById('retry').addEventListener('click', () => window.location.reload());
        init();
    </script>
</body>
</html>

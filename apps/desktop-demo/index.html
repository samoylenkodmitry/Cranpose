<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f6f7fb">
    <title>Cranpose Demo</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #f6f7fb;
        }

        body {
            position: fixed;
            inset: 0;
        }

        #cranpose-canvas {
            position: absolute;
            z-index: 0;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            background: #ffffff;
            touch-action: none;
        }

        .boot-surface {
            position: absolute;
            z-index: 1;
            inset: 0;
            display: grid;
            place-items: center;
            box-sizing: border-box;
            padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
            background:
                radial-gradient(circle at 50% 44%, rgba(108, 99, 255, 0.08), transparent 28rem),
                #f6f7fb;
            color: #171821;
            opacity: 1;
            visibility: visible;
            transition: opacity 160ms ease, visibility 0s linear 160ms;
        }

        body[data-phase="running"] .boot-surface {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .boot-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: min(22rem, 100%);
            text-align: center;
        }

        .boot-symbol {
            display: grid;
            place-items: center;
            width: 3.5rem;
            height: 3.5rem;
            margin-bottom: 1.25rem;
            border: 1px solid rgba(65, 63, 121, 0.1);
            border-radius: 1.25rem;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(232, 230, 255, 0.92));
            box-shadow:
                0 1rem 2.5rem rgba(67, 59, 160, 0.12),
                inset 0 1px rgba(255, 255, 255, 0.9);
        }

        .boot-symbol::before {
            width: 1.1rem;
            height: 1.1rem;
            border: 3px solid rgba(91, 80, 232, 0.16);
            border-top-color: #5b50e8;
            border-radius: 50%;
            content: "";
            animation: boot-spin 850ms linear infinite;
        }

        .boot-title {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 650;
            letter-spacing: -0.02em;
        }

        .boot-status {
            min-height: 1.25rem;
            margin: 0.55rem 0 0;
            color: #727482;
            font-size: 0.9rem;
        }

        .boot-error {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        body[data-phase="error"] .boot-status {
            display: none;
        }

        body[data-phase="error"] .boot-symbol::before {
            width: auto;
            height: auto;
            border: 0;
            color: #bc3347;
            content: "!";
            font-size: 1.4rem;
            font-weight: 750;
            animation: none;
        }

        body[data-phase="error"] .boot-error {
            display: flex;
        }

        .boot-error-title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 650;
        }

        .boot-error-message {
            max-width: 100%;
            margin: 0.55rem 0 1.1rem;
            overflow-wrap: anywhere;
            color: #727482;
            font-size: 0.82rem;
            line-height: 1.45;
        }

        .boot-retry {
            min-width: 6.5rem;
            min-height: 2.6rem;
            border: 0;
            border-radius: 0.8rem;
            background: #27283a;
            color: #ffffff;
            font: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .boot-retry:focus-visible {
            outline: 3px solid rgba(91, 80, 232, 0.35);
            outline-offset: 3px;
        }

        @keyframes boot-spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .boot-surface {
                transition: none;
            }

            .boot-symbol::before {
                animation-duration: 1.8s;
            }
        }
    </style>
</head>
<body data-phase="booting">
    <canvas id="cranpose-canvas" width="800" height="600"></canvas>

    <main id="boot-surface" class="boot-surface" role="status" aria-live="polite" aria-atomic="true">
        <div class="boot-content">
            <div class="boot-symbol" aria-hidden="true"></div>
            <p class="boot-title">Cranpose</p>
            <p id="boot-status" class="boot-status">Preparing the demo…</p>
            <div class="boot-error" role="alert">
                <p class="boot-error-title">Cranpose couldn’t start</p>
                <p id="error-message" class="boot-error-message"></p>
                <button id="retry" class="boot-retry" type="button">Reload</button>
            </div>
        </div>
    </main>

    <script type="module">
        const MAX_CAPTURED_CONSOLE_MESSAGES = 2000;
        const capturedConsoleMessages = [];
        const appState = {
            phase: 'booting',
            backend: null,
            initialTab: null,
            initialShaderSection: null,
            bundle: null,
            lastUpdatedMs: Date.now(),
            error: null,
        };
        const bootSurface = document.getElementById('boot-surface');
        const bootStatus = document.getElementById('boot-status');
        const errorMessage = document.getElementById('error-message');

        window.__cranposeConsoleMessages = capturedConsoleMessages;
        window.__cranposeAppState = appState;

        function updateAppState(phase, extra = {}) {
            Object.assign(appState, extra, {
                phase,
                lastUpdatedMs: Date.now(),
            });
            document.body.dataset.phase = phase;
            if (phase === 'running') {
                bootSurface.setAttribute('aria-hidden', 'true');
            } else {
                bootSurface.removeAttribute('aria-hidden');
            }
        }

        function updateBootStatus(message) {
            bootStatus.textContent = message;
        }

        function serializeConsoleValue(value) {
            if (value instanceof Error) {
                return value.stack || value.message || String(value);
            }
            if (typeof value === 'string') {
                return value;
            }
            if (value === undefined) {
                return 'undefined';
            }
            if (value === null) {
                return 'null';
            }
            if (typeof value === 'object') {
                try {
                    return JSON.stringify(value);
                } catch (_) {
                    return String(value);
                }
            }
            return String(value);
        }

        function captureConsole(level, args) {
            const serializedArgs = args.map(serializeConsoleValue);
            capturedConsoleMessages.push({
                level,
                args: serializedArgs,
                text: serializedArgs.join(' '),
                timestampMs: Date.now(),
            });
            if (capturedConsoleMessages.length > MAX_CAPTURED_CONSOLE_MESSAGES) {
                capturedConsoleMessages.splice(
                    0,
                    capturedConsoleMessages.length - MAX_CAPTURED_CONSOLE_MESSAGES,
                );
            }
        }

        const originalConsole = {};
        for (const level of ['log', 'info', 'warn', 'error']) {
            originalConsole[level] = console[level].bind(console);
            console[level] = (...args) => {
                captureConsole(level, args);
                originalConsole[level](...args);
            };
        }

        window.addEventListener('error', (event) => {
            captureConsole('error', [
                'window.error',
                event.message || '',
                event.filename || '',
                event.lineno || 0,
                event.colno || 0,
            ]);
        });

        window.addEventListener('unhandledrejection', (event) => {
            captureConsole('error', [
                'window.unhandledrejection',
                serializeConsoleValue(event.reason),
            ]);
        });

        function registerGraphicsContextMonitor(canvas) {
            if (!canvas) {
                return;
            }

            canvas.addEventListener('webglcontextlost', (event) => {
                event.preventDefault();
                const message = 'Graphics context lost';
                console.error(message);
                showFailure(message);
            });

            canvas.addEventListener('webglcontextrestored', (event) => {
                event.preventDefault();
                const message = 'Graphics context restored; reload to resume';
                console.warn(message);
                showFailure(message);
            });
        }

        function verifiedAssetUrl(path) {
            if (typeof path !== 'string' || !path.startsWith('assets/')) {
                throw new Error('The web release manifest is invalid.');
            }
            const url = new URL(path, document.baseURI);
            if (url.origin !== window.location.origin) {
                throw new Error('The web release manifest points outside this site.');
            }
            return url;
        }

        async function loadBundleManifest() {
            const manifestUrl = new URL('asset-manifest.json', document.baseURI);
            manifestUrl.searchParams.set('request', Date.now().toString());
            const response = await fetch(manifestUrl, { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`Unable to load the web release manifest (${response.status}).`);
            }
            const manifest = await response.json();
            if (manifest.version !== 1) {
                throw new Error('The web release manifest version is unsupported.');
            }
            const moduleUrl = verifiedAssetUrl(manifest.module);
            const wasmUrl = verifiedAssetUrl(manifest.wasm);
            if (new URL('.', moduleUrl).href !== new URL('.', wasmUrl).href) {
                throw new Error('The JavaScript and WASM release assets do not match.');
            }
            return { moduleUrl, wasmUrl };
        }

        function showFailure(error) {
            const message = error instanceof Error ? error.message : String(error);
            updateAppState('error', { error: message });
            errorMessage.textContent = message;
        }

        async function init() {
            try {
                const params = new URLSearchParams(window.location.search);
                const backend = params.get('backend') || 'gl';
                const initialTab = params.get('tab');
                const initialShaderSection = params.get('shader_section');
                updateAppState('initializing', { backend, initialTab, initialShaderSection });
                registerGraphicsContextMonitor(document.getElementById('cranpose-canvas'));

                const hasWebGpu = 'gpu' in navigator;
                const probeCanvas = document.createElement('canvas');
                const hasWebGl2 = !!probeCanvas.getContext('webgl2');
                if (backend === 'webgpu' && !hasWebGpu) {
                    throw new Error('WebGPU is unavailable. Reload without the WebGPU override.');
                }
                if (backend === 'gl' && !hasWebGl2) {
                    throw new Error('WebGL2 is unavailable in this browser.');
                }
                if (!hasWebGpu && !hasWebGl2) {
                    throw new Error('This browser does not provide WebGPU or WebGL2.');
                }

                console.log(`Graphics startup preference: backend=${backend}`);
                updateBootStatus('Loading the interface…');
                updateAppState('loading_wasm');
                const { moduleUrl, wasmUrl } = await loadBundleManifest();
                const wasm = await import(moduleUrl.href);
                await wasm.default({ module_or_path: wasmUrl });

                updateBootStatus('Starting Cranpose…');
                updateAppState('starting_app', { bundle: moduleUrl.pathname });
                await wasm.run_app(initialTab, initialShaderSection);
                updateAppState('running');
            } catch (error) {
                console.error('Failed to initialize app:', error);
                showFailure(error);
            }
        }

        document.getElementById('retry').addEventListener('click', () => window.location.reload());
        init();
    </script>
</body>
</html>

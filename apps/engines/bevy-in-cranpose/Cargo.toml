[package]
name = "bevy-in-cranpose"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A Bevy 3D scene with shadows and bloom inside a Cranpose window, on one wgpu device"

[dependencies]
bevy = { workspace = true, features = ["default_app", "3d_bevy_render", "multi_threaded", "std"] }
cranpose = { workspace = true, features = ["desktop", "renderer-wgpu", "embedded-default-font"] }
cranpose-bevy = { workspace = true }
demo-scene = { workspace = true }
demo-ui = { workspace = true }

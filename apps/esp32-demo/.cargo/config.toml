[build]
target = "xtensa-esp32s3-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
runner = "espflash flash --monitor --partition-table partitions.csv"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]
# Without std's backtrace: it reads symbols from an ELF file the device does
# not have, and its gimli, addr2line and demangling took 70 KB of code. A
# panic prints its message, and ESP-IDF prints the addresses to decode.
build-std-features = []

[env]
MCU = "esp32s3"
ESP_IDF_VERSION = "v5.5.5"
ESP_IDF_TOOLS_INSTALL_DIR = "global"

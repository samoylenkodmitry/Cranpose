[package]
name = "esp32-demo"
version = "0.1.0"
edition = "2024"
description = "Cranpose on an ESP32-S3 through ESP-IDF"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/samoylenkodmitry/cranpose"
publish = false

[[bin]]
name = "esp32-demo"
harness = false

[dependencies]
cranpose = { path = "../../crates/cranpose", default-features = false, features = ["framebuffer"] }
cranpose-animation = { path = "../../crates/cranpose-animation" }
cranpose-core = { path = "../../crates/cranpose-core" }
cranpose-platform-esp-idf = { path = "../../crates/cranpose-platform/esp-idf" }
esp-idf-svc = "0.53"
log = "0.4"

[build-dependencies]
embuild = "0.33.5"

[workspace]
members = [".", "../../crates/cranpose-platform/esp-idf"]

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

# The repository's cargo config sets MACOSX_DEPLOYMENT_TARGET=12.0. Proc-macros
# that the esp toolchain links for it and then strips fail to load on macOS 27
# ("mis-aligned LINKEDIT string pool").
[profile.release.build-override]
strip = false

[profile.dev.build-override]
strip = false

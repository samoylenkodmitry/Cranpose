[package]
name = "esp32-demo"
version = "0.1.0"
edition = "2024"
description = "Cranpose on an ESP32 through ESP-IDF"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/samoylenkodmitry/cranpose"
publish = false

[[bin]]
name = "esp32-demo"
harness = false

[features]
# Runs on the Hosyond ES3C35P board's display and touch panel.
es3c35p = []
# Runs on the 3.5-inch ESP32-32E board's display and touch panel, for the
# `xtensa-esp32-espidf` target. Without a board feature the demo draws on
# QEMU's virtual panel.
e32r35t = []

[dependencies]
cranpose ={ path = "../../crates/cranpose", default-features = false, features = ["framebuffer"] }
cranpose-animation = { path = "../../crates/cranpose-animation" }
cranpose-core = { path = "../../crates/cranpose-core" }
cranpose-platform-esp-idf = { path = "../../crates/cranpose-platform/esp-idf" }
esp-idf-svc = "0.53"
log = "0.4"

[build-dependencies]
embuild = "0.33.5"

[workspace]
members = [".", "../../crates/cranpose-platform/esp-idf"]

# Measured under QEMU's instruction counter with the S3's 16 KB instruction
# cache simulated. Against "s", opt-level 2 runs a frame of the demo in 19%
# fewer instructions with 11% fewer cache misses, for 290 KB more code in an
# 8 MB partition. Fat LTO in one codegen unit, as the workspace's release
# profile has, then inlines the small functions of other crates: a frame
# fetches 5.5% fewer instructions with 10% fewer instruction cache misses,
# and the image has 160 KB less code and 57 KB less read-only data.
# esp-idf-sys builds ESP-IDF's C code at -O2 to match.
[profile.release]
opt-level = 2
lto = "fat"
codegen-units = 1

[profile.dev]
debug = true
opt-level = "z"

# The repository's cargo config sets MACOSX_DEPLOYMENT_TARGET=12.0. Proc-macros
# that the esp toolchain links for it and then strips fail to load on macOS 27
# ("mis-aligned LINKEDIT string pool").
[profile.release.build-override]
strip = false

[profile.dev.build-override]
strip = false

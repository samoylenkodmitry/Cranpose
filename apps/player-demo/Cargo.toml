[package]
name = "player-demo"
description = "A Cranpose app that plays two clips through the hardware decoder and PlayerSurface."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "player-demo"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["renderer-wgpu", "desktop"]
renderer-wgpu = ["cranpose/renderer-wgpu"]
desktop = ["renderer-wgpu", "cranpose/desktop", "dep:env_logger"]
android = ["renderer-wgpu", "cranpose/android"]
web = ["renderer-wgpu", "cranpose/web", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]

[package.metadata.cargo-shear]
ignored = ["wasm-bindgen-futures"]

[dependencies]
cranpose = { workspace = true, features = ["embedded-default-font", "video"] }
cranpose-ui = { workspace = true }
env_logger = { version = "0.11", optional = true }
log = "0.4"
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4.80", optional = true }

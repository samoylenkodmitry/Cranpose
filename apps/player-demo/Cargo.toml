[package]
name = "player-demo"
description = "A Cranpose app that plays two clips through the hardware decoder and PlayerSurface."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "player-demo"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["renderer-wgpu", "desktop"]
renderer-wgpu = ["cranpose/renderer-wgpu"]
desktop = ["cranpose/desktop", "dep:env_logger"]
android = ["renderer-wgpu", "cranpose/android"]

[dependencies]
cranpose = { workspace = true, features = ["embedded-default-font"] }
cranpose-ui = { workspace = true }
env_logger = { version = "0.11", optional = true }
log = "0.4"

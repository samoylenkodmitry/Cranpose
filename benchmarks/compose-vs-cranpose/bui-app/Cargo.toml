[package]
name = "perf-compare-bui"
version = "0.1.0"
edition = "2024"
description = "The gauntlet of the framework comparison in BUI"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
# Blender's interface as a library: its C kit rasterizes on the CPU on macOS.
blenderui = "0.5.0"
log = "0.4"
perf-data = { path = "../perf-data" }

# Its own workspace, like a real application, built as the Cranpose app is.
[workspace]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0

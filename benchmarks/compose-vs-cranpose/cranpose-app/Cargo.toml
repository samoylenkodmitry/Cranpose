[package]
name = "perf-compare-cranpose"
version = "0.1.0"
edition = "2024"
description = "Cranpose half of the Cranpose versus Jetpack Compose device comparison"
license = "Apache-2.0 OR MIT"
publish = false

# wasm-pack's wasm-opt reads the instructions rustc emits for the browser.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--all-features"]

[lib]
name = "perf_compare"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "perf-compare"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["renderer-wgpu", "desktop"]
renderer-wgpu = ["cranpose/renderer-wgpu"]
# The embedded face is what the desktop app draws in when `PERF_FONTS` names
# no Roboto files.
desktop = ["cranpose/desktop", "cranpose/embedded-default-font"]
android = ["cranpose/android", "cranpose/release-log-info"]
# The gauntlet in a browser: `wasm-pack build --target web --no-default-features
# --features web,renderer-wgpu`. The faces are embedded, as a page has no files.
web = ["cranpose/web", "dep:wasm-bindgen", "dep:wasm-logger"]

[dependencies]
cranpose = { path = "../../../crates/cranpose", default-features = false }
cranpose-core = { path = "../../../crates/cranpose-core" }
cranpose-ui = { path = "../../../crates/cranpose-ui" }
cranpose-foundation = { path = "../../../crates/cranpose-foundation" }
log = "0.4"
perf-data = { path = "../perf-data" }

wasm-bindgen = { version = "0.2", optional = true }
wasm-logger = { version = "0.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location"] }

[dev-dependencies]
cranpose-app-shell = { path = "../../../crates/cranpose-app-shell" }
cranpose-render-pixels = { path = "../../../crates/cranpose-render/pixels" }
cranpose-testing = { path = "../../../crates/cranpose-testing" }

# Its own workspace, like a real application: the release profile below is
# what the device runs, not the framework repository's.
[workspace]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0

# Crates that run off the frame path: the shader translator at pipeline
# creation and the error reporting only a failure reaches.
[profile.release.package.naga]
opt-level = "s"
[profile.release.package.codespan-reporting]
opt-level = "z"

[package]
name = "perf-compare-dioxus"
version = "0.1.0"
edition = "2024"
description = "The gauntlet of the framework comparison in Dioxus"
license = "Apache-2.0 OR MIT"
publish = false

# wasm-pack's wasm-opt reads the instructions rustc emits for the browser.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--all-features"]

[lib]
name = "perf_dioxus"
crate-type = ["cdylib", "rlib"]

[dependencies]
log = "0.4"
perf-data = { path = "../perf-data" }

# Dioxus on its desktop renderer: the system's WKWebView.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus = { version = "0.7.10", features = ["desktop"] }

# The same components on its web renderer, which patches the page's DOM
# directly instead of sending the patches to a webview.
[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
wasm-bindgen = "0.2"
wasm-logger = "0.2"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "CssStyleDeclaration", "Location"] }

# Its own workspace, like a real application, built as the Cranpose app is.
[workspace]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0

[package]
name = "perf-compare-egui"
version = "0.1.0"
edition = "2024"
description = "The gauntlet of the framework comparison in egui"
license = "Apache-2.0 OR MIT"
publish = false

# wasm-pack's wasm-opt reads the instructions rustc emits for the browser.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--all-features"]

[lib]
name = "perf_egui"
crate-type = ["cdylib", "rlib"]

[dependencies]
log = "0.4"
perf-data = { path = "../perf-data" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# egui's own native shell with its default renderer (glow) and fonts, and
# AccessKit for accessibility services, as the Android toolkits serve them.
# AccessKit's Android adapter attaches to GameActivity's view.
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "accesskit", "android-game-activity"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The same shell in a browser, on the same renderer: glow is WebGL2 there.
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location"] }

[target.'cfg(target_os = "android")'.dependencies]
# egui-winit leaves AccessKit's Android adapter out, so Android would get the
# adapter that drops every tree; this feature turns the real one on.
accesskit_winit = { version = "0.32.2", default-features = false, features = ["accesskit_android"] }
android_logger = "0.15"
winit = { version = "0.30.13", default-features = false }

# Its own workspace, like a real application, built as the Cranpose app is.
[workspace]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0

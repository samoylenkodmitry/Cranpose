[package]
name = "perf-compare-egui"
version = "0.1.0"
edition = "2024"
description = "The gauntlet of the framework comparison in egui"
license = "Apache-2.0 OR MIT"
publish = false

# wasm-pack's wasm-opt reads the instructions rustc emits for the browser.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--all-features"]

[lib]
name = "perf_egui"
crate-type = ["cdylib", "rlib"]

[dependencies]
log = "0.4"
perf-data = { path = "../perf-data" }

# On a desktop: eframe's own default renderer, wgpu, which draws through Metal
# on macOS. Its README names wgpu the default and glow the opt-in, and Apple
# deprecated OpenGL, which glow draws through.
# https://github.com/emilk/egui/blob/main/crates/eframe/README.md
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The same shell in a browser, on the same renderer: glow is WebGL2 there.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location"] }

[target.'cfg(target_os = "android")'.dependencies]
# egui's native shell on glow, which is OpenGL ES there, with AccessKit for
# accessibility services, as the Android toolkits serve them. AccessKit's
# Android adapter attaches to GameActivity's view.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit", "android-game-activity"] }
# egui-winit leaves AccessKit's Android adapter out, so Android would get the
# adapter that drops every tree; this feature turns the real one on.
accesskit_winit = { version = "0.34.1", default-features = false, features = ["accesskit_android"] }
android_logger = "0.15"
winit = { version = "0.30.13", default-features = false }

# Its own workspace, like a real application, built as the Cranpose app is.
[workspace]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0

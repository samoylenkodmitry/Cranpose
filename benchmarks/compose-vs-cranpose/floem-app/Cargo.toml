[package]
name = "perf-compare-floem"
version = "0.1.0"
edition = "2024"
description = "The gauntlet of the framework comparison in Floem"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
# Floem on its default renderer, vger.
floem = { version = "0.2.0" }
# Floem's drawing calls, for the sparkline's own view.
floem_renderer = "0.2.0"
# Encodes the avatars as PNG, the form Floem's image view decodes.
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
perf-data = { path = "../perf-data" }

# Its own workspace, like a real application, built as the Cranpose app is.
[workspace]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0

[package]
name = "perf-compare-iced"
version = "0.1.0"
edition = "2024"
description = "The gauntlet of the framework comparison in iced"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
# iced's default wgpu renderer, with the canvas for sparklines and the tilted
# badge, images for avatars, and its text API to measure the badge.
iced = { version = "0.14", features = ["canvas", "image", "advanced"] }
log = "0.4"
perf-data = { path = "../perf-data" }

# Its own workspace, like a real application, built as the Cranpose app is.
[workspace]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0

[package]
name = "perf-compare-rune"
version = "0.1.0"
edition = "2024"
description = "The gauntlet of the framework comparison in Rune"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
# Rune's own renderer on wgpu and Metal: the repository publishes no crate.
rune = { git = "https://github.com/anomalyco/rune", rev = "3ff3cc6152b9034a1d996e3a5575c51fab3b56b8" }
log = "0.4"
perf-data = { path = "../perf-data" }
gif = "0.14.2"

# Its own workspace, like a real application, built as the Cranpose app is.
[workspace]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0

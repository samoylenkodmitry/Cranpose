[package]
name = "perf-compare-slint"
version = "0.1.0"
edition = "2024"
description = "The gauntlet of the framework comparison in Slint"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "perf_slint"
crate-type = ["cdylib", "rlib"]

[dependencies]
log = "0.4"
perf-data = { path = "../perf-data" }
# Slint's Android backend renders with Skia.
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

# On a desktop: winit's window, the same Skia renderer, and fontique's
# collection to register the Roboto files the other desktop apps load. Skia
# draws through wgpu there, and Slint tells the rendering notifier a frame
# was drawn only with wgpu's API exposed.
[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-skia", "unstable-fontique-011", "unstable-wgpu-30"] }

[build-dependencies]
slint-build = "1.18.1"

# Its own workspace, like a real application, built as the Cranpose app is.
[workspace]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0

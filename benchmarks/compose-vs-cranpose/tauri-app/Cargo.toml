[package]
name = "perf-compare-tauri"
version = "0.1.0"
edition = "2024"
description = "The gauntlet of the framework comparison in Tauri"
license = "Apache-2.0 OR MIT"
publish = false

[build-dependencies]
tauri-build = "2"

[dependencies]
# Tauri on the system's WKWebView, showing the web app's page.
tauri = { version = "2.12.2" }
perf-data = { path = "../perf-data" }
serde = { version = "1", features = ["derive"] }

# Its own workspace, like a real application, built as the Cranpose app is.
[workspace]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0

[package]
name = "perf-compare-vizia"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gif = { version = "0.14.2", default-features = false, features = ["std"] }
perf-data = { version = "0.1.0", path = "../perf-data" }
resvg = { version = "0.42.0", default-features = false }
vizia = "0.4.0"

[workspace]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

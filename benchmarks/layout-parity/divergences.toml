# Machine-readable divergence ledger for benchmarks/layout-parity.
# Keep every entry synchronized with the Layout and behavioral parity section
# of docs/compose_api_parity.md.
#
# compare.py --check-ledger enforces a two-way ratchet:
#   1. Unlisted divergences, worsened deltas, non-finite bounds, missing nodes,
#      and unlisted stress failures fail the run.
#   2. Any unexpected entry that starts passing also fails the run so it gets
#      removed from this ledger and from docs/compose_api_parity.md.

[suite]
width_dp = 1760
height_dp = 980
tol_dp = 0.5
densities = ["1.0", "1.75"]

[[layout.expected]]
id = "text-line-height-and-glyph-metrics"
densities = ["1.0", "1.75"]
kind = "bounds_delta"
max_dp = 2.0
doc_ref = "docs/text.md"
reason = "SkParagraph and Cranpose text layout round font ascent, descent, and ellipsis advance differently by 0.5 to 2.0 dp."

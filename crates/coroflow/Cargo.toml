[package]
name = "coroflow"
description = "Kotlin-style coroutines and Flow for Rust, independent of any async runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
autotests = false

[dependencies]
futures-core = "0.3.32"
log = "0.4"
thiserror = "2"
web-time = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }

[lints]
workspace = true

[dev-dependencies]
criterion = "0.8.2"
futures-util = "0.3.34"
pollster = "0.4"
stats_alloc = "0.1.10"
tokio = { version = "1.53.1", features = ["rt", "sync"] }

[[bench]]
name = "comparisons"
harness = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "allocations"
path = "tests/allocations/main.rs"

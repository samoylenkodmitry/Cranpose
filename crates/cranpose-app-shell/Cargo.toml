[package]
name = "cranpose-app-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Application orchestration shell for Cranpose"

[features]
default = []
clipboard-native = ["dep:arboard"]
test-support = []

[dependencies]
cranpose-core = { workspace = true, features = ["internal"] }
cranpose-runtime-std = { workspace = true }
cranpose-render-common = { workspace = true }
cranpose-ui = { workspace = true }
cranpose-ui-graphics = { workspace = true }
cranpose-foundation = { workspace = true }
log = "0.4"
# WASM-compatible time - web-time is what winit uses internally
web-time = { workspace = true }

[dev-dependencies]
# Path-only dev-dep: stripped from the published manifest (publish order ignores dev edges).
cranpose-macros = { path = "../cranpose-macros" }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android"), not(target_os = "ios")))'.dependencies]
arboard = { version = "3.6", default-features = false, optional = true }

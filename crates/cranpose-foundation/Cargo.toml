[package]
name = "cranpose-foundation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Modifier-node, input, focus, text and semantics contracts for Cranpose UI"
autotests = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
cranpose-core = { workspace = true }
cranpose-macros = { workspace = true }
cranpose-ui-graphics = { workspace = true }
cranpose-ui-layout = { workspace = true }
smallvec = "1.16"
web-time = { workspace = true }
log = "0.4"

[features]
default = []

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "allocations"
path = "tests/allocations/main.rs"

[dev-dependencies]
stats_alloc = "0.1.10"

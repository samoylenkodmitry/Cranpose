[package]
name = "cranpose-liquid"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Glass controls, themes and motion for Cranpose apps"
autotests = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = []
localization = ["cranpose-ui/localization"]
# Month and weekday names, the first day of the week and date read-outs of
# the date picker in the app's language.
localization-formatting = ["localization", "cranpose-ui/localization-formatting"]

[dependencies]
cranpose-core = { workspace = true, features = ["internal"] }
cranpose-macros = { workspace = true }
cranpose-ui = { workspace = true }
cranpose-ui-graphics = { workspace = true }
cranpose-ui-layout = { workspace = true }
cranpose-animation = { workspace = true }
cranpose-foundation = { workspace = true }
cranpose-services = { workspace = true, default-features = false }
thiserror = "2.0.21"

[dev-dependencies]
cranpose-render-common = { path = "../cranpose-render/common", features = ["text-shaping"] }
# Path-only (no version): cargo strips path-only dev-deps from the published
# manifest, breaking the liquid -> testing -> cranpose -> liquid publish cycle.
cranpose-testing = { path = "../cranpose-testing" }

[[test]]
name = "integration"
path = "tests/integration.rs"

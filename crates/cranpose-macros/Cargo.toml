[package]
name = "cranpose-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Composable and preview macros for Cranpose"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Development builds that hot-patch code: group keys follow source structure
# rather than line numbers. Never enable in release builds.
hot-reload = []
localization = ["dep:cranpose-localization"]

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
cranpose-localization = { workspace = true, features = ["tooling"], optional = true }
proc-macro-crate = "3.5.0"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "visit", "visit-mut"] }

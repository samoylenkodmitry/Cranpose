[package]
name = "cranpose-media"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "In-process media playback backend for Cranpose (symphonia decoders, shared output device)"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
cranpose-services = { workspace = true }
log = "0.4"
parking_lot = "0.12.5"

# The output device, the real-time callback and the queue that feeds it all come
# from the audio engine, so the workspace has one device per platform rather
# than one per crate that wants to make a sound.
[target.'cfg(target_os = "android")'.dependencies]
cranpose-audio = { workspace = true, features = ["aaudio"] }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
cranpose-audio = { workspace = true, features = ["cpal-backend"] }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
symphonia = { version = "0.6.1", default-features = false, features = ["all", "opt-simd"] }

[dev-dependencies]
# Path-only dev-dep: stripped from the published manifest. Turns on the
# workspace's shared test scratch directory for this crate's own tests.
cranpose-core = { path = "../cranpose-core", features = ["test-helpers"] }

[package]
name = "cranpose-media"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "In-process media playback backend for Cranpose (symphonia decoders, shared output device)"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = ["all-codecs"]
# Symphonia containers and codecs, plus streaming Opus.
all-codecs = ["symphonia/all", "dep:opus-pure", "dep:filmcraft-ac3"]
# WAV files of PCM samples only.
wav = ["symphonia/wav", "symphonia/pcm"]

[dependencies]
cranpose-services = { workspace = true }
log = "0.4"
parking_lot = "0.12.5"

# The output device, the real-time callback and the queue that feeds it all come
# from the audio engine, so the workspace has one device per platform rather
# than one per crate that wants to make a sound.
[target.'cfg(target_os = "android")'.dependencies]
cranpose-audio = { workspace = true, features = ["aaudio"] }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
cranpose-audio = { workspace = true, features = ["cpal-backend"] }

# A remote item is read over HTTP byte ranges rather than downloaded first, so
# the decoder needs the platform's HTTP transfer and a way to block the decode
# thread on it. Both are excluded from the targets whose modules compile away.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cranpose-services = { workspace = true, features = ["http-native"] }
filmcraft-ac3 = { version = "0.9.0", optional = true }
opus-pure = { version = "0.2.2", optional = true, git = "https://github.com/samoylenkodmitry/opus-pure", rev = "cc886594b6b1a4bd11f66a69e42d9c5ed9a8ecce" }
pollster = "0.4.0"
symphonia = { version = "0.6.1", default-features = false, features = ["opt-simd"] }

[dev-dependencies]
# Path-only dev-dep: stripped from the published manifest. Turns on the
# workspace's shared test scratch directory for this crate's own tests.
cranpose-core = { path = "../cranpose-core", features = ["test-helpers"] }

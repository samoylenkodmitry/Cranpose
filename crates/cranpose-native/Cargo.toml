[package]
name = "cranpose-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable native mobile hosting runtime for Cranpose"
autotests = false

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
cranpose = { workspace = true, features = ["renderer-wgpu", "embedded-default-font"] }
cranpose-core.workspace = true
thiserror = { version = "2.0.20", default-features = false }
tokio = { version = "1.53.1", default-features = false, features = ["sync"] }
uniffi = { version = "0.32.2", default-features = false }
web-time = "1.1"

[dev-dependencies]
pollster = "0.4"

[package]
name = "cranpose-platform-esp-idf"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/samoylenkodmitry/cranpose"
readme = "README.md"
description = "Runs Cranpose applications on ESP32 displays through ESP-IDF"
publish = false
# Built, linted and formatted with the ESP-IDF demo, the workspace with the
# ESP-IDF cargo configuration.
workspace = "../../../apps/esp32-demo"

[features]
default = ["small-block-alloc"]
# Makes `SmallBlockAllocator` the global allocator. Turn it off to keep the
# standard one or to install another.
small-block-alloc = []

[dependencies]
bytemuck = "1.25"
cranpose = { path = "../../cranpose", default-features = false, features = ["framebuffer"] }
esp-idf-svc = "0.53"
log = "0.4"
thiserror = "2.0.21"

# The driver of QEMU's virtual RGB panel, which `Panel::qemu` opens.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_lcd_qemu_rgb", version = "1.0.2" }
bindings_header = "src/bindings.h"

# Thread-local lookups in a few instructions: see
# components/cranpose_fast_tls/fast_tls.c.
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/cranpose_fast_tls"]

# `Instant::now` without a 64-bit division: see
# components/cranpose_fast_time/fast_time.c.
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/cranpose_fast_time"]

# Small blocks from per-task lists: see
# components/cranpose_small_alloc/small_alloc.c.
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/cranpose_small_alloc"]

# The framework's per-frame code in IRAM: see
# components/cranpose_hot_code/README.md.
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/cranpose_hot_code"]

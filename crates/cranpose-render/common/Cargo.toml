[package]
name = "cranpose-render-common"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Scene, renderer and hit-test contracts for Cranpose backends"
autotests = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
cranpose-foundation = { workspace = true }
cranpose-ui-graphics = { workspace = true }
cranpose-ui = { workspace = true }
cranpose-text = { workspace = true }
cranpose-core = { workspace = true }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
ab_glyph_rasterizer = "0.1.10"
thiserror = "2.0.21"
smallvec = "1.16.3"
unicode-segmentation = { workspace = true }
portable-atomic.workspace = true
bytemuck = { workspace = true }

[dev-dependencies]
stats_alloc = "0.1.10"
web-time = "1.1.0"

[features]
default = ["embedded-default-font"]
# Embed NotoSansMerged (~1.3 MiB) as the fallback font used when an app
# provides no fonts. Disable to keep app-provided fonts as the only source.
embedded-default-font = []
# Fonts an app installs while it runs, such as a downloaded font pack: the
# app's fonts take them in at its next frame.
installed-fonts = []

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "allocations"
path = "tests/allocations/main.rs"

[[bench]]
name = "canvas_recording"
harness = false

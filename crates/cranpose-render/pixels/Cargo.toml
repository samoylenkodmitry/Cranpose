[package]
name = "cranpose-render-pixels"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Software renderer for Cranpose scenes and RGBA framebuffers"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = []
# Embed the framework fallback font (~1.3 MiB) used when the app provides no fonts.
embedded-default-font = ["cranpose-render-common/embedded-default-font"]
# Fonts an app installs while it runs; see `cranpose-render-common`.
installed-fonts = ["cranpose-render-common/installed-fonts"]

[dependencies]
bytemuck = { workspace = true }
cranpose-render-common = { workspace = true }
cranpose-ui = { workspace = true }
cranpose-core = { workspace = true }
cranpose-ui-graphics = { workspace = true }
log = "0.4"

[dev-dependencies]
cranpose-render-common = { workspace = true, features = ["embedded-default-font"] }
# Path-only dev-deps: stripped from the published manifest (publish order ignores dev edges).
cranpose-app-shell = { path = "../../cranpose-app-shell" }
cranpose-macros = { path = "../../cranpose-macros" }

[[test]]
name = "installed_fonts"
required-features = ["installed-fonts", "cranpose-app-shell/installed-fonts"]

[package]
name = "cranpose-services"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Multiplatform system services for Cranpose (HTTP, URI, and OS integrations)"

[dependencies]
cranpose-core = { workspace = true, features = ["internal"] }
cranpose-macros = { workspace = true }
thiserror = "2.0.18"

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
open = "5.3.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = "0.3.32"
js-sys = "0.3.91"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.64"
web-sys = { version = "0.3", features = [
    "MediaQueryList",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4.0"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "rustls"] }

[target.'cfg(target_os = "android")'.dependencies]
webbrowser = "1.1.0"
webpki-root-certs = "1.0.6"

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android"), not(target_os = "ios")))'.dependencies]
dark-light = "2.0.0"

[dev-dependencies]
pollster = "0.4.0"
webpki-root-certs = "1.0.6"

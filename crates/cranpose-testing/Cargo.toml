[package]
name = "cranpose-testing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Testing utilities and harness for Cranpose"
autotests = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = []
# Renderer-agnostic robot harness. The consuming application selects the
# desktop shell and renderer (renderer-wgpu); this
# only pulls in the shared robot API + assertions.
desktop-robot = ["cranpose/robot"]

[dependencies]
cranpose-core = { workspace = true }
cranpose-foundation = { workspace = true }
cranpose-ui = { workspace = true, features = ["test-helpers"] }
cranpose-app-shell = { workspace = true, features = ["test-support"] }
cranpose-render-common = { workspace = true }
cranpose-ui-graphics = { workspace = true }

# Dependencies for real app testing
cranpose = { workspace = true, default-features = false }

[dev-dependencies]
# Path-only dev-deps: stripped from the published manifest (publish order ignores dev edges).
cranpose-macros = { path = "../cranpose-macros" }
cranpose-ui-layout = { path = "../cranpose-ui-layout" }

 

[[test]]
name = "integration"
path = "tests/integration.rs"

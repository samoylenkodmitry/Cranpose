[package]
name = "cranpose-testing"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Composition, semantics, accessibility, and robot test utilities for Cranpose"
autotests = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = []
# The robot harness of the desktop shell. Cranpose's robot needs the desktop
# shell and the wgpu renderer, so the feature turns them on: without them the
# crate does not build on its own, as a published crate must.
desktop-robot = ["cranpose/robot", "cranpose/desktop-shell", "cranpose/renderer-wgpu"]
# The tests of `AsyncImage`, which loads through cranpose-services.
image-loading = ["cranpose/image-loading"]

[dependencies]
cranpose-core = { workspace = true }
cranpose-foundation = { workspace = true }
cranpose-ui = { workspace = true, features = ["test-helpers"] }
cranpose-app-shell = { workspace = true, features = ["test-support"] }
cranpose-render-common = { workspace = true }
cranpose-ui-graphics = { workspace = true }

# Dependencies for real app testing
cranpose = { workspace = true, default-features = false }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Path-only dev-deps: stripped from the published manifest (publish order ignores dev edges).
cranpose-macros = { path = "../cranpose-macros" }
cranpose-ui-layout = { path = "../cranpose-ui-layout" }

 

[[test]]
name = "integration"
path = "tests/integration.rs"

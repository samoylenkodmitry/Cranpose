[package]
name = "cranpose-text"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Text styles, annotated strings, fonts and paragraph settings for Cranpose"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
cranpose-ui-graphics = { workspace = true }
foldhash = "0.2.0"
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"] }
read-fonts = "0.46"
smallvec = "1.16"
thiserror = "2.0.21"

[dev-dependencies]
web-time = { workspace = true }

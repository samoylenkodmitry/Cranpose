[package]
name = "cranpose-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "UI primitives for Cranpose"

[dependencies]
cranpose-core = { workspace = true, features = ["internal"] }
cranpose-macros = { workspace = true }
cranpose-foundation = { workspace = true }
cranpose-animation = { workspace = true }
cranpose-ui-layout = { workspace = true }
cranpose-ui-graphics = { workspace = true }
smallvec = "1.15"
futures-task = "0.3"
# WASM-compatible time - web-time is what winit uses internally
web-time = "1.1"
log = "0.4"
resvg = { version = "0.45.1", default-features = false }
thiserror = "2.0.18"

[features]
default = []
# Enable test helpers like last_fling_velocity() for robot test verification.
# This adds global state for cross-thread test access, so only enable in test builds.
test-helpers = []

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "slot_table_v2"
harness = false

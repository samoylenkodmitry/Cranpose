[package]
name = "cranpose-ui"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Composable widgets, text, layouts and input for Cranpose apps"
autotests = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
cranpose-core = { workspace = true, features = ["internal"] }
cranpose-macros = { workspace = true }
cranpose-foundation = { workspace = true }
cranpose-animation = { workspace = true }
cranpose-ui-layout = { workspace = true }
cranpose-ui-graphics = { workspace = true }
cranpose-text = { workspace = true }
smallvec = "1.16"
unicode-segmentation = { workspace = true }
futures-task = "0.3"
# WASM-compatible time - web-time is what winit uses internally
web-time = { workspace = true }
log = "0.4"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"], optional = true }
thiserror = "2.0.21"
cranpose-localization = { workspace = true, optional = true }
portable-atomic.workspace = true

[features]
default = []
svg = ["dep:tiny-skia"]
inspection = ["cranpose-core/inspection"]
# Enable test helpers like last_fling_velocity() for robot test verification.
# This adds global state for cross-thread test access, so only enable in test builds.
test-helpers = []
localization = ["dep:cranpose-localization", "cranpose-macros/localization"]
localization-formatting = ["localization", "cranpose-localization/formatting"]
# Wrap Thai, Lao, Khmer and Burmese lines between words, which these scripts
# write without spaces. Adds ICU's word dictionaries for them.
southeast-asian-line-breaks = ["cranpose-text/southeast-asian-line-breaks"]
# `Hyphens.Auto` with the dictionaries an app registers.
text-hyphenation = ["cranpose-text/hyphenation"]
# `Hyphens.Auto` with the dictionaries of every language built in.
text-hyphenation-embedded = ["text-hyphenation", "cranpose-text/hyphenation-embedded"]

[dev-dependencies]
criterion = "0.8"
stats_alloc = "0.1.10"

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "localization"
harness = false
required-features = ["localization"]

[[bench]]
name = "skip_recomposition"
harness = false

[[bench]]
name = "slot_table_v2"
harness = false

[[bench]]
name = "lazy_scroll"
harness = false

[[bench]]
name = "layout_keep"
harness = false

[[bench]]
name = "scope_cost"
harness = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "allocations"
path = "tests/allocations/main.rs"

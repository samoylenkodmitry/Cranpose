[package]
name = "cranpose-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "UI primitives for Cranpose"

[dependencies]
cranpose-core = { workspace = true, features = ["internal"] }
cranpose-macros = { workspace = true }
cranpose-runtime-std = { workspace = true }
cranpose-foundation = { workspace = true }
cranpose-animation = { workspace = true }
cranpose-ui-layout = { workspace = true }
cranpose-ui-graphics = { workspace = true }
indexmap = "=2.7.1"
smallvec = "1.13"
futures-task = "0.3"
# WASM-compatible time - web-time is what winit uses internally
web-time = "1.1"
log = "0.4"
thiserror = "2.0.18"

[features]
default = []
# Enable test helpers like last_fling_velocity() for robot test verification.
# This adds global state for cross-thread test access, so only enable in test builds.
test-helpers = []

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "pipeline"
harness = false

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
open = "5.3.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.58"
web-sys = { version = "0.3", features = [
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }

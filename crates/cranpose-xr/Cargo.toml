[package]
name = "cranpose-xr"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Cranpose composables for headsets: panels in 3D through OpenXR"

[lints]
workspace = true

[features]
# The OpenXR backend: an app that starts as an immersive app on a headset. On
# Android it runs on a headset such as a Meta Quest and draws through GLES. On
# Linux and Windows it runs on the headset of any OpenXR runtime (SteamVR,
# Monado, Meta Link) and draws through Vulkan. Elsewhere the composables draw
# flat.
openxr = [
    "cranpose/renderer-wgpu",
    "dep:openxr",
    "dep:wgpu",
    "dep:pollster",
    "dep:khronos-egl",
    "dep:glow",
    "dep:android-activity",
    "dep:ash",
    "dep:thiserror",
    "dep:libc",
    "dep:windows-sys",
]

# The entitlement check of the Meta Horizon Store, which an Android headset app runs at its
# start. A failed check ends the app, as Meta requires of a store app, unless the app chooses
# `OnNotEntitled::Continue`. The app's Gradle build lists the `meta-entitlement` service, which
# adds the Meta Platform SDK and takes the app id from `cranposeMetaAppId`. Off, the build
# links and fetches nothing of the SDK. The SDK is under the Meta Platform Technologies SDK
# License Agreement (https://developers.meta.com/vr/licenses/oculussdk/), which binds whoever
# downloads or uses it, so whoever turns this feature on accepts it.
meta-entitlement = ["openxr", "cranpose/meta-entitlement"]

# Plays a scripted hand in place of the cameras' hand, and scripted controllers in place of the
# runtime's, so a build can show the pointers where no hand or controller can be tracked, such as in
# an emulator. The app installs the scripts with `script_hand` and `script_controller`. Off, the
# backend has no such code.
scripted-hand = ["openxr"]

# Taps the mixed output of the audio player and logs the level of each ear once a second, with where
# the first point source stands relative to the head. A check that a source at the left sounds in the
# left ear reads the log. Off, the mixer does no work for the tap.
audio-tap = ["openxr"]

# Times the streamed scenes' passes on the CPU and the GPU, and logs the cost once a second. Off, the
# passes run with no timing.
stream-costs = ["openxr"]

# `SpatialGltfModel`: glTF 2.0 models (`.gltf` and `.glb`) in a `SpatialVolume`. Off, the crate has
# no glTF code and none of its dependencies.
gltf = [
    "dep:basisu",
    "dep:gltf",
    "dep:image",
    "dep:base64",
    "dep:percent-encoding",
    "dep:thiserror",
]

[dependencies]
base64 = { version = "0.23.1", optional = true }
# Cranpose's basisu fork (forks/README.md), which upgrades ruzstd to 0.9.1.
# Its library is still `basisu`.
basisu = { package = "cranpose-basisu", version = "0.1.0", optional = true }
# `video`: a flat stream draws through `PlayerSurfaceIntake`.
cranpose = { workspace = true, features = ["video"] }
cranpose-animation = { workspace = true }
# The keyboard that a headset draws sends key events to the app's shell, and runs with any renderer.
cranpose-app-shell = { workspace = true }
cranpose-core = { workspace = true }
cranpose-render-common = { workspace = true }
# `allow_empty_texture` and `extensions` let a texture name its image in `KHR_texture_basisu`, as the
# controller models of a Meta Quest do.
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "allow_empty_texture", "extensions"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
log = "0.4"
percent-encoding = { version = "2.3.2", optional = true }
thiserror = { version = "2.0.21", optional = true }

# The OpenXR backend needs the platform side of Cranpose: the activity on
# Android, and on a desktop the flat window that `run` opens when the machine
# has no headset. A feature cannot depend on the target, so the target names it.
# macOS has no headset runtime, so `run` there opens the flat window.
[target.'cfg(target_os = "android")'.dependencies]
cranpose = { workspace = true, features = ["android"] }
openxr = { version = "0.22", optional = true }
khronos-egl = { version = "6", features = ["dynamic"], optional = true }
wgpu = { workspace = true, optional = true, features = ["gles", "std"] }
pollster = { version = "1.0.1", optional = true }
android-activity = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }
glow = { version = "0.18", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
cranpose = { workspace = true, features = ["desktop"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
openxr = { version = "0.22", optional = true }
wgpu = { workspace = true, optional = true, features = ["vulkan", "std"] }
pollster = { version = "1.0.1", optional = true }
ash = { version = "0.38", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_System_Performance"] }

[dev-dependencies]
cranpose = { workspace = true, features = ["renderer-wgpu", "embedded-default-font"] }
wgpu = { workspace = true }
cranpose-testing = { path = "../cranpose-testing" }

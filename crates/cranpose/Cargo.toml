[package]
name = "cranpose"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Cranpose runtime and UI facade"

[package.metadata.docs.rs]
# docs.rs builds on Linux, where the android/ios/web features cannot compile.
# Name the desktop set so the published page shows the API a reader can use.
features = ["desktop", "renderer-wgpu"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["cranpose-render-pixels"]

[features]
default = ["embedded-default-font"]
# Embed the framework fallback font (~1.3 MiB) used when the app provides no
# fonts via AppLauncher::with_fonts. Apps that bundle their own fonts should
# build with `default-features = false` to drop it from the binary.
embedded-default-font = [
    "cranpose-render-wgpu?/embedded-default-font",
    "cranpose-render-pixels?/embedded-default-font",
]
# GL/GLES fallback backend for the wgpu renderer on native targets. Desktop
# defaults to Vulkan/DX12/Metal only; enable this for machines without a
# working Vulkan driver. Android enables it automatically.
renderer-wgpu-gles = [
    "renderer-wgpu",
    "cranpose-render-wgpu/backend-gles",
]
# Desktop with both display-server backends. Size-sensitive apps can pick
# just one via desktop-x11 / desktop-wayland.
desktop = ["desktop-x11", "desktop-wayland"]
desktop-x11 = [
    "desktop-shell",
    "cranpose-platform-desktop-winit/x11",
    "winit/x11",
    "dep:x11rb",
]
desktop-wayland = [
    "desktop-shell",
    "cranpose-platform-desktop-winit/wayland",
    "winit/wayland",
    "winit/wayland-dlopen",
    "winit/wayland-csd-adwaita",
]
# Internal: the winit desktop shell shared by the per-backend features. Use
# desktop / desktop-x11 / desktop-wayland instead of enabling this directly.
# Enables the desktop service backends (URI opener, file picker, system
# theme) so apps get working services without re-listing cranpose-services
# features themselves.
desktop-shell = [
    "cranpose-app-shell/clipboard-native",
    "cranpose-platform-desktop-winit",
    "dep:winit",
    "dep:accesskit",
    "cranpose-services/uri-native",
    "cranpose-services/file-picker-native",
    "cranpose-services/system-theme",
    "cranpose-services/notifier-native",
]
ios = [
    "cranpose-platform-desktop-winit",
    "dep:winit",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-ui-kit",
    "dep:objc2-uniform-type-identifiers",
    "dep:objc2-user-notifications",
    "dep:block2",
    "dep:dispatch2",
    "dep:objc2-av-foundation",
    "dep:objc2-core-media",
    "dep:objc2-core-video",
    "dep:objc2-core-foundation",
    "dep:objc2-avf-audio",
    "dep:objc2-media-player",
]
android = [
    "cranpose-platform-android",
    "cranpose-render-wgpu?/backend-gles",
    "cranpose-services/uri-android",
]
web = [
    "cranpose-platform-web",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "dep:js-sys",
    "cranpose-services/uri-web",
    "cranpose-services/file-picker-web",
    "cranpose-services/system-theme-web",
    "cranpose-services/preferences-web",
]
# The real-time audio engine (`cranpose_audio`), registered into
# `cranpose_services::audio`. Off by default: an app that plays no sound should
# not carry a mixer or an output device. On Android this is the AAudio backend,
# which needs no Java glue.
audio = ["dep:cranpose-audio", "cranpose-audio/aaudio"]
# Adds the desktop output device (cpal) so sound works while developing on
# macOS, Windows or Linux. Linux builds need the ALSA development headers.
audio-desktop = ["audio", "cranpose-audio/cpal-backend"]
# Desktop camera capture on macOS, through the same `AVCaptureSession` stack
# the iOS backend uses, so the two share one file. Off by default: an
# application that opens no camera should not link AVFoundation. Linux and
# Windows have no desktop camera backend yet, and there this compiles away.
# A Mac only hands frames to a signed, bundled application carrying
# `NSCameraUsageDescription`; a bare executable is refused by the system, not
# by this code.
camera-desktop = [
    "dep:objc2",
    "dep:block2",
    "dep:dispatch2",
    "dep:objc2-av-foundation",
    "dep:objc2-core-media",
    "dep:objc2-core-video",
]
# The in-process media backend (`cranpose_media`), registered into
# `cranpose_services::media`. Off by default because it links a system audio
# library on desktop (ALSA on Linux, CoreAudio on macOS, WASAPI on Windows) and
# carries the `symphonia` decoders everywhere. On Android it is what decodes:
# the platform's own `MediaPlayer` cannot read a document a provider streams,
# and the Android backend wraps this one with the media session. iOS and the web
# use their platform stack, and there the backend compiles away.
media = ["dep:cranpose-media"]
renderer-pixels = ["cranpose-render-pixels"]
renderer-wgpu = ["cranpose-render-wgpu", "dep:wgpu", "dep:pollster"]
# App-defined WGSL RuntimeShaders on the slim renderer (naga at runtime,
# ~0.7 MiB). On by default; drop via `default-features = false` if the app
# uses only framework effects.
robot = ["cranpose-app-shell/test-support"] # Enable robot testing support (cranpose-ui now always included)
# In-app purchases through StoreKit 2 on iOS/macOS, registered into
# `cranpose_services::purchases`. Off by default: it links the StoreKit
# framework and compiles a Swift shim, which an app that sells nothing should
# not pay for. Harmless to enable on non-Apple targets — it compiles away.
storekit = ["dep:cranpose-storekit"]
# In-app purchases through Google Play Billing on Android and Wear OS,
# registered into `cranpose_services::purchases`. Off by default: the bridge
# expects the app's Gradle build to add the Play Billing dependency and the
# `crates/cranpose/android/java-billing` source directory, which an app that
# sells nothing should not carry. Harmless to enable on other targets — the
# whole backend is Android-only and compiles away.
playbilling = []

[dependencies]
cranpose-app-shell = { workspace = true }
cranpose-audio = { workspace = true, optional = true }
cranpose-core = { workspace = true }
cranpose-media = { workspace = true, optional = true }
cranpose-ui = { workspace = true }
cranpose-platform-desktop-winit = { workspace = true, optional = true }
cranpose-platform-android = { workspace = true, optional = true }
cranpose-platform-web = { workspace = true, optional = true }
cranpose-render-pixels = { workspace = true, optional = true }
cranpose-render-wgpu = { workspace = true, optional = true }
pollster = { version = "0.4", optional = true }
winit = { version = "0.31.0-beta.2", optional = true, default-features = false }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Location",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "DomRect",
    "CanvasRenderingContext2d",
    "Performance",
    "MouseEvent",
    "EventTarget",
    "Touch",
    "TouchList",
    "TouchEvent",
    "PointerEvent",
    "WheelEvent",
    "KeyboardEvent",
    "CssStyleDeclaration",
    # Clipboard support
    "Navigator",
    "Clipboard",
    "ClipboardEvent",
    "DataTransfer",
    # Dropped files (`web_drop`)
    "DragEvent",
    "FileList",
    # Battery Status API (`web_power`)
    "BatteryManager",
    # IME composition support (hidden textarea + composition events)
    "CompositionEvent",
    "HtmlTextAreaElement",
    "Node",
    # System theme (prefers-color-scheme live updates)
    "MediaQueryList",
    "MediaQueryListEvent",
    # Web Share API
    "ShareData",
    "File",
    "FilePropertyBag",
    # Notifications API
    "Notification",
    "NotificationOptions",
    "NotificationPermission",
    # Media playback (`web_media`): the element, the lock-screen artwork blob,
    # and the Web Audio graph a visualiser reads.
    "HtmlMediaElement",
    "HtmlAudioElement",
    "TimeRanges",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "BaseAudioContext",
    "AudioContext",
    "AudioNode",
    "AudioDestinationNode",
    "AnalyserNode",
    "MediaElementAudioSourceNode",
    "AudioParam",
    "GainNode",
    "BiquadFilterNode",
    "BiquadFilterType",
] }
js-sys = { version = "0.3", optional = true }
log = "0.4"
cranpose-liquid = { workspace = true }
cranpose-services = { workspace = true, default-features = false }
cranpose-storekit = { workspace = true, default-features = false, optional = true }
thiserror = "2.0.18"
web-time = { workspace = true }
cranpose-render-common.workspace = true
raw-window-handle = "0.6"
accesskit = { version = "0.24.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
# Awaits the Async Clipboard API's promises (`web_clipboard`).
wasm-bindgen-futures = "0.4"
wgpu = { version = "29.0", optional = true, default-features = false, features = [
    "std",
    "webgpu",
    "webgl",
    "wgsl",
] }

# The process readings in `process_info`: `getrusage`, `sysconf`, and on the
# platforms that have them `mallopt` and `os_proc_available_memory`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { workspace = true }
android_logger = "0.15"
jni = "0.22.4"
ndk = "0.9.0"
# Raw AChoreographer bindings for the vsync-phase probe in
# `android_frame_telemetry`; the safe `ndk` crate does not wrap it.
ndk-sys = "0.6.0"
raw-window-handle = "0.6"
zune-core = "0.5.3"
zune-jpeg = "0.5.15"
wgpu = { version = "29.0", optional = true, default-features = false, features = [
    "std",
    "parking_lot",
    "vulkan",
] }

[target.'cfg(all(target_os = "linux", not(target_arch = "wasm32")))'.dependencies]
accesskit_unix = { version = "0.22.1", default-features = false, features = ["async-io"] }
x11rb = { version = "0.13.2", optional = true }
wgpu = { version = "29.0", optional = true, default-features = false, features = [
    "std",
    "parking_lot",
    "vulkan",
] }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = "0.34.0"
wgpu = { version = "29.0", optional = true, default-features = false, features = [
    "std",
    "parking_lot",
    "dx12",
] }

# Both Apple targets, which share a kernel and therefore share these.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# Raw Mach task-info bindings, used by `process_info.rs` to read this
# process's resident memory: Darwin has no `/proc` for a process to read its
# own footprint from, so the Linux/Android path's `/proc/self/statm` has no
# Apple equivalent short of the same kernel call every Instruments memory
# gauge uses.
mach2 = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = "0.26.3"
# Thermal pressure. `NSProcessInfo` is Foundation rather than UIKit, so the
# reading a Mac gives is the same one iOS gives and needs no second mapping.
# The collection types below that are the camera's (`camera-desktop`): this
# entry is not optional, so the classes it names are listed here rather than
# added by the feature.
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSObject",
    "NSProcessInfo",
    "NSString",
    "NSValue",
] }
# The macOS half of the AVFoundation camera (`camera-desktop`). Same crates
# and same versions the iOS backend takes, so a Mac build adds no dependency
# the workspace does not already resolve.
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
dispatch2 = { version = "0.3", optional = true }
objc2-av-foundation = { version = "0.3", default-features = false, optional = true, features = [
    "dispatch2",
    "std",
    "block2",
    "objc2-core-media",
    "AVCaptureSession",
    "AVCaptureSessionPreset",
    "AVCaptureDevice",
    "AVCaptureInput",
    "AVCaptureOutput",
    "AVCaptureOutputBase",
    "AVCaptureVideoDataOutput",
    "AVCapturePhotoOutput",
    "AVMediaFormat",
    "AVVideoSettings",
] }
objc2-core-media = { version = "0.3", default-features = false, optional = true, features = [
    "std",
    "objc2-core-video",
    "CMSampleBuffer",
] }
objc2-core-video = { version = "0.3", default-features = false, optional = true, features = [
    "std",
    "CVBase",
    "CVPixelBuffer",
    "CVImageBuffer",
    "CVBuffer",
    "CVReturn",
] }
wgpu = { version = "29.0", optional = true, default-features = false, features = [
    "std",
    "parking_lot",
    "metal",
] }

[target.'cfg(target_os = "ios")'.dependencies]
wgpu = { version = "29.0", optional = true, default-features = false, features = [
    "std",
    "parking_lot",
    "metal",
] }
# iOS file picker (UIDocumentPickerViewController). Only pulled in with the
# `ios` feature.
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", default-features = false, optional = true, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSNotification",
    "NSObject",
    "NSBundle",
    "NSPathUtilities",
    "NSProcessInfo",
    "NSSet",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-ui-kit = { version = "0.3", default-features = false, optional = true, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "objc2-uniform-type-identifiers",
    "UIGeometry",
    "UIScreen",
    "UIActivity",
    "UIActivityViewController",
    "UIAccessibility",
    "UIAccessibilityConstants",
    "UIAccessibilityContainer",
    "UIAccessibilityElement",
    "UIAccessibilityIdentification",
    "UIApplication",
    "UIDevice",
    "UIDocumentPickerViewController",
    "UIFeedbackGenerator",
    "UIImage",
    "UIImagePickerController",
    "UIImpactFeedbackGenerator",
    "UINavigationController",
    "UINotificationFeedbackGenerator",
    "NSText",
    "UIPasteboard",
    "UIPopoverPresentationController",
    "UIPresentationController",
    "UIResponder",
    "UIGestureRecognizerSubclass",
    "UIScreenEdgePanGestureRecognizer",
    "UIGestureRecognizer",
    "UIPanGestureRecognizer",
    "UIScene",
    "UISceneSession",
    "UISelectionFeedbackGenerator",
    "UITextInput",
    "UITextInput",
    "UITextInputTraits",
    "UIKeyboardLayoutGuide",
    "UILayoutGuide",
    "UITrackingLayoutGuide",
    "UIView",
    "UIViewController",
    "UIWindow",
    "UIWindowScene",
] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, optional = true, features = [
    "std",
    "UTCoreTypes",
    "UTType",
] }
block2 = { version = "0.6", optional = true }
dispatch2 = { version = "0.3", optional = true }
objc2-core-foundation = { version = "0.3", default-features = false, optional = true, features = ["std", "CFCGTypes"] }
objc2-av-foundation = { version = "0.3", default-features = false, optional = true, features = [
    "dispatch2",
    "std",
    "block2",
    "objc2-core-media",
    "AVCaptureSession",
    "AVCaptureSessionPreset",
    "AVCaptureDevice",
    "AVCaptureInput",
    "AVCaptureOutput",
    "AVCaptureOutputBase",
    "AVCaptureVideoDataOutput",
    "AVCapturePhotoOutput",
    "AVMediaFormat",
    "AVVideoSettings",
] }
objc2-core-media = { version = "0.3", default-features = false, optional = true, features = [
    "std",
    "objc2-core-video",
    "CMSampleBuffer",
] }
objc2-core-video = { version = "0.3", default-features = false, optional = true, features = [
    "std",
    "CVBase",
    "CVPixelBuffer",
    "CVImageBuffer",
    "CVBuffer",
    "CVReturn",
] }
objc2-user-notifications = { version = "0.3", default-features = false, optional = true, features = [
    "std",
    "block2",
    "UNUserNotificationCenter",
    "UNNotification",
    "UNNotificationRequest",
    "UNNotificationContent",
    "UNNotificationResponse",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNError",
] }
# Media playback (`ios_media`): AVAudioPlayer for the item, AVAudioSession for
# interruptions, and MediaPlayer for the lock screen and the remote commands.
objc2-avf-audio = { version = "0.3.2", default-features = false, optional = true, features = [
    "std",
    "AVAudioPlayer",
    "AVAudioSession",
    "AVAudioSessionRoute",
    "AVAudioSessionTypes",
] }
objc2-media-player = { version = "0.3.2", default-features = false, optional = true, features = [
    "std",
    "block2",
    "MPMediaItem",
    "MPNowPlayingInfoCenter",
    "MPRemoteCommand",
    "MPRemoteCommandCenter",
    "MPRemoteCommandEvent",
] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android"), not(target_os = "linux"), not(target_os = "windows"), not(target_os = "macos"), not(target_os = "ios")))'.dependencies]
wgpu = { version = "29.0", optional = true, default-features = false, features = [
    "std",
    "parking_lot",
    "vulkan",
] }

[dev-dependencies]
# Path-only dev-dep: stripped from the published manifest. Turns on the
# workspace's shared test scratch directory for this crate's own tests.
cranpose-core = { path = "../cranpose-core", features = ["test-helpers"] }

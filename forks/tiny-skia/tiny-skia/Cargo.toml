[package]
edition = "2021"
name = "cranpose-tiny-skia"
version = "0.12.0"
authors = ["Yevhenii Reizner <razrfalcon@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Cranpose's fork of tiny-skia: a tiny Skia subset ported to Rust."
documentation = "https://docs.rs/tiny-skia/"
readme = "README.md"
keywords = [
    "2d",
    "rendering",
    "skia",
]
categories = ["rendering"]
license = "BSD-3-Clause"
repository = "https://github.com/samoylenkodmitry/Cranpose"

[features]
default = [
    "std",
    "simd",
    "png-format",
]
no-std-float = ["tiny-skia-path/no-std-float"]
png-format = [
    "std",
    "dep:png",
]
simd = []
std = ["tiny-skia-path/std"]

[lib]
name = "tiny_skia"
path = "src/lib.rs"

[dependencies.arrayref]
version = "0.3.9"

[dependencies.arrayvec]
version = "0.7"
default-features = false

[dependencies.bytemuck]
version = "1.24"
features = ["aarch64_simd"]

[dependencies.cfg-if]
version = "1"

[dependencies.log]
version = "0.4"

[dependencies.png]
version = "0.18"
optional = true

[dependencies.tiny-skia-path]
version = "0.12.0"
default-features = false

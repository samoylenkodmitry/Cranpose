id: unsafe-outside-boundary-modules
language: rust
severity: warning
message: Unsafe code stays in the reviewed platform boundary modules this rule ignores; a new FFI file is reviewed and added to the list.
rule:
  any:
    - kind: unsafe_block
    - kind: function_modifiers
      regex: \bunsafe\b
    - kind: impl_item
      regex: ^unsafe\s
    - kind: trait_item
      regex: ^unsafe\s
    - kind: foreign_mod_item
      regex: ^unsafe\s
    - kind: attribute_item
      regex: \b(allow|expect)\s*\([^)]*\bunsafe_code\b
    - kind: inner_attribute_item
      regex: \b(allow|expect)\s*\([^)]*\bunsafe_code\b
ignores:
  - crates/cranpose-audio/src/backend/aaudio.rs
  - crates/cranpose-audio/src/backend/avaudio.rs
  - crates/cranpose-audio/src/ring.rs
  - crates/cranpose-macros/src/branch_groups.rs
  - crates/cranpose-macros/src/tests/branch_groups_tests.rs
  - crates/cranpose-platform/esp-idf/src/panel.rs
  - crates/cranpose-platform/esp-idf/src/small_alloc.rs
  - crates/cranpose-platform/esp-idf/src/touch.rs

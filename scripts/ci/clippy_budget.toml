# Sites left for each lint that `scripts/ci/clippy_budget.py` turns on.
# A count only goes down: lower it in the commit that removes sites, and move
# a lint to `[workspace.lints]` in Cargo.toml once its count reaches zero.

[lints]
"clippy::allow_attributes_without_reason" = 259
"clippy::cast_possible_truncation" = 1036
"clippy::cast_sign_loss" = 571
"clippy::disallowed_methods" = 196
"clippy::disallowed_types" = 183
"clippy::float_cmp" = 158
"clippy::fn_params_excessive_bools" = 6
"clippy::inline_always" = 63
"clippy::iter_over_hash_type" = 35
"clippy::let_underscore_must_use" = 270
"clippy::let_underscore_untyped" = 708
"clippy::missing_assert_message" = 191
"clippy::multiple_inherent_impl" = 121
"clippy::needless_pass_by_value" = 180
"clippy::print_stderr" = 122
"clippy::print_stdout" = 122
"clippy::ref_option" = 18
"clippy::significant_drop_tightening" = 203
"clippy::string_add" = 2
"clippy::string_slice" = 277
"clippy::too_many_lines" = 114
"clippy::trivially_copy_pass_by_ref" = 31
"clippy::unused_result_ok" = 33
"clippy::wildcard_imports" = 33
"unreachable_pub" = 734

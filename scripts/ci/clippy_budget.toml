# Sites left for each lint that `scripts/ci/clippy_budget.py` turns on.
# A count only goes down: lower it in the commit that removes sites, and move
# a lint to `[workspace.lints]` in Cargo.toml once its count reaches zero.

[lints]
"clippy::cast_possible_truncation" = 960
"clippy::cast_sign_loss" = 511
"clippy::disallowed_methods" = 163
"clippy::float_cmp" = 150
"clippy::fn_params_excessive_bools" = 5
"clippy::inline_always" = 63
"clippy::iter_over_hash_type" = 31
"clippy::let_underscore_must_use" = 262
"clippy::let_underscore_untyped" = 672
"clippy::missing_assert_message" = 181
"clippy::needless_pass_by_value" = 166
"clippy::ref_option" = 16
"clippy::significant_drop_tightening" = 198
"clippy::string_slice" = 219
"clippy::too_many_lines" = 97
"clippy::trivially_copy_pass_by_ref" = 29
"clippy::unused_result_ok" = 31
"clippy::wildcard_imports" = 33
